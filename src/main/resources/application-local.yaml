spring:
  application:
    name: bangjjack
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: http://localhost:8080/auth/login/google
            authorization-grant-type: authorization_code
            scope:
              - profile
              - email
  data:
    redis:
      host: localhost
      port: 6379

server-uri: http://localhost:8080
front-uri: http://localhost:5173

jwt:
  access:
    secret: ${JWT_ACCESS}
    expiration-seconds: 259200

ai:
  match-api:
    base-url: ${AI_MATCH_API_BASE_URL}
    connect-timeout: 3000
    read-timeout: 5000
    read-timeout-batch: 10000
    recommended-top-k: 10
    recommended-cache-ttl: 21600
    recommended-roommates-top-k: 3
    recommended-roommates-cache-ttl: 21600

logging:
  level:
    com.project.bangjjack.global.config.websocket: DEBUG
    com.project.bangjjack.domain.chat: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.messaging.simp: DEBUG

dev:
  secret: ${DEV_SECRET:local-dev-secret}
