# PostPriority Entity
# Last Updated: 2026-05-05

entity: POST_PRIORITY
description: >
  모집글 작성 시점의 룸메이트 선호도 우선순위 스냅샷.
  RoommatePost와 1:1 관계를 맺으며, 작성 당시의 우선순위 3개를 저장함.
  RoommatePreference 엔티티와 동일한 구조를 가짐.
table: post_priorities
domain: Post
extends: BaseEntity

columns:
  - post_id:
      type: BIGINT
      nullable: false
      unique: true
      fk: roommate_posts.id
      description: "모집글 FK (1:1)"
  - first_priority:
      type: VARCHAR(30)
      nullable: false
      enum: RoommatePreferenceFactor
      description: "1순위 중요 항목"
  - second_priority:
      type: VARCHAR(30)
      nullable: false
      enum: RoommatePreferenceFactor
      description: "2순위 중요 항목"
  - third_priority:
      type: VARCHAR(30)
      nullable: false
      enum: RoommatePreferenceFactor
      description: "3순위 중요 항목"

relationships:
  - type: OneToOne
    target: RoommatePost
    fk: post_id
    fetch: LAZY
    description: "소속 모집글"

business_logic:
  - "create(post, firstPriority, secondPriority, thirdPriority): 정적 팩토리 메서드"
  - "UseCase에서 작성자의 현재 Preference를 조회하여 이 엔티티로 스냅샷 저장"

note:
  - "기존 1:N 구조에서 1:1 스냅샷 구조로 변경됨 (RoommatePreference와 구조적 일관성 유지)"
