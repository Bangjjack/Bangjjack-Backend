# Chat Entity
# Last Updated: 2026-05-20

entity: CHAT
description: 채팅 메시지를 관리합니다. 유저 간 메시지(USER)와 시스템 자동 발송 메시지(APPLICATION_*, GROUP_DISBANDED, SYSTEM)를 messageType으로 구분합니다.
table: chat
domain: Chat
extends: BaseEntity  # → references/data-model/base/base-entity.yaml

status: IMPLEMENTED

columns:
  - user_id:
      type: BIGINT
      nullable: false
      fk: users.id
      description: 메시지 발신자 ID
  - room_id:
      type: BIGINT
      nullable: false
      fk: chat_room.id
      description: 소속 채팅방 FK
  - content:
      type: TEXT
      nullable: false
      description: 메시지 내용
  - message_type:
      type: VARCHAR(30)
      nullable: false
      enum: MessageType
      enum_values: [ USER, APPLICATION_SENT, APPLICATION_ACCEPTED, APPLICATION_REJECTED, GROUP_DISBANDED, SYSTEM ]
      description: >
        메시지 유형. 프론트엔드가 content 파싱 없이 타입만으로 UI 분기 가능.
        USER=유저 간 일반 메시지,
        APPLICATION_SENT=룸메이트 신청,
        APPLICATION_ACCEPTED=룸메이트 수락,
        APPLICATION_REJECTED=룸메이트 거절,
        GROUP_DISBANDED=그룹 해체 알림,
        SYSTEM=기타 시스템 메시지(범용 fallback)

indexes:
  - name: IDX_chat_room_id
    columns: [ room_id, id ]
    type: INDEX
    note: 채팅방 메시지 커서 기반 페이지네이션 조회 시 사용

relationships:
  - type: ManyToOne
    target: ChatRoom
    fk: room_id
    fetch: LAZY
  - type: ManyToOne
    target: User
    fk: user_id
    fetch: LAZY

message_type_usage:
  USER: ChatMessageUseCase.sendMessage() — 유저가 WebSocket으로 전송
  APPLICATION_SENT: RoommateApplicationUseCase.createApplication()
  APPLICATION_ACCEPTED: RoommateApplicationUseCase.processApplication() — ACCEPTED
  APPLICATION_REJECTED: RoommateApplicationUseCase.processApplication() — REJECTED
  GROUP_DISBANDED: RoommateGroupDisbandedNotifier.sendDirectSystemMessage()
  SYSTEM: 미래 확장용 범용 fallback

note: >
  ChatRoomParticipant.last_read_message_id가 이 테이블의 id를 참조한다.
  읽음 처리/알림 기능 구현 시 별도 스펙 문서 작성 필요.
