# Chat Entity
# Last Updated: 2026-05-08

entity: CHAT
description: 채팅 메시지를 관리합니다.
table: chat
domain: Chat
extends: BaseEntity  # → references/data-model/base/base-entity.yaml

status: IMPLEMENTED

columns:
  - user_id:
      type: BIGINT
      nullable: false
      fk: users.id
      description: 메시지 발신자 ID
  - room_id:
      type: BIGINT
      nullable: false
      fk: chat_room.id
      description: 소속 채팅방 FK
  - content:
      type: TEXT
      nullable: false
      description: 메시지 내용
  - type:
      type: VARCHAR(20)
      nullable: false
      description: 메시지 타입 (TEXT, IMAGE, SYSTEM)

indexes:
  - name: IDX_chat_room_id_id_desc
    columns: [ room_id, id DESC ]
    type: INDEX
    note: 채팅방 메시지 페이지네이션 조회 시 사용

relationships:
  - type: ManyToOne
    target: ChatRoom
    fk: room_id
    fetch: LAZY
  - type: ManyToOne
    target: User
    fk: user_id
    fetch: LAZY

note: >
  ChatRoomParticipant.last_read_message_id가 이 테이블의 id를 참조한다.
  현재 TEXT 타입만 지원하며, 향후 이미지 및 시스템 메시지 처리를 위해 type 필드를 사용한다.
