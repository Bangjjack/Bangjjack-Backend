# Feature Specification
# Status: Implemented
# Last Updated: 2026-05-08

meta:
  id: FEAT-CHAT-003
  title: 채팅방 메시지 수신 구독
  type: Feature
  author: xEzIxX

overview:
  summary: >
    채팅 클라이언트가 채팅방 토픽을 구독하면, 서버는 커밋 완료된 메시지만
    /sub/chat-rooms/{roomId} 채널로 실시간 브로드캐스트한다.
  user_story: >
    As a 채팅방 참여자, I want to 채팅방 메시지를 실시간으로 수신하고 싶다,
    so that 새 메시지를 새로고침 없이 즉시 확인할 수 있다.
  goals:
    - 채팅 메시지는 DB 커밋 이후에만 구독자에게 전달되어야 한다
    - 브로드캐스트 페이로드는 클라이언트 렌더링에 필요한 발신자 정보와 메시지 메타데이터를 포함해야 한다
    - 멀티 인스턴스 환경에서도 동일 roomId 구독자에게 메시지가 fan-out 되어야 한다
    - 발신자 ACK 채널과 전체 구독자 브로드캐스트 채널의 계약을 분리해야 한다

technical_spec:
  api:
    - protocol: WebSocket(STOMP)
      direction: subscribe
      destination: /sub/chat-rooms/{roomId}
      summary: 채팅방 메시지 실시간 수신 구독
      auth: AUTHENTICATED (STOMP CONNECT 헤더의 Bearer JWT)
      request:
        dto: None
        fields:
          - name: roomId
            type: Long
            required: true
            validation: "STOMP destination path variable"
      response:
        dto: ChatMessageResponse
        fields:
          - name: messageId
            type: Long
            note: "DB 저장 완료된 메시지 식별자"
          - name: roomId
            type: Long
          - name: senderId
            type: Long
          - name: senderNickname
            type: String
          - name: senderProfileImage
            type: String
            note: "nullable 가능"
          - name: content
            type: String
          - name: type
            type: MessageType
            note: "현재 TEXT, 향후 SYSTEM/IMAGE 등 확장 가능"
          - name: createdAt
            type: LocalDateTime
      notes:
        - "구독 자체에 대한 별도 ACK는 없다"
        - "브로드캐스트는 발신자 포함 전체 구독자에게 동일 payload로 전달된다"
        - "발신자 개인 ACK(/user/queue/messages/ack)는 FEAT-CHAT-002에서 정의한다"

  data_flow:
    - step: 1
      layer: Client
      action: "클라이언트가 /ws로 STOMP CONNECT 후 /sub/chat-rooms/{roomId}를 SUBSCRIBE 한다"

    - step: 2
      layer: Infrastructure (StompAuthChannelInterceptor)
      action: "CONNECT 프레임의 Authorization 헤더에서 Bearer JWT를 검증하고 Principal(userId)을 세션에 저장한다"

    - step: 3
      layer: Application Event Listener (ChatMessageSavedEventListener)
      action: "메시지 저장 트랜잭션이 커밋된 뒤 AFTER_COMMIT 리스너가 ChatMessageSavedEvent를 수신한다"

    - step: 4
      layer: Infrastructure (ChatRedisPublisher)
      action: "ChatMessageResponse.from(event)로 응답 DTO를 만든 뒤 Redis topic chat.room.{roomId}에 JSON publish 한다"

    - step: 5
      layer: Infrastructure (ChatRedisSubscriber)
      action: "모든 서버 인스턴스가 pattern topic chat.room.* 를 구독하고 JSON을 ChatMessageResponse로 역직렬화한다"

    - step: 6
      layer: Infrastructure (SimpMessagingTemplate)
      action: "/sub/chat-rooms/{roomId} destination 으로 convertAndSend 하여 현재 연결된 STOMP 구독자들에게 fan-out 한다"

  validation_rules:
    - "WebSocket 연결은 STOMP CONNECT 헤더의 Bearer JWT가 있어야 한다"
    - "브로드캐스트 대상 메시지는 DB 커밋이 완료된 이벤트만 허용한다"
    - "브로드캐스트 payload는 ChatMessageSavedEvent의 roomId와 동일한 destination 으로만 전달된다"
    - "역직렬화 실패 메시지는 브로드캐스트하지 않고 서버 로그만 남긴다"
    - "현재 구현은 SUBSCRIBE 시점의 roomId 존재 여부 및 참여자 권한을 검증하지 않는다"

  error_handling:
    channels:
      - destination: /user/queue/errors
        usage: "메시지 SEND 처리 중 비즈니스 예외 응답용이며, 구독 자체 오류 응답용은 아님"
      - destination: STOMP ERROR frame
        usage: "CONNECT 인증 실패 등 세션 수립 단계 오류"
    cases:
      - trigger: "Authorization 헤더 누락 또는 Bearer 형식 불일치"
        result: "CONNECT 실패, 세션 수립 불가"
      - trigger: "JWT 파싱 실패"
        result: "CONNECT 실패, 세션 수립 불가"
      - trigger: "Redis 수신 JSON 역직렬화 실패"
        result: "해당 메시지 폐기, error log 기록"

testing_strategy:
  happy_path:
    - "유효한 JWT로 CONNECT 후 /sub/chat-rooms/{roomId} 구독 상태에서 메시지 전송 시 ChatMessageResponse를 수신한다"
    - "수신 payload의 messageId, roomId, senderId, content, createdAt 이 저장 결과와 일치한다"
    - "여러 서버 인스턴스 환경에서도 Redis pub/sub를 통해 동일 roomId 구독자에게 메시지가 전파된다"

  edge_cases:
    - "DB 롤백 발생 시 AFTER_COMMIT 리스너가 실행되지 않아 브로드캐스트가 발생하지 않는다"
    - "senderProfileImage가 null 이어도 브로드캐스트 payload 직렬화/역직렬화가 정상 동작한다"
    - "같은 사용자가 ACK 채널과 방 구독 채널을 동시에 수신할 때 clientTempId 기준 중복 제거 없이도 messageId 기준 병합 가능하다"

  error_cases:
    - "Authorization 헤더 없이 CONNECT 시 세션 연결 실패"
    - "손상된 Redis payload 수신 시 해당 메시지가 브로드캐스트되지 않는다"
    - "현재 구현상 비참여자도 destination 문자열만 알면 SUBSCRIBE 자체는 가능하므로, 추후 권한 검증 보강 테스트가 필요하다"

notes:
  - "실시간 수신 계약의 실제 payload 타입은 ChatMessageResponse 이다."
  - "브로드캐스트 destination 은 WebSocket simple broker prefix(/sub)를 사용한다."
  - "메시지 저장/ACK 계약은 FEAT-CHAT-002에서 정의한다."
  - "현재 코드는 SEND 시점에는 권한 검증을 수행하지만 SUBSCRIBE 시점 권한 검증 인터셉터는 없다."
  - "보안 강화를 위해 향후 SUBSCRIBE 프레임의 roomId별 참여자 검증 또는 user-specific destination 전략 검토가 필요하다."
