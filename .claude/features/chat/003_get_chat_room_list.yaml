# Feature Specification: 내 채팅방 목록 조회
# Status: Done
# Last Updated: 2026-05-23

meta:
  id: FEAT-CHAT-003
  title: 내 채팅방 목록 조회
  type: Feature
  author: Claude

overview:
  summary: >
    로그인 유저가 참여 중인 채팅방 목록을 최신 메시지 순으로 커서 페이지네이션 조회
  user_story: >
    As a 로그인 유저, I want to 내 채팅방 목록을 보고 싶다,
    so that 대화 상대와 읽지 않은 메시지를 한눈에 확인할 수 있다.
  goals:
    - 최신 메시지 순 내림차순 정렬 (메시지 없는 방은 맨 뒤)
    - ALL / APPLICATION 필터 지원
    - 커서 기반 페이지네이션 (스크롤 UX)
    - 상대방 프로필, 마지막 메시지, unreadCount 포함

technical_spec:
  api:
    - method: GET
      path: /api/v1/chat-rooms
      summary: 내 채팅방 목록 조회
      auth: AUTHENTICATED (JWT)
      request:
        dto: QueryParameter
        fields:
          - name: category
            type: ChatRoomCategory (GENERAL | APPLICATION)
            required: false
            default: null (전체 조회)
            note: null이면 category 조건 없이 전체 조회
          - name: cursor
            type: String (opaque Base64)
            required: false
            note: >
              서버가 발급한 nextCursor 값을 그대로 전달.
              내부 포맷: Base64Url(roomId:lastMessageAt ISO string).
              클라이언트는 내부 구조를 파싱하지 않고 그대로 돌려줌.
          - name: size
            type: int
            required: false
            default: 20
            validation: min=1, max=50
      response:
        dto: ChatRoomListResponse
        wrapper: CommonResponse<ChatRoomListResponse>
        fields:
          - rooms: List<ChatRoomSummaryResponse>
          - nextCursor: String (nullable, opaque Base64)
          - hasNext: boolean

  data_flow:
    - step: 1
      layer: Presentation (ChatRoomController)
      action: JWT → currentMemberId, category/cursor/size 파라미터 수신 → UseCase 위임
    - step: 2
      layer: UseCase (ChatRoomUseCase.getMyChatRooms)
      action: >
        cursor를 decodeCursor()로 ChatRoomCursor(roomId, lastMessageAt)로 변환.
        findMyDirectParticipantsPage()로 내 participant 목록을 정렬된 채로 조회 (size+1).
        size+1 기반 hasNext 판별 후 page로 자르기.
        findPartnerIdsByDirectRoomIds()로 파트너 ID 배치 조회.
        userGetService.getByIds()로 파트너 User 배치 조회.
        findLastMessagesByRoomIds()로 마지막 메시지 배치 조회.
        buildChatRoomSummaries()로 응답 조립, buildNextCursor()로 다음 커서 생성.
      transaction: readOnly
      note: >
        Java 레벨 재정렬 없음. DB ORDER BY 결과를 그대로 사용.
        파트너 조회는 page 기준으로만 수행 (hasNext 감지용 extra room 제외).
    - step: 3
      layer: Domain (ChatRoomGetService)
      action: >
        findMyDirectParticipantsPage: Repository의 findMyDirectParticipantsWithCursor 위임.
        findPartnerIdsByDirectRoomIds: Repository의 findPartnerIdsByDirectRoomIds 위임.
    - step: 4
      layer: Repository (ChatRoomParticipantRepositoryImpl)
      action: >
        findMyDirectParticipantsWithCursor:
          userId 조건 + cursor 조건 + category 필터를 WHERE에 적용.
          ChatRoom을 fetchJoin하여 N+1 방지.
          ORDER BY lastMessageAt DESC NULLS LAST, id DESC로 정렬된 결과 반환 (size+1).
        findPartnerIdsByDirectRoomIds:
          roomId IN 조건 + userId != myUserId 조건으로 파트너 userId만 Tuple 조회.
          Map<roomId, partnerId>로 반환.
          participant.deleted 필터 미적용 (파트너가 나간 경우에도 정보 유지).

  cursor_design:
    note: >
      Opaque cursor 방식. lastMessageAt + roomId를 Base64URL로 인코딩하여 클라이언트에 발급.
      다음 요청 시 cursor를 디코딩하여 두 값을 WHERE 조건에 직접 파라미터로 사용.
      서브쿼리 없이 단일 쿼리로 처리.
    encoding: "Base64Url('{roomId}:{lastMessageAt ISO string}')"
    conditions:
      - lastMessageAt이 cursor.lastMessageAt보다 작은 경우
      - lastMessageAt이 동일하면 roomId가 cursor.roomId보다 작은 경우 (동시간 방 중복 방지)
      - cursor.lastMessageAt이 null이면: lastMessageAt IS NULL AND roomId < cursor.roomId
      - cursor.lastMessageAt이 있으면: 위 조건 외 lastMessageAt IS NULL인 방도 포함 (NULLS LAST 보장)

  filter_design:
    ALL: category 파라미터 null → category 조건 없음 (전체)
    APPLICATION: >
      ChatRoomCategory.APPLICATION 조건 추가.
      category는 룸메이트 신청(RoommateApplicationUseCase.createApplication) 시 GENERAL → APPLICATION으로 변경.
      ChatSaveService가 아닌 신청 도메인에서 명시적으로 updateCategory(APPLICATION) 호출.

  unread_count_design:
    strategy: DB 컬럼 관리 (조회 시 계산하지 않음)
    increment: >
      ChatSaveService.save() 에서 메시지 저장 후 JPQL 벌크 UPDATE로 발신자 제외 모든 참여자 +1.
      USER 메시지, SYSTEM 메시지 모두 increment 적용.
    reset: >
      ChatMessageUseCase.getMessages() 에서 메시지 조회 후 participant.markAsRead(newestMessageId) 호출.
      markAsRead: 전달된 messageId가 현재 lastReadMessageId보다 클 때만 갱신 (guard clause).
      이전 페이지(더 오래된 메시지) 조회 시 lastReadMessageId 후퇴 및 unreadCount 오류 초기화 방지.
    race_condition: >
      조회 완료 후 markAsRead 순서로 실행하여 reset→fetch 순서의 누락 위험 완화.
      lastReadMessageId 저장으로 이후 재계산 기반 마련 (COUNT WHERE id > lastReadMessageId).
      완전한 방지는 아님 — fetch 후 새 메시지 도착 시 unreadCount가 0으로 초기화될 수 있음.

  partner_left_design:
    note: >
      파트너가 채팅방을 나간 경우(soft-delete) 해당 채팅방은 남은 유저에게 계속 노출.
      findPartnerIdsByDirectRoomIds에서 deleted 조건 없이 조회하여 나간 파트너도 포함.
      ChatRoomSummaryResponse에서 partner null-safe 처리 (파트너 정보 null 반환).
      두 유저 모두 나가야 ChatRoom.status = CLOSED → 목록에서 제외.

  database:
    entities:
      - name: ChatRoom
        action: Read
        fields: id, roomType, status, category, lastMessageAt, createdAt
      - name: ChatRoomParticipant
        action: Read
        fields: userId, unreadCount, lastReadMessageId
        note: >
          unreadCount는 DB 컬럼으로 관리.
          lastReadMessageId는 마지막으로 읽은 메시지 ID (unreadCount 재계산 기반).
          markAsRead는 더 최신 messageId일 때만 갱신 (guard clause).
      - name: Chat
        action: Read
        fields: id, content, messageType, createdAt
        note: findLastMessagesByRoomIds로 배치 조회 (N+1 방지)
      - name: User
        action: Read
        fields: id, username, profileImage (배치 IN 조회)

  validation_rules:
    - 내 participant는 soft-delete 제외 (나간 방은 목록에서 제외)
    - ChatRoom은 soft-delete 제외
    - 파트너 participant는 soft-delete 포함 (파트너가 나간 방도 목록 노출)
    - size 범위 1~50

testing_strategy:
  test_file: ChatRoomUseCaseGetMyChatRoomsTest.java
  happy_path:
    - 참여 채팅방 없음 → 빈 리스트
    - 채팅방 1개 → partner/lastMessage/unreadCount 정상 조립
    - 메시지 없는 방 → lastMessage=null, unreadCount=0
    - DB 정렬 순서 그대로 응답에 반영 (lastMessageAt 있는 방이 없는 방보다 앞)
    - APPLICATION 필터 → 해당 방만 반환
    - APPLICATION 필터 + hasNext=true → nextCursor 설정
  edge_cases:
    - APPLICATION 필터 + 해당 방 없음 → 빈 리스트
    - CLOSED 상태 채팅방도 목록에 포함
    - 파트너 participant soft-delete → partner 필드 null로 반환
