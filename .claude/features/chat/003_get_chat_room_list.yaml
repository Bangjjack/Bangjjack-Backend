# Feature Specification: 내 채팅방 목록 조회
# Status: Done
# Last Updated: 2026-05-23

meta:
  id: FEAT-CHAT-003
  title: 내 채팅방 목록 조회
  type: Feature
  author: Claude

overview:
  summary: >
    로그인 유저가 참여 중인 채팅방 목록을 최신 메시지 순으로 커서 페이지네이션 조회
  user_story: >
    As a 로그인 유저, I want to 내 채팅방 목록을 보고 싶다,
    so that 대화 상대와 읽지 않은 메시지를 한눈에 확인할 수 있다.
  goals:
    - 최신 메시지 순 내림차순 정렬 (메시지 없는 방은 맨 뒤)
    - ALL / APPLICATION 필터 지원
    - 커서 기반 페이지네이션 (스크롤 UX)
    - 상대방 프로필, 마지막 메시지, unreadCount 포함

technical_spec:
  api:
    - method: GET
      path: /api/v1/chat-rooms
      summary: 내 채팅방 목록 조회
      auth: AUTHENTICATED (JWT)
      request:
        dto: QueryParameter
        fields:
          - name: category
            type: ChatRoomCategory (GENERAL | APPLICATION)
            required: false
            default: null (전체 조회)
            note: null이면 category 조건 없이 전체 조회
          - name: cursor
            type: Long (roomId)
            required: false
          - name: size
            type: int
            required: false
            default: 20
            validation: min=1, max=50
      response:
        dto: ChatRoomListResponse
        wrapper: CommonResponse<ChatRoomListResponse>
        fields:
          - rooms: List<ChatRoomSummaryResponse>
          - nextCursor: Long (nullable)
          - hasNext: boolean

  data_flow:
    - step: 1
      layer: Presentation (ChatRoomController)
      action: JWT → currentMemberId, category/cursor/size 파라미터 수신 → UseCase 위임
    - step: 2
      layer: UseCase (ChatRoomUseCase.getMyChatRooms)
      action: >
        findParticipantsPage(userId, cursor, size, category) 단일 메서드 호출.
        반환된 participants에서 내 participant와 파트너 userId를 분리.
        size+1 기반 hasNext 판별 후 메모리에서 lastMessageAt 기준 재정렬.
        상대방 배치 조회(getByIds) + 마지막 메시지 배치 조회(findLastMessagesByRoomIds) + unreadCount 컬럼값 조립.
      transaction: readOnly
    - step: 3
      layer: Domain (ChatRoomGetService.findParticipantsPage)
      action: >
        Step1: findRoomIdsByUserIdWithCursor로 roomId 목록 페이징 조회 (size+1).
        Step2: findAllWithRoomByRoomIds로 해당 roomId의 모든 참여자 JOIN FETCH.
        반환된 participants에는 soft-delete된 파트너도 포함 (파트너가 방을 나간 경우 정보 유지)
    - step: 4
      layer: Repository (ChatRoomParticipantRepository)
      action: >
        findRoomIdsByUserIdWithCursor: category 유무로 필터 분기, lastMessageAt 기반 커서 조건.
        findAllWithRoomByRoomIds: roomIds IN 조건 + ChatRoom JOIN FETCH (deleted 조건 없음).

  cursor_design:
    note: >
      lastMessageAt + roomId 복합 커서. cursorRoomId로 해당 방의 lastMessageAt을 서브쿼리 조회 후 비교.
    conditions:
      - lastMessageAt이 cursor보다 작은 경우
      - lastMessageAt이 동일하면 roomId가 cursor보다 작은 경우 (동시간 방 중복 방지)
      - lastMessageAt이 null인 경우 (메시지 없는 방은 항상 뒤)

  filter_design:
    ALL: category 파라미터 null → category 조건 없음 (전체)
    APPLICATION: >
      ChatRoomCategory.APPLICATION 조건 추가.
      category는 룸메이트 신청(RoommateApplicationUseCase.createApplication) 시 GENERAL → APPLICATION으로 변경.
      ChatSaveService가 아닌 신청 도메인에서 명시적으로 updateCategory(APPLICATION) 호출.

  unread_count_design:
    strategy: DB 컬럼 관리 (조회 시 계산하지 않음)
    increment: >
      ChatSaveService.save() 에서 메시지 저장 후 JPQL 벌크 UPDATE로 발신자 제외 모든 참여자 +1.
      USER 메시지, SYSTEM 메시지 모두 increment 적용.
    reset: >
      ChatMessageUseCase.getMessages() 에서 메시지 조회 후 participant.markAsRead(newestMessageId) 호출.
      markAsRead = lastReadMessageId 저장 + unreadCount = 0 동시 처리.
    race_condition: >
      조회 완료 후 markAsRead 순서로 실행하여 reset→fetch 순서의 누락 위험 완화.
      lastReadMessageId 저장으로 이후 재계산 기반 마련 (COUNT WHERE id > lastReadMessageId).
      완전한 방지는 아님 — fetch 후 새 메시지 도착 시 unreadCount가 0으로 초기화될 수 있음.

  partner_left_design:
    note: >
      파트너가 채팅방을 나간 경우(soft-delete) 해당 채팅방은 남은 유저에게 계속 노출.
      findAllWithRoomByRoomIds에서 deleted 조건 제거하여 soft-delete된 participant도 조회.
      ChatRoomSummaryResponse에서 partner null-safe 처리 (파트너 정보 null 반환).
      두 유저 모두 나가야 ChatRoom.status = CLOSED → 목록에서 제외.

  database:
    entities:
      - name: ChatRoom
        action: Read
        fields: id, roomType, status, category, lastMessageAt, createdAt
      - name: ChatRoomParticipant
        action: Read
        fields: userId, unreadCount, lastReadMessageId
        note: >
          unreadCount는 DB 컬럼으로 관리.
          lastReadMessageId는 마지막으로 읽은 메시지 ID (unreadCount 재계산 기반).
      - name: Chat
        action: Read
        fields: id, content, messageType, createdAt
        note: findLastMessagesByRoomIds로 배치 조회 (N+1 방지)
      - name: User
        action: Read
        fields: id, username, profileImage (배치 IN 조회)

  validation_rules:
    - 내 participant는 soft-delete 제외 (나간 방은 목록에서 제외)
    - ChatRoom은 soft-delete 제외
    - 파트너 participant는 soft-delete 포함 (파트너가 나간 방도 목록 노출)
    - size 범위 1~50

testing_strategy:
  test_file: ChatRoomUseCaseGetMyChatRoomsTest.java
  happy_path:
    - 참여 채팅방 없음 → 빈 리스트
    - 채팅방 1개 → partner/lastMessage/unreadCount 정상 조립
    - 메시지 없는 방 → lastMessage=null, unreadCount=0
    - 메시지 있는 방이 없는 방보다 앞에 위치
    - APPLICATION 필터 → 해당 방만 반환
    - APPLICATION 필터 + hasNext=true → nextCursor 설정
  edge_cases:
    - APPLICATION 필터 + 해당 방 없음 → 빈 리스트
    - CLOSED 상태 채팅방도 목록에 포함
    - 파트너 participant soft-delete → partner 필드 null로 반환
