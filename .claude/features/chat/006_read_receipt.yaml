# Feature Specification: 실시간 읽음 알림
# Status: Done
# Last Updated: 2026-05-26

meta:
  id: FEAT-CHAT-006
  title: 실시간 읽음 알림 (WebSocket ReadReceipt)
  type: Feature
  author: xEzIxX

overview:
  summary: >
    채팅방에 체류 중인 참여자가 메시지를 화면에 표시한 후 WebSocket으로 읽음 신호를 전송하면,
    서버가 DB 읽음 상태를 갱신하고 방 내 전체 참여자에게 읽음 이벤트를 실시간으로 브로드캐스트한다.
    이를 통해 상대방은 별도 요청 없이 내 메시지가 읽혔음을 즉시 확인할 수 있다.
  user_story: >
    As a 채팅방 참여자, I want to 상대방이 내 메시지를 읽는 즉시 읽음 표시를 확인하고 싶다,
    so that 답장 없이도 메시지 전달 여부를 실시간으로 파악할 수 있다.
  goals:
    - 채팅방 체류 중 메시지 수신 시 WebSocket READ 메시지로 읽음 신호 전달
    - 읽음 처리 후 방 내 전체 참여자에게 ReadReceiptBroadcast 실시간 전송
    - 이미 읽은 messageId 재전송 시 브로드캐스트 미발행 (멱등 보장)
    - 트랜잭션 커밋 이후에만 브로드캐스트 (롤백 시 미전송 보장)

# ============================================================
# WebSocket 메시지 명세
# ============================================================
technical_spec:
  api:
    protocol: WebSocket
    direction: Bidirectional

    inbound:
      summary: 클라이언트 → 서버 읽음 신호 전송
      auth: "Handshake 시 URL 쿼리 파라미터 ?token={wsToken} 으로 인증 (WsAuthHandshakeInterceptor). 미인증 시 연결 거부 (401)."
      message:
        type: READ
        fields:
          - name: type
            type: WebSocketMessageType
            value: READ
          - name: roomId
            type: Long
            required: true
            note: "읽음 처리할 채팅방 ID"
          - name: messageId
            type: Long
            required: true
            note: "읽은 마지막 메시지 ID"
      example: '{ "type": "READ", "roomId": 10, "messageId": 100 }'

    outbound:
      summary: 서버 → 클라이언트 읽음 이벤트 브로드캐스트
      target: "채팅방 세션에 연결된 전체 참여자 (readerId 본인 포함)"
      message:
        type: READ_RECEIPT
        fields:
          - name: type
            type: WebSocketBroadcastType
            value: READ_RECEIPT
          - name: roomId
            type: Long
          - name: readerId
            type: Long
            note: "읽음 처리한 참여자 ID. 클라이언트가 readerId != myId 조건으로 필터링"
          - name: lastReadMessageId
            type: Long
          - name: readAt
            type: LocalDateTime
      example: '{ "type": "READ_RECEIPT", "roomId": 10, "readerId": 7, "lastReadMessageId": 100, "readAt": "2026-05-26T14:30:00" }'

# ============================================================
# 데이터 흐름
# ============================================================
# ReadReceiptEvent는 두 경로에서 트리거된다.
# - [WebSocket] ChatWebSocketHandler → markAsRead() (실시간, 채팅방 체류 중)
# - [REST]      ChatMessageUseCase.getMessages() → markAsRead() (초기 진입·페이지네이션 시)
# 두 경로 모두 아래 step 2~6으로 수렴한다.
  data_flow:
    - step: 1
      layer: "Presentation — 트리거 경로 (둘 중 하나)"
      action: >
        [WebSocket] ChatWebSocketHandler: READ 메시지 수신.
        sessionStore.isSubscribed(roomId, session) 검증 (미구독이면 NOT_SUBSCRIBED).
        chatMessageUseCase.markAsRead(userId, roomId, messageId) 호출.
        [REST] ChatMessageUseCase.getMessages(): 메시지 목록 조회 후 content 비어있지 않으면
        participant.markAsRead(content.get(0).getId()) 호출 (아래 step 3으로 직접 진입).

    - step: 2
      layer: UseCase (ChatMessageUseCase.markAsRead)
      action: "chatRoomGetService.getActiveParticipant(roomId, userId) 조회 (비참여자·LEFT 상태이면 NOT_CHAT_PARTICIPANT). participant.markAsRead(messageId) 호출. 반환값 true이면 ReadReceiptEvent 발행."

    - step: 3
      layer: Domain (ChatRoomParticipant)
      action: "markAsRead(messageId): messageId <= lastReadMessageId이면 false 반환(멱등). 초과이면 lastReadMessageId 갱신, unreadCount=0, true 반환."

    - step: 4
      layer: Infrastructure (DB)
      action: "Dirty Checking → chat_room_participant.last_read_message_id, unread_count UPDATE."

    - step: 5
      layer: Infrastructure (ReadReceiptEventListener)
      action: "@TransactionalEventListener(AFTER_COMMIT) ReadReceiptEvent 수신. ReadReceiptBroadcast.of(roomId, readerId, lastReadMessageId) 생성. chatBroadcaster.broadcastReadReceipt(roomId, broadcast) 호출 (Redis Pub/Sub 없이 직접 전송)."

    - step: 6
      layer: Presentation (WebSocket — 클라이언트)
      action: "sessionStore.getSessionsByRoom(roomId)로 방 내 전체 세션에 ReadReceiptBroadcast JSON 전송."

# ============================================================
# 에러 코드
# ============================================================
  error_codes:
    domain_range: "406xx (Chat 도메인)"
    codes:
      - code: 40604
        name: NOT_CHAT_PARTICIPANT
        status: 403 FORBIDDEN
        message: "채팅방 참여자가 아닙니다."
        trigger: "roomId 기준 ACTIVE 참여자가 아닌 userId로 READ 요청 시"
      - code: 40605
        name: NOT_SUBSCRIBED
        status: 400 BAD_REQUEST
        message: "채팅방을 구독하고 있지 않습니다."
        trigger: "WebSocket READ 수신 시 해당 roomId 미구독 상태인 경우"

  validation_rules:
    - "messageId <= lastReadMessageId 이면 markAsRead() false 반환 → ReadReceiptEvent 미발행 (멱등)"
    - "ReadReceiptBroadcast는 AFTER_COMMIT 이후에만 전송 (트랜잭션 롤백 시 미전송)"
    - "READ 수신 시 sessionStore.isSubscribed() 선검증 (미구독이면 NOT_SUBSCRIBED)"
    - "LEFT 상태 참여자는 getActiveParticipant()에서 차단 → 읽음 처리 불가"

# ============================================================
# 테스트 전략
# ============================================================
testing_strategy:
  happy_path:
    - "신규 messageId로 WebSocket READ 수신 시 ReadReceiptEvent 발행 → 방 전체에 브로드캐스트"
    - "ReadReceiptBroadcast payload: type=READ_RECEIPT, 올바른 roomId·readerId·lastReadMessageId 포함"

  edge_cases:
    - "이미 읽은 messageId로 READ 재전송 시 이벤트 미발행 (멱등)"
    - "비참여자가 READ 송신 시 NOT_CHAT_PARTICIPANT (403)"
    - "미구독 상태에서 READ 송신 시 NOT_SUBSCRIBED (400)"
    - "트랜잭션 롤백 시 브로드캐스트 미전송 (AFTER_COMMIT 보장)"

  test_files:
    - "ChatRoomParticipantTest — markAsRead() boolean 반환값 케이스"
    - "ChatMessageUseCaseMarkAsReadTest — markAsRead() 이벤트 발행·미발행·예외 케이스"
    - "ReadReceiptEventListenerTest — ReadReceiptEvent 수신 시 broadcastReadReceipt 호출 및 페이로드 검증"

# ============================================================
# 주의사항
# ============================================================
notes:
  - "ReadReceipt 브로드캐스트는 Redis Pub/Sub을 거치지 않고 직접 전송한다. 멀티 서버 확장 시 Redis 채널 추가 필요."
  - "에러 코드 추가 시 check_error_codes.py 실행 필수 (essential-rules.yaml 규칙)."
  - "아래 항목은 이번 기능 추가 이전에 구현 완료된 내용이다."
  - "GET /messages 호출 시 lastReadMessageId DB 갱신 (암묵적 읽음 처리) — ChatMessageUseCase.getMessages()"
  - "메시지 발송 시 발신자 제외 ACTIVE 참여자 unread_count +1 — ChatSaveService → incrementUnreadCountExcludingSender()"
  - "채팅방 목록 조회 시 unreadCount 반환 — ChatRoomSummaryResponse.unreadCount"
