# Feature Specification: 채팅방 나가기
# Status: Draft
# Last Updated: 2026-05-25

meta:
  id: FEAT-CHAT-005
  title: 채팅방 나가기
  type: Feature
  author: xEzIxX

overview:
  summary: >
    본인의 ChatRoomParticipant.status를 LEFT로 변경하여 채팅방 목록에서 해당 방을 제거한다.
    파트너의 참여 상태에는 영향을 주지 않으며, 파트너는 계속 메시지 전송 가능하다.
    파트너가 메시지를 보내면 status=ACTIVE로 자동 복원(auto-rejoin)되어 목록에 재노출된다.
    둘 다 나간 경우 ChatRoom.status=CLOSED로 변경되며, 재대화는 채팅방 생성 API(001) 재호출로 시작한다.
    차단 기능은 별도 도메인에서 처리한다.
  user_story: >
    As a 채팅방 참여자, I want to 채팅방을 나가고 싶다,
    so that 더 이상 해당 채팅방이 내 목록에 표시되지 않도록 할 수 있다.
  goals:
    - 본인만 채팅방 목록에서 제거 (파트너 상태 불변)
    - 채팅방 자체(ChatRoom)는 삭제하지 않음
    - 파트너 메시지 수신 시 자동 재참여 (전체 히스토리 유지)
    - 둘 다 나간 경우 ChatRoom.status=CLOSED, 웹소켓 구독 해제
    - 이미 나간 방에 재요청 시 에러 반환

# ──────────────────────────────────────────────
# Entity 변경
# ──────────────────────────────────────────────
entity_changes:
  ChatRoomParticipant:
    add_field:
      - name: status
        type: ParticipantStatus (Enum)
        nullable: false
        default: ACTIVE
        description: 참여 상태. ACTIVE=정상 참여, LEFT=나감
  new_enum:
    ParticipantStatus:
      values:
        - ACTIVE
        - LEFT

# ──────────────────────────────────────────────
# API 설계
# ──────────────────────────────────────────────
technical_spec:
  api:
    method: DELETE
    path: /api/v1/chat-rooms/{roomId}/participants/me
    summary: 채팅방 나가기 (본인 participant status=LEFT 변경)
    auth: AUTHENTICATED (JWT)
    path_variable:
      - name: roomId
        type: long
        required: true
    http_status:
      success: 204 No Content
    response:
      wrapper: CommonResponse (body 없음)

  data_flow:
    - step: 1
      layer: Presentation (ChatRoomController)
      action: JWT에서 userId 추출 → ChatRoomUseCase.leaveChatRoom(roomId, userId) 호출

    - step: 2
      layer: UseCase (ChatRoomUseCase)
      action: >
        ChatRoomGetService.getActiveParticipant(roomId, userId) 호출.
        participant 자체가 없으면 NOT_CHAT_PARTICIPANT(40604) 예외.
        participant가 존재하지만 status=LEFT이면 ALREADY_LEFT_CHAT_ROOM(40610, 409) 예외.

    - step: 3
      layer: UseCase (ChatRoomUseCase)
      action: participant.leave() 호출 → status=LEFT 변경

    - step: 4
      layer: UseCase (ChatRoomUseCase)
      action: >
        findActiveParticipantsByRoomId(roomId)로 남은 status=ACTIVE participant 조회.
        결과가 비어 있으면 chatRoom.close() → ChatRoom.status=CLOSED.

    - step: 5
      layer: Response
      action: 204 No Content 반환

  auto_rejoin:
    trigger: "파트너가 메시지 전송 시 수신자 status=LEFT 감지 (003 메시지 전송 UseCase에서 처리)"
    action: "수신자 participant.status=ACTIVE 복원. ChatRoomParticipant.visibleFromMessageId 유지 (나가기 시점에 기록된 값)."
    note: "ChatRoom.status=CLOSED인 경우 양쪽 모두 LEFT이므로 auto_rejoin 대상 아님. 재대화는 채팅방 생성 API(001) 재호출로 새 방 생성."
    result: "수신자 채팅방 목록 재노출. visibleFromMessageId 이후 메시지만 조회 가능. 나가기 이전 메시지는 노출되지 않음."

  side_effects:
    my_view:
      - "채팅방 목록 조회 시 해당 방 미노출 (status=LEFT 필터)"
      - "메시지 전송 시 NOT_CHAT_PARTICIPANT(40604) 예외"
      - "메시지 조회 시 NOT_CHAT_PARTICIPANT(40604) 예외 (LEFT 상태에서는 조회 불가)"
      - "파트너 메시지 수신 시 자동 재참여 → 채팅방 목록 재노출, 나가기 이전 메시지는 노출 안됨 (visibleFromMessageId 기준으로 이후 메시지만 조회)"
    partner_view:
      - "채팅방 목록에서 해당 방 유지"
      - "메시지 전송 계속 가능 (auto-rejoin 트리거)"
    chat_room:
      - "ChatRoom 자체는 삭제되지 않음"
      - "참여자 모두 나간 경우 ChatRoom.status=CLOSED, 웹소켓 구독 해제"
      - "CLOSED 상태에서 재대화: 파트너가 채팅방 생성 API(001) 재호출"

  error_codes:
    domain: chat
    range: "406xx"
    codes:
      - code: 40602
        name: CHAT_ROOM_NOT_FOUND
        message: "채팅방을 찾을 수 없습니다."
        http: 404
        when: "roomId에 해당하는 채팅방이 존재하지 않는 경우"
      - code: 40604
        name: NOT_CHAT_PARTICIPANT
        message: "채팅방 참여자가 아닙니다."
        http: 403
        when: "해당 채팅방 자체의 참여자가 아닌 경우"
      - code: 40610
        name: ALREADY_LEFT_CHAT_ROOM
        message: "이미 나간 채팅방입니다."
        http: 409
        when: "참여자이지만 status=LEFT인 경우 (이미 나간 방에 재요청)"

# ──────────────────────────────────────────────
# 테스트 전략
# ──────────────────────────────────────────────
testing_strategy:
  happy_path:
    - "참여 중인 채팅방 나가기 → 204, participant.status=LEFT 확인"
    - "나간 이후 채팅방 목록 조회 → 해당 방 미포함"
    - "나간 이후 파트너의 채팅방 목록 → 해당 방 유지, 메시지 전송 가능"
    - "파트너 메시지 수신 시 → participant.status=ACTIVE 복원, visibleFromMessageId는 나가기 시점 값 유지, 나가기 이전 메시지 미노출 확인"
    - "마지막 참여자 나감 → ChatRoom.status=CLOSED 확인"

  edge_cases:
    - "roomId 미존재 → 40602 CHAT_ROOM_NOT_FOUND"
    - "해당 채팅방 미참여 유저 요청 → 40604 NOT_CHAT_PARTICIPANT"
    - "이미 나간 방에 재요청 → 40610 ALREADY_LEFT_CHAT_ROOM"

  unit_test_targets:
    - "ChatRoomUseCase.leaveChatRoom: 파트너 남아 있을 때 participant.status=LEFT, ChatRoom.status=OPEN 유지 검증"
    - "ChatRoomUseCase.leaveChatRoom: 마지막 참여자 나갈 때 ChatRoom.status=CLOSED 검증"
    - "ChatRoomUseCase.leaveChatRoom: 채팅방 없음 → ChatRoomNotFoundException 검증"
    - "ChatRoomUseCase.leaveChatRoom: 이미 나간 경우 → AlreadyLeftChatRoomException(40610) 검증"
