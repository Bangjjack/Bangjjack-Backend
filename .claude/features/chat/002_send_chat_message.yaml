# Feature Specification
# Status: Implemented
# Last Updated: 2026-05-08

meta:
  id: FEAT-CHAT-002
  title: 채팅 메시지 전송
  type: Feature
  author: xEzIxX

overview:
  summary: >
    채팅방 참여자가 WebSocket으로 메시지를 전송하면 서버가 권한과 채팅방 상태를 검증한 뒤
    메시지를 저장하고 브로드캐스트 가능한 이벤트를 발행한다.
  user_story: >
    As a 채팅방 참여자, I want to 메시지를 전송하고 싶다,
    so that 상대방과 실시간 대화를 시작할 수 있다.
  goals:
    - 채팅방 참여자만 메시지를 송신할 수 있어야 한다
    - 송신된 메시지는 DB에 영속화되어야 한다
    - DB 트랜잭션 커밋 이후에만 브로드캐스트 후속 처리가 가능해야 한다
    - 향후 읽음 처리 및 단체 채팅 확장에 재사용 가능한 메시지 엔티티를 정의해야 한다

technical_spec:
  api:
    - protocol: WebSocket(STOMP)
      direction: publish
      destination: /pub/chat-rooms/{roomId}/messages
      summary: 채팅 메시지 전송
      auth: AUTHENTICATED (STOMP CONNECT 헤더의 Bearer JWT)
      request:
        dto: SendChatMessageRequest
        fields:
          - name: content
            type: String
            required: true
            validation: "@NotBlank, @Size(max = 1000)"
          - name: clientTempId
            type: String
            required: true
            validation: "@NotBlank"
            note: >
              클라이언트가 낙관적 UI 표시를 위해 생성한 임시 식별자(UUID 권장).
              서버는 저장 후 ACK에 그대로 반환하며, 클라이언트는 이를 통해 임시 메시지를
              서버 확정 메시지로 교체한다.
      response:
        ack:
          dto: ChatMessageAckResponse
          destination: /user/queue/messages/ack
          note: >
            메시지 저장 성공 시 발신자에게만 전송되는 개인 채널 응답이다.
            클라이언트는 clientTempId로 낙관적 표시 메시지를 서버 확정 메시지로 교체하고,
            이후 /sub/chat-rooms/{roomId} 브로드캐스트 수신 시 messageId 기준으로 중복을 제거한다.
          fields:
            - name: messageId
              type: Long
            - name: clientTempId
              type: String
            - name: createdAt
              type: LocalDateTime
        broadcast:
          destination: /sub/chat-rooms/{roomId}
          note: >
            FEAT-CHAT-003에서 정의된 ChatMessageResponse가 채팅방 전체 구독자(발신자 포함)에게 브로드캐스트된다.
      error_handling:
        type: "/user/queue/errors"
        note: >
          비즈니스 예외(406xx) 발생 시 세션을 유지하며 전용 에러 채널로 상세 내용을 전달한다.
          단, CONNECT 단계의 인증 실패나 심각한 서버 오류는 STOMP ERROR frame으로 처리한다.

      data_flow:
      - step: 1
        layer: Presentation (ChatMessageMappingController)
        action: "STOMP SEND 요청에서 roomId 추출, CONNECT에서 인증된 Principal의 currentUserId 식별, payload @Valid 검증 (content, clientTempId)"

      - step: 2
        layer: Presentation (Global Exception Handler)
        action: "@MessageExceptionHandler를 통해 비즈니스 예외 발생 시 /user/queue/errors 채널로 ChatSocketErrorResponse를 전송한다"

      - step: 3
        layer: UseCase (SendChatMessageUseCase)
        action: "채팅방 존재 여부 확인, room status = OPEN 검증, currentUser가 참여자인지 검증"
        transaction: true

      - step: 4
        layer: Domain (Chat Entity)
        action: "Chat.create(userId, chatRoom, content) 정적 팩토리 메서드로 메시지 생성"

      - step: 5
        layer: Infrastructure (ChatRepository)
        action: "chat 테이블에 메시지 저장"

      - step: 6
        layer: Application Event
        action: "트랜잭션 내부에서 ApplicationEventPublisher.publishEvent(ChatMessageSavedEvent)를 호출한다"

      - step: 7
        layer: UseCase (SendChatMessageUseCase)
        action: "ChatMessageAckResponse(messageId, clientTempId, createdAt)를 반환한다"

      - step: 8
        layer: Presentation (ChatMessageMappingController)
        action: "ChatMessageAckResponse를 발신자 전용 채널(/user/queue/messages/ack)로 전송한다"

      - step: 9
        layer: Application Event Listener
        action: "@TransactionalEventListener(phase = AFTER_COMMIT)로 ChatMessageSavedEvent를 수신하여 브로드캐스트 후속 처리를 시작한다 (FEAT-CHAT-003)"

  database:
    entities:
      - name: Chat
        action: Create
        table: chat
        fields:
          - column: id (PK, Auto Increment)
          - column: user_id (BIGINT, NOT NULL, FK users.id)
          - column: room_id (BIGINT, NOT NULL, FK chat_room.id)
          - column: content (TEXT, NOT NULL)
          - column: created_at
          - column: updated_at
          - column: deleted (BOOLEAN, DEFAULT false)
          - column: deleted_at (NULLABLE)
        indexes:
          - "IDX_chat_room_id_id_desc (room_id, id DESC)"
        notes: "BaseEntity 상속. 메시지 목록 조회와 재연결 복구는 messageId(id) 기준으로 처리한다."

  validation_rules:
    - "content는 비어 있으면 안 된다 (NotBlank)"
    - "content는 최대 1000자까지 허용한다"
    - "clientTempId는 비어 있으면 안 된다 (NotBlank)"
    - "삭제되지 않은 OPEN 상태 채팅방에만 메시지를 전송할 수 있다"
    - "채팅방 참여자만 메시지를 전송할 수 있다"
    - "WebSocket 인증 토큰은 브라우저 호환성을 위해 STOMP CONNECT 헤더에 Bearer JWT로 전달한다"

  error_codes:
    domain_range: "406xx (Chat 도메인)"
    codes:
      - code: 40602
        status: 404 Not_Found
        message: "채팅방을 찾을 수 없습니다."
        trigger: 존재하지 않는 roomId로 SEND 요청한 경우
      - code: 40603
        status: 403 Forbidden
        message: "해당 채팅방에 접근할 권한이 없습니다."
        trigger: 채팅방 비참여자가 SEND 요청한 경우
      - code: 40604
        status: 409 Conflict
        message: "종료된 채팅방에는 메시지를 전송할 수 없습니다."
        trigger: CLOSED 상태 채팅방에 SEND 요청한 경우
      - code: 40605
        status: 400 Bad_Request
        message: "유효하지 않은 채팅 메시지입니다."
        trigger: content가 blank이거나 최대 길이를 초과한 경우

testing_strategy:
  happy_path:
    - "참여자가 메시지 전송 시 Chat 저장 후 ChatMessageSavedEvent가 publish된다"
    - "ACK 응답에 clientTempId가 요청 값 그대로 포함된다"
    - "1:1 채팅방에서 연속 메시지 전송 시 저장 순서대로 messageId가 증가한다"

  edge_cases:
    - "content 1000자 경계값 테스트"
    - "DB 트랜잭션 롤백 시 AFTER_COMMIT 리스너 후속 처리가 실행되지 않음을 확인"

  error_cases:
    - "비참여자 송신 시 40603 CHAT_ROOM_FORBIDDEN"
    - "CLOSED 채팅방 송신 시 40604 CHAT_ROOM_CLOSED"
    - "blank content 송신 시 40605 INVALID_CHAT_MESSAGE"
    - "blank clientTempId 송신 시 40605 INVALID_CHAT_MESSAGE"
    - "CONNECT 인증 실패 또는 SEND 권한 실패 시 STOMP ERROR frame 반환 후 세션이 종료된다"

notes:
  - "본 문서는 메시지 저장, ACK 응답, 이벤트 발행까지 다룬다."
  - "ACK는 발신자 전용(/user/queue/messages/ack), 브로드캐스트는 전체 구독자(/sub/chat-rooms/{roomId}) 계약을 분리한다."
  - "실시간 브로드캐스트 계약은 FEAT-CHAT-003에서 정의한다."
  - "메시지 목록 조회 계약은 FEAT-CHAT-004에서 정의한다."
  - "ChatMessageSavedEvent는 최소한 messageId, roomId, senderId, senderNickname, senderProfileImage, content, createdAt을 포함해야 한다."
  - "clientTempId는 서버에서 저장하지 않으며 ACK 응답 시에만 echo된다."
