# Feature Specification: 본인 생활습관 체크리스트 수정
# Status: Draft
# Last Updated: 2026-05-24

meta:
  id: FEAT-007
  title: 본인 생활습관 체크리스트 수정
  type: Feature
  author: 1winhyun

overview:
  summary: >
    로그인한 사용자가 본인이 등록한 생활습관 체크리스트(9개 항목)를 전체 갱신(PATCH)한다.
  user_story: >
    As a 체크리스트를 등록한 사용자, I want to 등록한 생활습관 체크리스트를 수정하고,
    so that 변동된 생활 패턴을 반영해 룸메이트 매칭 정확도를 유지할 수 있다.
  goals:
    - 본인 체크리스트 9개 항목을 단일 PATCH API로 전체 교체 갱신
    - 잠버릇(복수)은 기존 row 소프트 삭제 후 신규 row 일괄 삽입 (NO Hard Delete 준수)
    - 미등록 사용자는 404로 명시하여 클라이언트가 등록 화면으로 분기 가능
    - 수정 결과는 별도 페이로드 없이 200 OK 반환 — 필요 시 GET /me/checklist 재호출

# ============================================================
# API 명세
# ============================================================
technical_spec:
  api:
    - method: PATCH
      path: /api/v1/users/me/checklist
      summary: 본인 생활습관 체크리스트 수정 (전체 교체)
      auth: MEMBER (Bearer Token, 필수)
      semantics: >
        HTTP 메서드는 PATCH이나 페이로드는 전체 9개 항목을 모두 포함하는 전체 교체 의미.
        코드베이스 컨벤션(RoommatePostController.updatePost, UserController.completeOnboarding)과
        일치시키기 위해 PATCH를 사용하며, 등록 API와 동일하게 모든 필드를 필수로 받는다.
      request:
        dto: UpdateLifestyleChecklistRequest
        fields:
          - name: bedtime
            type: String (Enum: Bedtime)
            required: true
            validation: "@NotNull, BEFORE_22 | BETWEEN_22_24 | BETWEEN_24_2 | AFTER_2 | IRREGULAR"
          - name: wakeUpTime
            type: String (Enum: WakeUpTime)
            required: true
            validation: "@NotNull, BEFORE_6 | BETWEEN_6_8 | BETWEEN_8_10 | AFTER_10 | IRREGULAR"
          - name: sleepHabits
            type: List<String (Enum: SleepHabit)>
            required: true
            validation: "@NotNull, @NotEmpty, 복수 선택 가능. NONE | TOSS_AND_TURN | SNORING | TEETH_GRINDING | FREQUENT_WAKING"
          - name: cleaningCycle
            type: String (Enum: CleaningCycle)
            required: true
            validation: "@NotNull, ALMOST_DAILY | ONCE_OR_TWICE_A_WEEK | SOMETIMES | RARELY"
          - name: dormStayTime
            type: String (Enum: DormStayTime)
            required: true
            validation: "@NotNull, MOSTLY_OUTSIDE | HALF_AND_HALF | MOSTLY_INSIDE"
          - name: callHabit
            type: String (Enum: CallHabit)
            required: true
            validation: "@NotNull, INSIDE_OK | OUTSIDE_ONLY | WHISPER"
          - name: indoorTemperature
            type: String (Enum: IndoorTemperature)
            required: true
            validation: "@NotNull, SENSITIVE_TO_HEAT | SENSITIVE_TO_COLD | BOTH_SENSITIVE | INSENSITIVE"
          - name: noiseSensitivity
            type: String (Enum: NoiseSensitivity)
            required: true
            validation: "@NotNull, VERY_INSENSITIVE | SLIGHTLY_INSENSITIVE | NORMAL | SLIGHTLY_SENSITIVE | VERY_SENSITIVE"
          - name: smoking
            type: String (Enum: Smoking)
            required: true
            validation: "@NotNull, NON_SMOKER | CIGARETTE | ELECTRONIC_CIGARETTE"
      response:
        dto: Void
        http_status: 200 OK
        wrapper: CommonResponse<Void>
        fields: []

  data_flow:
    - step: 1
      layer: Presentation (ChecklistController)
      action: "@CurrentMemberId로 JWT에서 userId 추출, @Valid로 요청 검증 후 ChecklistUseCase.updateMyChecklist(userId, request) 호출"
    - step: 2
      layer: UseCase (ChecklistUseCase)
      action: "UserGetService.getById(userId)로 User 조회"
      transaction: "@Transactional (쓰기 메서드)"
    - step: 3
      layer: Domain (ChecklistGetService)
      action: "findByUser(user)로 LifestyleChecklist 조회. 비어 있으면 ChecklistNotFoundException 발생"
    - step: 4
      layer: Domain (LifestyleChecklist Entity)
      action: "checklist.update(bedtime, wakeUpTime, cleaningCycle, dormStayTime, callHabit, indoorTemperature, noiseSensitivity, smoking) — Tell Don't Ask로 8개 필드 일괄 갱신 (sleepHabits 제외, 별도 엔티티)"
    - step: 5
      layer: Domain (ChecklistGetService)
      action: "findSleepHabitsByChecklist(checklist)로 기존 LifestyleChecklistSleepHabit 목록 조회"
    - step: 6
      layer: Domain (ChecklistUpdateService)
      action: "softDeleteSleepHabits(existingHabits) — 기존 잠버릇 row에 softDelete() 호출 후 saveAll() (Dirty Checking 활용 가능하나 saveAll로 명시적 처리)"
    - step: 7
      layer: Domain (ChecklistCreateService)
      action: "request.sleepHabits()를 LifestyleChecklistSleepHabit.create(checklist, habit)로 매핑 → createSleepHabits(list)로 saveAll 일괄 삽입 (기존 메서드 재사용)"
    - step: 8
      layer: Response
      action: "200 OK with CommonResponse.success(MY_CHECKLIST_UPDATED). data 없음."

  database:
    entities:
      - name: LifestyleChecklist
        action: Update
        fields: "bedtime, wake_up_time, cleaning_cycle, dorm_stay_time, call_habit, indoor_temperature, noise_sensitivity, smoking (8개 컬럼 UPDATE — Dirty Checking)"
      - name: LifestyleChecklistSleepHabit (기존 row)
        action: Soft Delete
        fields: "deleted = true, deleted_at = NOW() (BaseEntity.softDelete() 호출)"
      - name: LifestyleChecklistSleepHabit (신규 row)
        action: Create
        fields: "checklist_id (FK), sleep_habit, created_at, updated_at, deleted = false"

  validation_rules:
    - "MEMBER 권한 필요 (JWT 미존재/만료 → 401)"
    - "userId로 User 조회 실패 시 → 404 USER_NOT_FOUND (User 도메인 공용 코드 40203)"
    - "본인 체크리스트 미등록(LifestyleChecklist 없음) 시 → 404 CHECKLIST_NOT_FOUND (40502)"
    - "sleepHabits: 빈 리스트([]) 허용 안 됨 — @NotEmpty"
    - "모든 Enum 필드: 허용되지 않는 값 입력 시 → 400 BAD_REQUEST"
    - "User.isChecklistRegistered 플래그는 변경하지 않음 (이미 true 상태가 보장됨)"

  error_codes:
    domain_range: "405xx (Checklist 도메인) — 기존 코드 재사용. 신규 ErrorCode 없음."
    codes:
      - code: 40502
        name: CHECKLIST_NOT_FOUND
        status: 404 NOT_FOUND
        message: "생활습관 체크리스트를 찾을 수 없습니다."
        trigger: "본인 체크리스트 수정 시 등록 이력이 없는 경우"
        note: "기존 등록/조회 스펙에서 사용 중인 코드 재사용 (ChecklistErrorCode.CHECKLIST_NOT_FOUND)."
      - code: 40203
        name: USER_NOT_FOUND
        status: 404 NOT_FOUND
        message: "사용자를 찾을 수 없습니다."
        trigger: "JWT userId로 User 조회 실패 시"
        note: "User 도메인(402xx) 공용 코드 사용"

  response_codes:
    new_code:
      - code: 200
        name: MY_CHECKLIST_UPDATED
        status: 200 OK
        message: "본인 생활습관 체크리스트가 수정되었습니다."
        note: "ChecklistResponseCode enum에 추가 필요. 기존 등록/조회 코드와 동일 enum 내 정의"

components:
  new:
    - layer: Application/DTO
      file: domain/checklist/application/dto/request/UpdateLifestyleChecklistRequest.java
      type: record
      description: "수정 전용 요청 DTO. 등록(LifestyleChecklistRequest)과 동일한 9개 필드/검증을 가지나 의미적 분리. 향후 수정 전용 검증 추가 시 안전 분기 가능."
      fields: "Bedtime, WakeUpTime, List<SleepHabit>, CleaningCycle, DormStayTime, CallHabit, IndoorTemperature, NoiseSensitivity, Smoking"
    - layer: Domain/Service
      file: domain/checklist/domain/service/ChecklistUpdateService.java
      method: "softDeleteSleepHabits(List<LifestyleChecklistSleepHabit> habits): void"
      description: "각 row에 softDelete() 호출 후 sleepHabitRepository.saveAll(habits)로 일괄 반영. Repository에만 의존 (Domain Service Isolation 준수)."
    - layer: Domain/Entity (Method 추가)
      file: domain/checklist/domain/entity/LifestyleChecklist.java
      method: "update(Bedtime, WakeUpTime, CleaningCycle, DormStayTime, CallHabit, IndoorTemperature, NoiseSensitivity, Smoking): void"
      description: "Tell Don't Ask. 8개 비-sleepHabits 필드를 일괄 갱신. sleepHabits는 별도 엔티티이므로 UseCase에서 분리 처리."
    - layer: Application/UseCase (Method 추가)
      file: domain/checklist/application/usecase/ChecklistUseCase.java
      method: "updateMyChecklist(Long userId, UpdateLifestyleChecklistRequest request): void"
      annotation: "@Transactional (쓰기 메서드)"
      description: "User 조회 → checklist 조회 (없으면 404) → entity.update() → 기존 sleepHabits softDelete → 신규 sleepHabits 생성 후 saveAll"
    - layer: Presentation/Controller (Mapping 추가)
      file: domain/checklist/presentation/ChecklistController.java
      method: "updateMyChecklist(@CurrentMemberId Long memberId, @RequestBody @Valid UpdateLifestyleChecklistRequest request)"
      mapping: "PATCH /api/v1/users/me/checklist"
      status: 200 OK
    - layer: Presentation/ResponseCode
      file: domain/checklist/presentation/response/ChecklistResponseCode.java
      enum_value: "MY_CHECKLIST_UPDATED(200, HttpStatus.OK, \"본인 생활습관 체크리스트가 수정되었습니다.\")"

testing_strategy:
  happy_path:
    - "체크리스트 등록된 사용자가 PATCH 호출 시 200 OK 반환 및 8개 필드 모두 변경 확인"
    - "sleepHabits 갱신 시 기존 row 모두 soft delete (deleted = true) + 신규 row 삽입 확인"
    - "sleepHabits 단일 → 복수로 변경 (예: [SNORING] → [SNORING, TOSS_AND_TURN, TEETH_GRINDING])"
    - "sleepHabits 복수 → 단일로 변경 (예: [SNORING, TOSS_AND_TURN] → [NONE])"
    - "sleepHabits 동일 값 재전송 (예: [SNORING] → [SNORING])도 기존 soft delete + 신규 insert 흐름 동일하게 동작"
  edge_cases:
    - "체크리스트 미등록 사용자가 PATCH 호출 시 → 404 CHECKLIST_NOT_FOUND (40502)"
    - "JWT가 가리키는 userId로 User 조회 실패 시 → 404 USER_NOT_FOUND (40203)"
    - "sleepHabits 빈 리스트([]) 전송 → 400 BAD_REQUEST (@NotEmpty)"
    - "허용되지 않는 Enum 값(e.g. bedtime: 'WRONG') → 400 BAD_REQUEST"
    - "모든 필드 null → 400 BAD_REQUEST (@NotNull)"
    - "JWT 누락 또는 만료 → 401 UNAUTHORIZED (글로벌 인증 필터)"
    - "User.isChecklistRegistered가 true로 유지되는지 검증 (변경되지 않음)"

notes:
  - "잠버릇 갱신은 '소프트 삭제 후 전체 삽입' 전략. 동시성 이슈는 본인만 수정 가능한 자원 특성상 사실상 발생하지 않음."
  - "User.isChecklistRegistered는 그대로 유지 (이미 true). 별도 entity 메서드 호출 불필요."
  - "PATCH 의미는 코드베이스 컨벤션을 따른 '전체 교체'. 필드별 부분 수정이 아니므로 모든 필드를 @NotNull로 검증."
  - "쿼리: SELECT(user) + SELECT(checklist) + SELECT(habits) + UPDATE(checklist) + UPDATE(habits soft delete) + INSERT(habits batch). 사용자당 잠버릇 최대 5건 수준이라 성능 이슈 없음."
  - "soft delete된 잠버릇 row는 누적되나, 분석/매칭에서는 deleted = false 필터로 제외되므로 영향 없음."
  - "check_error_codes.py 실행 불필요 (신규 ErrorCode 없음). ChecklistResponseCode에 MY_CHECKLIST_UPDATED만 추가."
  - "FEAT-006(본인 체크리스트 조회) 응답 DTO MyLifestyleChecklistResponse는 수정 후 클라이언트가 재조회로 받을 수 있음 — 별도 응답 반환 불필요."
