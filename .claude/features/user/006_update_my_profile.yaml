# Feature Specification: 내 프로필 편집
# Status: Draft
# Last Updated: 2026-05-29

meta:
  id: FEAT-019
  title: 내 프로필 편집
  type: Feature
  author: 1winhyun

overview:
  summary: >
    온보딩 완료 사용자가 본인의 학적/기본 정보(출생년도/성별/캠퍼스/학년/학과/학기/기숙사)와
    룸메이트 선호도(3순위)를 단일 PATCH API로 일괄 수정한다.
  user_story: >
    As a 온보딩 완료 사용자, I want to 내 프로필 정보와 룸메이트 선호도를 한 번에 수정하고,
    so that 변동된 학적/생활 환경을 반영해 룸메이트 매칭 정확도를 유지할 수 있다.
  goals:
    - 단일 PATCH 엔드포인트로 User 8개 필드 + RoommatePreference 3순위 통합 수정
    - 룸메이트 선호도는 upsert (미등록 시 신규 생성, 등록 시 갱신) — 등록 플래그도 동기화
    - 온보딩 미완료 사용자는 명확한 에러로 차단 (편집은 온보딩 이후 액션)
    - 출생년도/학과/선호도 중복 등 비즈니스 검증을 기존 컨벤션(FEAT-003, FEAT-006)과 동일하게 재사용

# ============================================================
# API 명세
# ============================================================
technical_spec:
  api:
    - method: PATCH
      path: /api/v1/users/me/profile
      summary: 내 프로필 편집 (학적 정보 + 룸메이트 선호도 일괄 수정)
      auth: MEMBER (Bearer Token, 필수)
      semantics: >
        HTTP 메서드는 PATCH이나 페이로드는 전체 필드를 모두 포함하는 전체 교체 의미.
        체크리스트 수정(FEAT-007)과 동일한 컨벤션. 부분 수정이 아니므로 모든 필드 @NotNull.
      request:
        dto: UpdateMyProfileRequest
        fields:
          - name: birthYear
            type: Integer
            required: true
            validation: "@NotNull, 1900 ~ 현재연도 (UseCase에서 추가 검증)"
          - name: grade
            type: Integer
            required: true
            validation: "@NotNull, @Min(1), @Max(4)"
          - name: gender
            type: String (Enum: Gender)
            required: true
            validation: "@NotNull, MALE | FEMALE"
          - name: campus
            type: String (Enum: Campus)
            required: true
            validation: "@NotNull, GLOBAL_CAMPUS | MEDICAL_CAMPUS"
          - name: departmentId
            type: Long
            required: true
            validation: "@NotNull, departments.id 참조 (없으면 404)"
          - name: semester
            type: String (Enum: Semester)
            required: true
            validation: "@NotNull, SIXTEEN_WEEKS | TWENTY_FIVE_WEEKS"
          - name: dormitory
            type: String (Enum: Dormitory)
            required: true
            validation: "@NotNull, DORM_1 | DORM_2 | DORM_3"
          - name: preferences
            type: List<String (Enum: RoommatePreferenceFactor)>
            required: true
            validation: "@NotNull, @Size(min=3, max=3), 중복 불가"
            note: "index 0 = 1순위, index 1 = 2순위, index 2 = 3순위"
            enum_values: >
              BEDTIME | WAKE_UP_TIME | SLEEP_HABIT | DORM_STAY_TIME |
              CLEANING_HABIT | INDOOR_TEMPERATURE | NOISE_SENSITIVITY |
              ITEM_SHARING | SMOKING | CALL_HABIT
      response:
        dto: Void
        http_status: 200 OK
        wrapper: CommonResponse<Void>
        response_code: UserResponseCode.MY_PROFILE_UPDATED
        fields: []

  data_flow:
    - step: 1
      layer: Presentation (UserController)
      action: "@CurrentMemberId로 JWT에서 userId 추출, @Valid로 요청 검증 후 UserUseCase.updateMyProfile(userId, request) 호출"
    - step: 2
      layer: UseCase (UserUseCase)
      action: "validateBirthYear(birthYear) 재사용 — 범위 위반 시 InvalidBirthYearException"
      transaction: "@Transactional (쓰기 메서드)"
    - step: 3
      layer: UseCase (UserUseCase)
      action: "preferences 리스트 내 중복 검증 (HashSet 비교) — 중복 시 DuplicatePreferenceFactorException"
    - step: 4
      layer: Domain (UserGetService)
      action: "getById(userId)로 User 조회 — 없으면 UserNotFoundException(40203)"
    - step: 5
      layer: UseCase (UserUseCase)
      action: "user.isOnboarded() 확인 — false면 NotOnboardedException(40204) 발생 (편집은 온보딩 이후만 허용)"
    - step: 6
      layer: Domain (DepartmentGetService)
      action: "getById(departmentId)로 Department 조회 — 없으면 DepartmentNotFoundException(40302)"
    - step: 7
      layer: Domain (User Entity)
      action: "user.editProfile(birthYear, grade, gender, campus, department, semester, dormitory) 호출 — 7개 필드 일괄 갱신 (isOnboarded는 유지)"
    - step: 8
      layer: Domain (RoommatePreferenceGetService)
      action: "findByUser(user) 호출"
    - step: 9
      layer: UseCase (UserUseCase)
      action: >
        upsert 분기:
          - Optional.isPresent() → preference.update(p1, p2, p3) (Dirty Checking)
          - Optional.isEmpty() → RoommatePreference.create(user, p1, p2, p3) 후 PreferenceCreateService.createPreference(preference) + user.completeRoommatePreferenceRegistration()
    - step: 10
      layer: Response
      action: "200 OK with CommonResponse.success(MY_PROFILE_UPDATED). data 없음."

  database:
    entities:
      - name: User
        table: users
        action: Update
        fields: "birth_year, grade, gender, campus, department_id (FK), semester, dormitory (7개) + is_roommate_preference_registered (선호도 신규 생성 시 true)"
      - name: RoommatePreference (기존 row 존재 시)
        table: roommate_preferences
        action: Update
        fields: "first_priority, second_priority, third_priority (Dirty Checking)"
      - name: RoommatePreference (미등록 시)
        table: roommate_preferences
        action: Create
        fields: "user_id (FK, UNIQUE), first_priority, second_priority, third_priority"

  validation_rules:
    - "MEMBER 권한 필요 (JWT 미존재/만료 → 401)"
    - "isOnboarded = false인 사용자는 편집 불가 → 409 NOT_ONBOARDED (40204). 온보딩 먼저 수행해야 함"
    - "birthYear: 1900 이상 현재 연도(2026) 이하 — 범위 외 시 400 INVALID_BIRTH_YEAR (40202)"
    - "grade: 1 ~ 4 정수 (@Min/@Max)"
    - "departmentId: 존재해야 함 — 없으면 404 DEPARTMENT_NOT_FOUND (40302)"
    - "preferences: 정확히 3개 (@Size) 및 중복 불가 — 위반 시 400"
    - "isOnboarded 플래그는 변경하지 않음 (이미 true 보장)"
    - "isRoommatePreferenceRegistered: 미등록 사용자가 처음 등록 시 true로 동기화"

  error_codes:
    domain_range: "402xx (User 도메인) / 40302 (Department) / 40504 (Checklist Preference) — 재사용"
    new_codes:
      - code: 40204
        name: NOT_ONBOARDED
        enum: UserErrorCode.NOT_ONBOARDED
        status: 409 CONFLICT
        message: "온보딩이 완료되지 않은 사용자입니다."
        trigger: "isOnboarded = false인 사용자가 PATCH /me/profile 호출 시"
    reused_codes:
      - code: 40202
        name: INVALID_BIRTH_YEAR
        status: 400 BAD_REQUEST
        trigger: "birthYear가 1900 미만이거나 현재 연도 초과"
      - code: 40203
        name: USER_NOT_FOUND
        status: 404 NOT_FOUND
        trigger: "JWT userId로 User 조회 실패 시"
      - code: 40302
        name: DEPARTMENT_NOT_FOUND
        status: 404 NOT_FOUND
        trigger: "departmentId로 Department 조회 실패 시"
        note: "Department 도메인(403xx) 공용 코드"
      - code: 40504
        name: DUPLICATE_PREFERENCE_FACTOR
        status: 400 BAD_REQUEST
        trigger: "preferences 내 동일한 RoommatePreferenceFactor가 2개 이상"
        note: "Checklist 도메인(405xx) 공용 코드"

  response_codes:
    new_code:
      - code: 200
        name: MY_PROFILE_UPDATED
        enum: UserResponseCode.MY_PROFILE_UPDATED
        status: 200 OK
        message: "내 프로필이 수정되었습니다."

# ============================================================
# 컴포넌트 변경 사항
# ============================================================
components:
  new:
    - layer: Application/DTO
      file: domain/user/application/dto/request/UpdateMyProfileRequest.java
      type: record
      description: "프로필 편집 요청 DTO. UserOnboardingRequest와 유사하나 preferences 필드 추가. 의미적 분리 위해 별도 DTO."
      fields: "Integer birthYear, Integer grade, Gender, Campus, Long departmentId, Semester, Dormitory, List<RoommatePreferenceFactor> preferences"
    - layer: Application/Exception
      file: domain/user/application/exception/NotOnboardedException.java
      description: "UserErrorCode.NOT_ONBOARDED(40204)을 던지는 RuntimeException 하위 클래스. 기존 예외 패턴(AlreadyOnboardedException 등) 동일."
    - layer: Application/UseCase (Method 추가)
      file: domain/user/application/usecase/UserUseCase.java
      method: "updateMyProfile(Long userId, UpdateMyProfileRequest request): void"
      annotation: "@Transactional (쓰기 메서드)"
      description: >
        검증 → User 조회 → 온보딩 확인 → Department 조회 → user.editProfile() →
        RoommatePreference upsert(존재 시 update, 없으면 create + 플래그 동기화).
        PreferenceCreateService 의존성 신규 추가 (UserUseCase 생성자에 주입).
      depends_on: "UserGetService, DepartmentGetService, RoommatePreferenceGetService, PreferenceCreateService"
    - layer: Domain/Entity (Method 추가)
      file: domain/user/domain/entity/User.java
      method: "editProfile(Integer birthYear, Integer grade, Gender gender, Campus campus, Department department, Semester semester, Dormitory dormitory): void"
      description: >
        Tell Don't Ask. 7개 학적/기본 필드 일괄 갱신. isOnboarded 플래그는 손대지 않음.
        기존 `updateProfile(username, profileImage)`(Google 동기화용)과 메서드명 충돌 회피.
    - layer: Domain/Entity (Method 추가)
      file: domain/checklist/domain/entity/RoommatePreference.java
      method: "update(RoommatePreferenceFactor first, RoommatePreferenceFactor second, RoommatePreferenceFactor third): void"
      description: "Tell Don't Ask. 3개 우선순위 일괄 갱신. Dirty Checking 활용."
    - layer: Presentation/Controller (Mapping 추가)
      file: domain/user/presentation/UserController.java
      method: "updateMyProfile(@CurrentMemberId Long memberId, @RequestBody @Valid UpdateMyProfileRequest request): CommonResponse<Void>"
      mapping: "PATCH /api/v1/users/me/profile"
      status: 200 OK
    - layer: Application/Exception (ErrorCode 추가)
      file: domain/user/application/exception/UserErrorCode.java
      enum_value: 'NOT_ONBOARDED(40204, HttpStatus.CONFLICT, "온보딩이 완료되지 않은 사용자입니다.")'
    - layer: Presentation/ResponseCode (추가)
      file: domain/user/presentation/response/UserResponseCode.java
      enum_value: 'MY_PROFILE_UPDATED(200, HttpStatus.OK, "내 프로필이 수정되었습니다.")'

  reused:
    - "UserGetService.getById(userId) — 기존"
    - "DepartmentGetService.getById(departmentId) — 기존"
    - "RoommatePreferenceGetService.findByUser(user) — 기존 (Optional 반환)"
    - "PreferenceCreateService.createPreference(preference) — 기존"
    - "UserUseCase.validateBirthYear(int) — private 메서드 그대로 재사용"
    - "User.completeRoommatePreferenceRegistration() — 기존 도메인 메서드"

# ============================================================
# 테스트 전략
# ============================================================
testing_strategy:
  happy_path:
    - "온보딩 완료 + 선호도 등록된 사용자가 PATCH 호출 시 200 OK 반환 및 7개 필드 + 3순위 모두 변경 확인"
    - "온보딩 완료 + 선호도 미등록 사용자가 호출 시 RoommatePreference 신규 row 생성 + User.isRoommatePreferenceRegistered=true 동기화 확인"
    - "동일한 값으로 재요청해도 200 OK 응답 (멱등성)"
    - "isOnboarded 플래그는 true로 유지되는지 검증 (변경되지 않음)"
  edge_cases:
    - "isOnboarded = false 사용자 호출 → 409 NOT_ONBOARDED (40204)"
    - "birthYear = 1899 → 400 INVALID_BIRTH_YEAR (40202)"
    - "birthYear = 2027 (미래) → 400 INVALID_BIRTH_YEAR (40202)"
    - "grade = 0 또는 5 → 400 Bad Request (@Min/@Max)"
    - "허용되지 않는 Enum 값(gender/campus/semester/dormitory) → 400 Bad Request"
    - "존재하지 않는 departmentId → 404 DEPARTMENT_NOT_FOUND (40302)"
    - "preferences 2개/4개 전송 → 400 Bad Request (@Size)"
    - "preferences 중복 (e.g. [BEDTIME, BEDTIME, SMOKING]) → 400 DUPLICATE_PREFERENCE_FACTOR (40504)"
    - "preferences null → 400 Bad Request (@NotNull)"
    - "JWT가 가리키는 userId로 User 조회 실패 → 404 USER_NOT_FOUND (40203)"
    - "JWT 누락/만료 → 401 UNAUTHORIZED (글로벌 인증 필터)"

# ============================================================
# 주의사항
# ============================================================
notes:
  - "API 경로 /api/v1/users/me/profile은 GET /me/profile(FEAT-003 내 프로필 조회)과 동일 리소스에 대한 PATCH로 RESTful 일관성 유지."
  - "User.updateProfile(username, profileImage)는 OAuth2 로그인 동기화용으로 유지. 본 기능의 신규 메서드는 editProfile(...) 명칭으로 충돌 회피."
  - "RoommatePreference upsert는 UseCase 분기로 처리 (UseCase는 Repository 직접 호출 금지 컨벤션 준수 → GetService/CreateService 경유)."
  - "PATCH 의미는 코드베이스 컨벤션을 따른 '전체 교체'. 부분 수정 아님."
  - "check_error_codes.py 실행 필요 — 40204 신규 코드 추가 시 중복 검증."
  - "UserUseCase 생성자에 PreferenceCreateService 신규 의존성 추가. 도메인 경계 관점에서는 user 도메인이 checklist 도메인의 도메인 서비스를 호출하는 형태 (기존 PreferenceUseCase도 UserGetService를 호출하므로 양방향 의존이 이미 존재). 향후 정리가 필요하면 별도 RFC."
  - "쿼리: SELECT(user) + SELECT(department) + SELECT(preference) + UPDATE(user) + UPDATE 또는 INSERT(preference). 총 4~5 쿼리, 성능 이슈 없음."
  - "캐시: AI 추천 룸메이트 캐시(RedisAiRecommendedRoommatesCacheAdapter)가 학적/선호도 기반이라면, 프로필 수정 시 본인 캐시 무효화 검토 필요 — 별도 PR로 분리 가능."
