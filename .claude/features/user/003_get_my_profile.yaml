# Feature Specification: 내 프로필 조회
# Status: Draft
# Last Updated: 2026-05-25

meta:
  id: FEAT-015
  title: 내 프로필 조회
  type: Feature
  author: 1winhyun

overview:
  summary: >
    로그인한 사용자가 본인의 프로필 정보(기본 인적사항 + 학적 + 기숙사 + 생활습관 체크리스트 9개 + 룸메이트 선호도 3개)를
    단일 API로 통합 조회한다.
  user_story: >
    As a 로그인한 사용자, I want to 내 프로필 정보를 한 번에 조회하고,
    so that 마이페이지 화면에서 등록한 모든 정보를 확인할 수 있다.
  goals:
    - 본인의 기본 인적사항(이름/이메일/출생년도/성별) 조회
    - 본인의 학적 정보(캠퍼스/학과/학년/학기/기숙사) 조회
    - 본인의 생활습관 체크리스트 9개 항목 임베드 조회
    - 본인의 룸메이트 선호도 우선순위 3개 조회
    - 단일 GET 호출로 마이페이지 화면 구성 완료 (추가 API 호출 최소화)

technical_spec:
  api:
    - method: GET
      path: /api/v1/users/me/profile
      summary: 내 프로필 통합 조회
      auth: MEMBER (Bearer Token, 필수)
      request:
        dto: 없음 (Path/Query/Body 파라미터 없음)
        fields: []
      response:
        dto: MyProfileResponse
        http_status: 200 OK
        wrapper: CommonResponse<MyProfileResponse>
        response_code: UserResponseCode.MY_PROFILE_FOUND
        fields:
          # --- 기본 인적사항 (User) ---
          - name: username
            type: String
            nullable: false
            description: "사용자 이름 (Google OAuth name 기반)"
          - name: email
            type: String
            nullable: false
            description: "사용자 이메일 (@gachon.ac.kr)"
          - name: birthYear
            type: Integer
            nullable: true
            description: "출생년도 (온보딩 미완료 시 null)"
          - name: gender
            type: String (Enum: Gender)
            nullable: true
            description: "성별 (MALE | FEMALE). 온보딩 미완료 시 null"

          # --- 학적/기숙사 (User + Department) ---
          - name: campus
            type: String (Enum: Campus)
            nullable: true
            description: "캠퍼스 (GLOBAL_CAMPUS | MEDICAL_CAMPUS). 온보딩 미완료 시 null"
          - name: departmentId
            type: Long
            nullable: true
            description: "학과 FK ID. 온보딩 미완료 시 null"
          - name: departmentName
            type: String
            nullable: true
            description: "학과명 (e.g. 소프트웨어학과). Department 엔티티 조인 결과. 온보딩 미완료 시 null"
          - name: grade
            type: Integer
            nullable: true
            description: "학년 (1 ~ 5). 온보딩 미완료 시 null"
          - name: semester
            type: String (Enum: Semester)
            nullable: true
            description: "학기 (SIXTEEN_WEEKS | TWENTY_FIVE_WEEKS). 온보딩 미완료 시 null"
          - name: dormitory
            type: String (Enum: Dormitory)
            nullable: true
            description: "기숙사 (DORM_1 | DORM_2 | DORM_3). 온보딩 미완료 시 null"

          # --- 생활습관 체크리스트 (9개 항목 임베드) ---
          - name: checklist
            type: ChecklistSummary (nested object)
            nullable: true
            description: "체크리스트 미등록 사용자는 null. 등록된 경우 9개 항목 전체 노출."
            sub_fields:
              - name: bedtime
                type: String (Enum: Bedtime)
                description: "취침 시간"
              - name: wakeUpTime
                type: String (Enum: WakeUpTime)
                description: "기상 시간"
              - name: sleepHabits
                type: List<String (Enum: SleepHabit)>
                description: "잠버릇 목록 (복수 가능)"
              - name: cleaningCycle
                type: String (Enum: CleaningCycle)
                description: "청소 주기"
              - name: dormStayTime
                type: String (Enum: DormStayTime)
                description: "기숙사 체류 시간"
              - name: callHabit
                type: String (Enum: CallHabit)
                description: "통화 습관"
              - name: indoorTemperature
                type: String (Enum: IndoorTemperature)
                description: "실내 온도 민감도"
              - name: noiseSensitivity
                type: String (Enum: NoiseSensitivity)
                description: "소음 민감도"
              - name: smoking
                type: String (Enum: Smoking)
                description: "흡연 여부"

          # --- 룸메이트 선호도 (3개 우선순위) ---
          - name: roommatePreferences
            type: List<String (Enum: RoommatePreferenceFactor)>
            nullable: true
            description: >
              선호도 미등록 사용자는 null. 등록된 경우 [firstPriority, secondPriority, thirdPriority] 3개 순서대로 반환.

  data_flow:
    - step: 1
      layer: Presentation (UserController)
      action: "@CurrentMemberId로 JWT에서 userId 추출 후 UserUseCase.getMyProfile(userId) 호출"
    - step: 2
      layer: UseCase (UserUseCase)
      action: "UserGetService.getById(userId)로 User 조회 (없으면 USER_NOT_FOUND)"
      transaction: "@Transactional(readOnly = true) (클래스 기본값)"
    - step: 3
      layer: UseCase (UserUseCase)
      action: "User.getDepartment() (LAZY) 접근 → Department 로드. department_id가 null이면 스킵."
    - step: 4
      layer: UseCase (UserUseCase)
      action: >
        ChecklistGetService.findByUser(user)로 LifestyleChecklist Optional 조회.
        Optional.isPresent()면 findSleepHabitsByChecklist(checklist)로 잠버릇 목록 조회 후 ChecklistBundle 구성.
        Optional.isEmpty()면 null 유지 (예외 없음).
    - step: 5
      layer: UseCase (UserUseCase)
      action: >
        RoommatePreferenceGetService.findByUser(user)로 RoommatePreference Optional 조회.
        Optional.isEmpty()면 null 유지 (예외 없음).
    - step: 6
      layer: UseCase (UserUseCase)
      action: "MyProfileResponse.of(user, department, checklistBundle, preference) 생성 후 반환"
    - step: 7
      layer: Response
      action: "200 OK, CommonResponse<MyProfileResponse> 반환"

  database:
    entities:
      - name: User
        action: Read
        fields: "id 기준 단건 조회. department FK는 LAZY 로딩."
      - name: Department
        action: Read
        fields: "User.department_id 기준 단건 조회 (LAZY). user.department가 null이면 미조회."
      - name: LifestyleChecklist
        action: Read
        fields: "user_id 기준 단건 조회 (deleted = false). 미등록 시 null 반환 (예외 X)."
      - name: LifestyleChecklistSleepHabit
        action: Read
        fields: "checklist_id 기준 다건 조회 (deleted = false). checklist 없으면 미조회."
      - name: RoommatePreference
        action: Read
        fields: "user_id 기준 단건 조회. 미등록 시 null 반환 (예외 X)."

  validation_rules:
    - "MEMBER 권한 필요 (JWT 미존재/만료 → 401)"
    - "userId로 User 조회 실패 시 → 404 USER_NOT_FOUND (40203, User 도메인 공용)"
    - "온보딩 미완료 사용자도 200 OK 반환. 미설정 필드는 null (마이페이지 진입 차단 X)."
    - "체크리스트 미등록 사용자는 checklist=null로 반환. 404 미발생."
    - "룸메이트 선호도 미등록 사용자는 roommatePreferences=null로 반환. 404 미발생."

  error_codes:
    domain_range: "402xx (User 도메인) — 기존 코드 재사용. 신규 ErrorCode 없음."
    codes:
      - code: 40203
        name: USER_NOT_FOUND
        status: 404 NOT_FOUND
        message: "사용자를 찾을 수 없습니다."
        trigger: "JWT userId로 User 조회 실패 시 (변조/탈퇴 등)"

  response_codes:
    new_code:
      - code: 200
        name: MY_PROFILE_FOUND
        status: 200 OK
        message: "내 프로필 정보를 조회했습니다."
        note: "UserResponseCode enum에 추가 필요 (기존 USER_BASIC_TAG_FOUND와 동일 enum)"

testing_strategy:
  happy_path:
    - "온보딩/체크리스트/선호도 모두 완료한 사용자 GET 호출 → 200 OK, 모든 필드 채워진 응답 반환"
    - "checklist.sleepHabits가 복수(예: [TOSS_AND_TURN, SNORING])일 때 List에 모두 포함"
    - "roommatePreferences가 [BEDTIME, SMOKING, NOISE_SENSITIVITY] 순서대로 반환 (1->2->3순위)"
    - "department 정보가 departmentId와 departmentName 모두 채워져 반환"
  edge_cases:
    - "온보딩 미완료 사용자 → birthYear/gender/campus/department*/grade/semester/dormitory가 모두 null, 200 OK"
    - "체크리스트 미등록 사용자 → checklist=null, 200 OK (404 미발생)"
    - "룸메이트 선호도 미등록 사용자 → roommatePreferences=null, 200 OK (404 미발생)"
    - "체크리스트/선호도 모두 미등록 사용자 → checklist=null, roommatePreferences=null, 200 OK"
    - "JWT가 가리키는 userId로 User 조회 실패 → 404 USER_NOT_FOUND (40203)"
    - "JWT 누락/만료 → 401 UNAUTHORIZED (글로벌 인증 필터)"
    - "soft delete된 체크리스트(deletedAt 존재) → findByUser 쿼리에서 제외 → checklist=null"
