# Feature Specification: AI 추천 룸메이트 조회 (홈 화면)
# Status: Draft
# Last Updated: 2026-05-28

meta:
  id: FEAT-017
  title: AI 추천 룸메이트 조회 (홈 화면)
  type: Feature
  author: 1winhyun

overview:
  summary: >
    인증된 사용자가 홈 화면에서 본인 체크리스트/선호도 기준으로 외부 AI 분석 API(/match-detail-batch)를
    호출하여 매칭률이 높은 다른 사용자 최대 3명을 매칭률 내림차순으로 반환한다. 모집글 존재 여부와 무관한
    사용자 대 사용자 매칭이며, 동일 (userId) 키로 6시간 Redis 캐싱하여 AI API 호출 비용을 절감한다.
    각 카드 응답에는 매칭률(%) + 상대방 프로필 메타(프로필 이미지/userId/이름/출생년도/학과명/기숙사/흡연 여부/
    선호도 우선순위 3개)가 포함된다.
  user_story: >
    As a 체크리스트·선호도 등록 완료 사용자, I want to 홈 화면에서 나와 잘 맞는 룸메이트 후보 3명을
    매칭률 카드 형태로 보고, so that 빠르게 어울릴 만한 사람을 발견하고 다음 액션(채팅/모집글 탐색 등)으로
    이어갈 수 있다.
  goals:
    - 모집글과 무관한 사용자 대 사용자(체크리스트/선호도 only) 매칭
    - 동일 성별 / 동일 캠퍼스 / 동일 기숙사 후보 한정 (요청자 User 엔티티에서 자동 도출, 클라이언트가 제어 불가)
    - 양측(요청자 + 후보) 모두 체크리스트·선호도 등록 완료 상태에서만 매칭 대상으로 포함
    - 본인 제외
    - AI top_k=3 으로 1회 batch 호출
    - 매칭률 내림차순 최대 3건 반환
    - 동일 (userId) 키로 6시간 Redis 캐싱 (gender/campus/dormitory 는 userId 에 종속이므로 키에서 제외)
    - FEAT-011/012의 도메인 자산(MatchAnalysisProfile, AiMatchUserPayload, MatchBatchAnalysisPort 등) 최대 재사용

# ============================================================
# 외부 의존성 (AI 분석 API — Batch 모드)
# ============================================================
external_dependencies:
  ai_match_batch_api:
    base_url: "http://ceprj.gachon.ac.kr:60007 (재사용 — application.yml ai.match-api.base-url)"
    endpoint: POST /match-detail-batch
    swagger: "http://ceprj.gachon.ac.kr:60007/docs"
    request_content_type: application/json
    request_body_shape:
      user: "RawProfile (요청자) — FEAT-011과 동일 구조"
      candidates: "List<RawProfile> — 후보 사용자들. candidates[i] 가 응답의 candidateIndex=i 로 매핑됨."
      top_k: "Integer — 본 기능에서는 3 고정"
    response_shape:
      ranked: "List<RankedItem> — 매칭률 내림차순 정렬 (최대 3건)"
      ranked_item:
        rank: "1부터 시작하는 순위"
        candidateIndex: "요청 candidates 배열 원본 인덱스 (필수 매핑 키)"
        matchRate: "Integer 0~100 — logit 보정"
        counts: "{ matched, mismatched, total } — total은 항상 8"
        matchedFeatures: "List<{ key, label, description }> — 본 기능 미사용"
        mismatchedFeatures: "List<{ key, label, description, advice }> — 본 기능 미사용"
        conversationStarters: "List<{ key, starter, subtitle }> — 본 기능 미사용"
        topInfluentialFeatures: "List<String> — 본 기능 미사용"
        summaryComment: "{ brief, positive, caution } — 본 기능 미사용"
      note: >
        본 기능은 홈 카드 용도이므로 matchedFeatures/mismatchedFeatures/conversationStarters/
        topInfluentialFeatures/summaryComment 는 응답에서 모두 무시. matchRate + candidateIndex 만 사용.
        → FEAT-012 와 동일한 MatchBatchAnalysisPort/MatchBatchResult/RankedMatch 재사용 (신규 포트 정의 불필요).
    timeout:
      connect: 3s
      read: 10s (FEAT-012 의 read-timeout-batch 재사용)
      note: "타임아웃 초과 시 502 AI_SERVICE_UNAVAILABLE."
    candidate_size_policy:
      v1: "하드 필터 통과 + 양측 등록 조건 만족 후보 전체 전송 (상한 없음)"
      future: "후보 수가 N>=100 수준으로 증가 시 createdAt DESC top-K 컷오프 도입 검토 — FEAT-012 와 동일 정책"

# ============================================================
# API 명세
# ============================================================
technical_spec:
  api:
    - method: GET
      path: /api/v1/users/recommended-roommates
      summary: AI 매칭률 기반 추천 룸메이트 목록 조회 (최대 3건, 홈 화면)
      auth: MEMBER (Bearer Token, 필수)
      request:
        query_params: []
        dto: "(없음)"
        fields: []
        note: >
          쿼리 파라미터 없음. gender/campus/dormitory 는 요청자 User 엔티티에서 서버 측 자동 추출 →
          클라이언트가 추천 범위를 변조할 수 없도록 차단.
      response:
        dto: AiRecommendedRoommateResponse (List)
        http_status: 200 OK
        wrapper: CommonResponse<List<AiRecommendedRoommateResponse>>
        response_code: UserResponseCode.AI_RECOMMENDED_ROOMMATES_FOUND
        fields:
          - name: userId
            type: Long
            note: "추천된 상대 사용자 ID — 카드 클릭 시 프로필/채팅 등 후속 액션 용도"
          - name: username
            type: String
            note: "상대 사용자 이름 (User.username)"
          - name: profileImage
            type: String
            nullable: true
            note: "프로필 이미지 URL (User.profileImage). Google OAuth picture 기반. 미설정 가능 → null 허용"
          - name: birthYear
            type: Integer
            note: "출생년도. 화면의 '20세' 등 표기는 프론트가 변환 (currentYear - birthYear + 1)."
          - name: departmentName
            type: String
            note: "학과명 (Department.name). User.department LAZY 조인 결과."
          - name: dormitory
            type: String (Enum)
            note: "기숙사 (DORM_1 | DORM_2 | DORM_3). 요청자와 항상 동일하지만 카드 표기를 위해 응답에 포함."
          - name: smoking
            type: String (Enum)
            note: "후보 LifestyleChecklist.smoking. NON_SMOKER | CIGARETTE | ELECTRONIC_CIGARETTE. UI 텍스트('비흡연' 등)는 프론트 매핑."
          - name: roommatePreferences
            type: List<String (Enum)>
            note: >
              후보의 RoommatePreference 우선순위 3개 [priority1, priority2, priority3] 순서대로 반환.
              값은 RoommatePreferenceFactor enum (BEDTIME / WAKE_UP_TIME / SLEEP_HABIT / DORM_STAY_TIME /
              CLEANING_HABIT / INDOOR_TEMPERATURE / NOISE_SENSITIVITY / ITEM_SHARING / SMOKING / CALL_HABIT).
              UI 텍스트('취침 시간' 등) 및 태그 칩 디자인은 프론트.
          - name: matchRate
            type: Integer
            note: "AI 응답의 ranked[i].matchRate 그대로 (0~100, logit 보정)"

  filtering_logic:
    hard_filter_sql:
      - "user.id != requester.id  (본인 제외)"
      - "user.deleted = false"
      - "user.gender = requester.gender  (동일 성별, 요청자에서 도출)"
      - "user.campus = requester.campus  (동일 캠퍼스, 요청자에서 도출)"
      - "user.dormitory = requester.dormitory  (동일 기숙사, 요청자에서 도출)"
      - "user.is_checklist_registered = true  (체크리스트 등록 완료자만, eligibility 사전 컷)"
      - "user.is_roommate_preference_registered = true  (선호도 등록 완료자만, eligibility 사전 컷)"
      - "정렬: SQL 단계는 id ASC (후보 풀 결정성). 최종 정렬은 AI matchRate."
      - "주의: gender/campus/dormitory 는 클라이언트가 변조할 수 없도록 항상 서버가 요청자 User 엔티티에서 추출. 쿼리 파라미터 미수용."
      - "이미 활성 룸메이트 그룹에 속한 사용자도 후보에 포함 (요구사항 확정) → group 멤버십 필터 없음."
    eligibility_filter_in_app:
      - "후보 작성자의 LifestyleChecklist 조회 실패(soft-deleted 등) → 후보에서 제외"
      - "후보 작성자의 LifestyleChecklistSleepHabit 은 deleted=false 만 포함"
      - "후보 작성자의 RoommatePreference 조회 실패 → 후보에서 제외"
      - "SQL 단계의 is_checklist_registered / is_roommate_preference_registered 플래그로 대부분 사전 컷되지만, soft delete 시점 차이 등으로 누락 가능성 있어 in-app 가드 유지."
    ai_request:
      - "user: 요청자 RawProfile"
      - "candidates: 후보 전체 (eligibility 통과분), 원본 인덱스 유지"
      - "top_k: 3"
    post_processing:
      - "AI 응답 ranked[].candidateIndex 로 원본 후보 사용자 매핑"
      - "ranked[i].matchRate + 카드 메타(userId/username/profileImage/birthYear/departmentName/dormitory/smoking/roommatePreferences) 결합"
      - "matchRate 순(=rank ASC) 그대로 응답 (외부 재정렬 X)"
      - "응답은 최대 3건 (AI top_k=3). eligibility 통과 후보가 3건 미만이면 그만큼만 반환"

  data_flow:
    - step: 1
      layer: Presentation (UserController)
      action: "@CurrentMemberId로 JWT userId 추출 후 AiRecommendedRoommatesUseCase.getRecommended(userId) 호출"
    - step: 2
      layer: UseCase (AiRecommendedRoommatesUseCase)
      action: >
        AiRecommendedRoommatesCachePort.find(userId) → Optional<List<AiRecommendedRoommateResponse>>.
        캐시 HIT 시 즉시 반환 (외부 AI 호출/DB 조회 모두 생략).
      transaction: 없음 (cache I/O는 트랜잭션 외부)
    - step: 3
      layer: Application Loader (RecommendedRoommatesDataLoader)
      action: >
        캐시 MISS 시 단일 @Transactional(readOnly = true) 경계 안에서:
          1) UserGetService.getById(userId) — 실패 시 USER_NOT_FOUND.
          2) 요청자 LifestyleChecklist + SleepHabits 조회 — 미등록 시 CHECKLIST_NOT_REGISTERED
          3) 요청자 RoommatePreference 조회 — 미등록 시 PREFERENCE_NOT_REGISTERED
          4) UserGetService.findCandidatesForRecommendation(requester)
             → List<User> with fetch join (department). 내부 QueryDSL/JPQL 이
             id!=, gender=, campus=, dormitory=, is_checklist_registered=true,
             is_roommate_preference_registered=true, deleted=false 하드 필터 적용.
          5) 후보 user_id 집합으로 ChecklistGetService.getChecklistBundlesByUserIds(candidateIds)
             → Map<Long, ChecklistBundle>      # FEAT-010 도입 자산 재사용
          6) 후보 user_id 집합으로 RoommatePreferenceGetService.getByUserIdIn(candidateIds)
             → Map<Long, RoommatePreference>   # FEAT-012 에서 신설 예정 자산 재사용
          7) 위 Map 들을 기반으로 eligibility(체크리스트+선호도 존재) 통과 후보만 추려
             RecommendedRoommatesBundle(requesterProfile, List<CandidateUserEntry>) 반환
        loadBundle() 반환과 동시에 트랜잭션 종료 — 외부 AI 호출 전 DB 커넥션 반환.
      transaction: true (readOnly)
    - step: 4
      layer: UseCase (AiRecommendedRoommatesUseCase)
      action: >
        eligibility 통과 후보가 0건이면 빈 리스트 반환 (캐시에 빈 리스트도 저장).
        그 외에는 MatchBatchCommand(requesterProfile, candidateProfiles, topK=3) 조립.
    - step: 5
      layer: Domain Port (MatchBatchAnalysisPort) → External Adapter (AiMatchBatchClient)
      action: >
        matchBatchAnalysisPort.analyze(command) 호출 — DB 트랜잭션 밖.
        FEAT-012 의 어댑터(AiMatchBatchClient) 재사용. top_k 만 3 으로 전달.
        connect 3s / read 10s. 응답 2xx 아니거나 타임아웃 시 AI_SERVICE_UNAVAILABLE.
    - step: 6
      layer: UseCase (AiRecommendedRoommatesUseCase)
      action: >
        result.ranked() 순회 — candidateIndex 로 원본 CandidateUserEntry 매핑 →
        AiRecommendedRoommateResponse.from(user, department, checklist, preference, matchRate) 변환.
        결과 순서는 AI rank 순(매칭률 내림차순) 유지.
    - step: 7
      layer: UseCase (AiRecommendedRoommatesUseCase)
      action: "AiRecommendedRoommatesCachePort.save(userId, responses, ttl=6h) 저장 후 반환"
    - step: 8
      layer: Response
      action: "200 OK, CommonResponse<List<AiRecommendedRoommateResponse>> 반환"

  caching:
    enabled: true
    store: Redis
    ttl: "6h (PT6H)"
    key_pattern: "ai-recommended-roommates:user:{userId}"
    key_design_note: >
      쿼리 파라미터 없음 → 키는 userId 단일 차원. gender/campus/dormitory 는 userId 에 종속(요청자 User
      엔티티에서 도출)이므로 키 구성에서 자연 배제.
      사용자가 프로필을 수정해 dormitory/campus/gender 가 바뀌어도 TTL 만료까지는 이전 데이터의
      stale 캐시가 반환될 수 있음 — 수용 가능한 트레이드오프(요구사항 확정, FEAT-012 와 동일 정책).
    value: "Jackson 직렬화된 List<AiRecommendedRoommateResponse>"
    invalidation:
      policy: "TTL 만료 외 무효화 없음 (요구사항 확정)"
      stale_window: >
        최대 6시간 stale 허용. 6시간 이내에 후보 사용자가 체크리스트/선호도/프로필을 변경해도
        요청자에게는 캐시된 결과 반환. 프로필 이미지/학과명 등이 변경된 후보가 노출될 수 있음 —
        프론트가 카드 클릭 시 최신 사용자 정보로 조회 (별도 프로필 조회 API).
    empty_result_cache:
      rule: "eligibility 통과 후보 0건 시에도 빈 리스트를 동일 키로 6h 캐싱"
      reason: "후보가 없는 사용자의 반복 요청에 대해 DB 풀 스캔 방지 (FEAT-012 와 동일 정책)"
    fail_open:
      rule: "캐시 조회/저장 실패(Redis 장애)는 로깅 후 무시하고 정상 흐름 진행"
      reason: "캐시는 비용 절감 수단이지 정확성에 영향 주지 않음 (FEAT-012 와 동일 정책)"

  error_codes:
    domain_range: "402xx (User 도메인) + 405xx (Checklist 도메인) — check_error_codes.py 실행 후 신규 코드 충돌 확인"
    codes:
      - code: 40709
        name: CHECKLIST_NOT_REGISTERED
        status: 409 CONFLICT
        message: "AI 추천을 받으려면 생활습관 체크리스트 등록이 필요합니다."
        trigger: "요청자 본인의 LifestyleChecklist 미등록"
        note: "FEAT-011/012 와 동일 코드 재사용. 후보 미등록은 eligibility 필터로 제외."
      - code: 40710
        name: PREFERENCE_NOT_REGISTERED
        status: 409 CONFLICT
        message: "AI 추천을 받으려면 룸메이트 선호도 등록이 필요합니다."
        trigger: "요청자 본인의 RoommatePreference 미등록"
        note: "FEAT-011/012 와 동일 코드 재사용."
      - code: 40711
        name: AI_SERVICE_UNAVAILABLE
        status: 502 BAD_GATEWAY
        message: "AI 매칭 분석 서비스에 일시적으로 접근할 수 없습니다. 잠시 후 다시 시도해주세요."
        trigger: "외부 AI batch API 타임아웃 / 5xx 응답 / 네트워크 오류 / 응답 body null"
        note: "FEAT-011/012 와 동일 코드 재사용."
      - code: 40203
        name: USER_NOT_FOUND
        status: 404 NOT_FOUND
        message: "사용자를 찾을 수 없습니다."
        trigger: "JWT userId로 User 조회 실패 시"
        note: "User 도메인(402xx) 공용 코드"

  response_codes:
    new_code:
      - code: 200
        name: AI_RECOMMENDED_ROOMMATES_FOUND
        status: 200 OK
        message: "AI 추천 룸메이트 목록을 조회했습니다."
        note: "UserResponseCode enum 에 추가 (USER_BASIC_TAG_FOUND / MY_PROFILE_FOUND 와 동일 enum)"

  validation_rules:
    - "요청자 본인 LifestyleChecklist 미등록 → 409 CHECKLIST_NOT_REGISTERED"
    - "요청자 본인 RoommatePreference 미등록 → 409 PREFERENCE_NOT_REGISTERED"
    - "후보 사용자 체크리스트/선호도 미등록은 에러 아님 → 단순히 후보에서 제외"
    - "본인은 후보에서 제외 (SQL 단계)"
    - "요청자와 성별이 다른 사용자는 후보에서 제외 (SQL 단계)"
    - "요청자와 캠퍼스가 다른 사용자는 후보에서 제외 (SQL 단계)"
    - "요청자와 기숙사가 다른 사용자는 후보에서 제외 (SQL 단계)"
    - "soft-delete (User.deleted=true) 사용자는 후보에서 제외 (SQL 단계)"
    - "요청자 User 의 gender/campus/dormitory 가 null 인 경우는 발생하지 않음 — 체크리스트 등록 완료 전제는 온보딩 완료를 함의 (FEAT-012 와 동일 불변)"
    - "eligibility 통과 후보 0건이면 빈 배열 200 OK 반환 (에러 아님, 캐시 저장됨)"
    - "AI API 호출 실패(타임아웃·5xx·null body)는 AI_SERVICE_UNAVAILABLE 로 표준화하여 502 응답 (캐시 저장 안 함)"
    - "응답 결과는 AI rank ASC (matchRate DESC) 순서 유지 — 백엔드에서 재정렬 금지"
    - "응답은 최대 3건 (AI top_k=3). eligibility 통과 후보가 3건 미만이면 그만큼만 반환"

# ============================================================
# 설정 (application.yml)
# ============================================================
configuration:
  application_yml:
    ai:
      match-api:
        recommended-roommates-top-k: 3              # 신규
        recommended-roommates-cache-ttl: 21600      # seconds (6h) — FEAT-012 와 같은 값이지만 의미적 분리
    note: >
      base-url / connect-timeout / read-timeout-batch 는 FEAT-011/012 정의 재사용.
  binding_class:
    name: AiMatchApiProperties
    annotation: "@ConfigurationProperties(prefix = \"ai.match-api\")"
    fields_to_add:
      - recommendedRoommatesTopK: int (default 3)
      - recommendedRoommatesCacheTtl: long (seconds, default 21600)
  redis:
    requirement: "FEAT-012 도입 전제 (spring-boot-starter-data-redis). 재의존성 추가 불필요."
    serializer: "StringRedisSerializer (key) + GenericJackson2JsonRedisSerializer (value) — 기존 빈 재사용"

# ============================================================
# 구성 요소
# ============================================================
components:
  # ----- 재사용 (FEAT-011/012) -----
  MatchBatchAnalysisPort:
    reused_from: FEAT-012
    package: "domain.post.domain.port.match"
    note: >
      포트가 post 도메인 패키지에 있지만, 본질은 AI 매칭 분석 추상화이므로 user 도메인 UseCase 에서
      그대로 import 하여 사용. 향후 매칭 도메인을 별도 분리할 여지가 생기면 패키지 이전 검토.
      v1 에서는 패키지 이전 없이 재사용.

  MatchBatchCommand / MatchBatchResult / RankedMatch:
    reused_from: FEAT-012
    package: "domain.post.domain.port.match"

  AiMatchBatchClient:
    reused_from: FEAT-012
    package: "domain.post.external.aimatch"
    note: "동일 빈 재사용. top_k 만 호출 시점에 3 으로 전달."

  MatchAnalysisProfile:
    reused_from: FEAT-011
    package: "domain.post.domain.port.match"
    note: "{ User, LifestyleChecklist, List<SleepHabit>, RoommatePreference } 묶음. 요청자/후보 모두 동일 타입."

  AiMatchUserPayload (+ .of() 헬퍼):
    reused_from: FEAT-011
    package: "domain.post.external.aimatch.dto"

  ChecklistGetService.getChecklistBundlesByUserIds:
    reused_from: FEAT-010
    package: "domain.checklist.domain.service"

  RoommatePreferenceGetService.getByUserIdIn:
    reused_from: FEAT-012 (신설 예정 메서드)
    package: "domain.preference.domain.service"

  # ----- 신규 -----
  AiRecommendedRoommatesUseCase:
    package: "domain.user.application.usecase"
    dependencies:
      - AiRecommendedRoommatesCachePort        # 캐시 우선 조회/저장
      - RecommendedRoommatesDataLoader         # DB 조회 (트랜잭션 경계)
      - MatchBatchAnalysisPort                 # 외부 AI 호출 (트랜잭션 밖) — 재사용
      - AiMatchApiProperties                   # topK, cacheTtl 주입
    transaction: "없음 (DB I/O는 DataLoader 내부, 캐시·AI는 트랜잭션 외부)"
    method: "List<AiRecommendedRoommateResponse> getRecommended(Long userId)"
    flow:
      - "cache.find → HIT 즉시 반환"
      - "loader.loadBundle → 요청자 검증 + 후보 수집"
      - "후보 0건 → 빈 리스트 캐시 저장 후 반환"
      - "matchBatchAnalysisPort.analyze (top_k=3) → ranked 수신"
      - "ranked → AiRecommendedRoommateResponse 매핑 (candidateIndex 로 CandidateUserEntry 결합)"
      - "cache.save (TTL 6h) 후 반환"

  RecommendedRoommatesDataLoader:
    package: "domain.user.application.loader"
    type: "Application Helper (@Component)"
    method: "RecommendedRoommatesBundle loadBundle(Long userId)"
    transaction: "@Transactional(readOnly = true) — 메서드 레벨"
    dependencies:
      - UserGetService                          # getById + findCandidatesForRecommendation
      - ChecklistGetService
      - RoommatePreferenceGetService
    rationale: >
      FEAT-011/012 와 동일 패턴 — 외부 AI 호출(최대 10s) 동안 DB 커넥션 점유 회피.
      별도 빈으로 분리해야 Spring AOP @Transactional 적용됨.
      요청자 User 엔티티를 그대로 UserGetService.findCandidatesForRecommendation 에 전달 →
      gender/campus/dormitory 하드 필터를 도메인 서비스/리포지토리 안에서 일괄 적용
      (rules: Signature → Pass WHOLE OBJECTS).

  RecommendedRoommatesBundle:
    package: "domain.user.application.loader"
    type: "record (application 내부 값 객체)"
    fields:
      - requesterProfile: MatchAnalysisProfile
      - candidates: List<CandidateUserEntry>
    note: "loadBundle() 반환 단위. 외부 노출 없음."

  CandidateUserEntry:
    package: "domain.user.application.loader"
    type: "record"
    fields:
      - user: User                              # fetch join 으로 department 포함
      - profile: MatchAnalysisProfile           # user + 후보 체크리스트 + 선호도
    note: "AI 요청 인덱스 = candidates 리스트 인덱스. 응답 매핑 키."

  AiRecommendedRoommateResponse:
    package: "domain.user.application.dto.response"
    type: "record"
    static_factory: "from(User user, Department department, LifestyleChecklist checklist, RoommatePreference preference, int matchRate)"
    fields:
      - userId: Long
      - username: String
      - profileImage: String                    # nullable
      - birthYear: Integer
      - departmentName: String                  # department.getName()
      - dormitory: Dormitory                    # user.getDormitory()
      - smoking: Smoking                        # checklist.getSmoking()
      - roommatePreferences: List<RoommatePreferenceFactor>  # [p1, p2, p3]
      - matchRate: int
    note: >
      Department 는 별도 인자로 전달받아 LAZY 강제 트리거를 UseCase 내부에서만 수행.
      DTO 자체는 record + static factory (NO direct instantiation).

  AiRecommendedRoommatesCachePort:
    package: "domain.user.domain.port.cache"
    type: "Domain Interface (Port)"
    methods:
      - "Optional<List<AiRecommendedRoommateResponse>> find(Long userId)"
      - "void save(Long userId, List<AiRecommendedRoommateResponse> value, Duration ttl)"
    note: >
      Application DTO 를 캐시값 타입으로 노출 — 응답 직렬화 비용을 캐시 단계에서 일회 지불.
      구현체는 infrastructure 레이어 (Redis는 우리가 통제하는 시스템 → infrastructure/).

  RedisAiRecommendedRoommatesCacheAdapter:
    package: "infrastructure.cache.airecommendedroommates"
    type: "implements AiRecommendedRoommatesCachePort"
    impl: "RedisTemplate<String, Object> 또는 StringRedisTemplate + ObjectMapper"
    key_builder: >
      "ai-recommended-roommates:user:" + userId
    value_serializer: "GenericJackson2JsonRedisSerializer (기존 빈 재사용)"
    fail_open:
      - "find() 실패 시 Optional.empty() 반환 + WARN 로깅"
      - "save() 실패 시 무시 + WARN 로깅"

# ============================================================
# 신규 / 수정 컴포넌트
# ============================================================
implementation_targets:
  new_files:
    - "user/presentation/UserController.java — getRecommendedRoommates() 메서드 추가 (또는 기존 컨트롤러에 핸들러 추가)"
    - "user/application/usecase/AiRecommendedRoommatesUseCase.java"
    - "user/application/loader/RecommendedRoommatesDataLoader.java"
    - "user/application/loader/RecommendedRoommatesBundle.java"
    - "user/application/loader/CandidateUserEntry.java"
    - "user/application/dto/response/AiRecommendedRoommateResponse.java — static factory from(User, Department, LifestyleChecklist, RoommatePreference, int matchRate)"
    - "user/domain/port/cache/AiRecommendedRoommatesCachePort.java"
    - "infrastructure/cache/airecommendedroommates/RedisAiRecommendedRoommatesCacheAdapter.java"
  modified_files:
    - "user/domain/service/UserGetService.java — findCandidatesForRecommendation(requester: User): List<User> 추가 (department fetch join)"
    - "user/domain/repository/UserQueryRepository.java — findCandidatesForRecommendation(requester) 시그니처 추가"
    - "user/infrastructure/repository/UserRepositoryImpl.java — QueryDSL 구현 (id!=, gender=, campus=, dormitory=, is_checklist_registered=true, is_roommate_preference_registered=true, deleted=false, JOIN FETCH user.department)"
    - "user/presentation/response/UserResponseCode.java — AI_RECOMMENDED_ROOMMATES_FOUND 추가"
    - "post/external/aimatch/AiMatchApiProperties.java — recommendedRoommatesTopK, recommendedRoommatesCacheTtl 필드 추가"
    - "application.yml — ai.match-api.recommended-roommates-top-k=3, recommended-roommates-cache-ttl=21600 추가"
  reused_no_change:
    - "MatchBatchAnalysisPort / MatchBatchCommand / MatchBatchResult / RankedMatch (FEAT-012)"
    - "AiMatchBatchClient + AiMatchBatchRequest/Response/RankedItem (FEAT-012)"
    - "MatchAnalysisProfile + AiMatchUserPayload (FEAT-011)"
    - "ChecklistGetService.getChecklistBundlesByUserIds (FEAT-010)"
    - "RoommatePreferenceGetService.getByUserIdIn (FEAT-012)"
    - "RedisConfig / GenericJackson2JsonRedisSerializer 빈 (FEAT-012)"

# ============================================================
# 캐시 동작 시나리오
# ============================================================
cache_scenarios:
  hit_path:
    - "동일 userId 로 6시간 내 재요청 → Redis HIT → AI 호출/DB 조회 모두 생략"
  miss_path:
    - "최초 요청 / TTL 만료 → MISS → 전체 흐름 실행 후 저장"
  fail_open:
    - "Redis 다운 상태에서 find() 예외 → WARN 로깅 후 MISS 처리 (정상 흐름 진행)"
    - "save() 예외 → WARN 로깅 후 응답 정상 반환 (사용자 영향 없음)"
  empty_result:
    - "eligibility 통과 후보 0건 → 빈 리스트도 6h 캐시 저장 (반복 요청 보호)"
  no_negative_cache_on_ai_failure:
    - "AI_SERVICE_UNAVAILABLE 발생 시 캐시 저장 금지 → 다음 요청에서 재시도 가능"

# ============================================================
# 테스트 전략
# ============================================================
testing_strategy:
  happy_path:
    - "캐시 MISS + 동일 성별/캠퍼스/기숙사 후보 5명(모두 등록 완료) → AI 호출 1회 (top_k=3) → 매칭률 내림차순 3건 반환, Redis 저장 확인"
    - "캐시 HIT → AI 호출 0회, DB 조회 0회, 캐시값 그대로 반환"
    - "AI top_k=3 응답 → AiRecommendedRoommateResponse 최대 3건 (matchRate DESC) 반환"
    - "smoking 필드가 후보 LifestyleChecklist.smoking ENUM 값으로 매핑됨"
    - "roommatePreferences 필드가 [priority1, priority2, priority3] 순서로 매핑됨"
    - "departmentName 이 LAZY 로딩 후 정확히 반환 (User.department.name)"
    - "응답 순서가 AI rank ASC 그대로 유지되고 백엔드 재정렬 없음"
    - "요청자 User 가 UserGetService.findCandidatesForRecommendation 에 그대로 전달됨 (gender/campus/dormitory 클라이언트 변조 불가)"
  edge_cases:
    - "후보 0건 (동일 성별/캠퍼스/기숙사 후보가 없거나 등록 완료자 없음) → 200 OK 빈 배열, 빈 리스트도 캐시 저장"
    - "후보 1~2명만 등록 완료 → AI 호출 후 그만큼만 반환 (top_k=3 이지만 입력 후보가 적으면 응답도 적음)"
    - "후보 중 일부가 SQL 통과했으나 in-app eligibility(soft delete 타이밍 등)에서 탈락 → 해당 후보 제외하고 나머지로 AI 호출"
    - "본인은 후보에서 제외됨 (SQL 단계 확인)"
    - "성별 다른 사용자는 후보에서 제외됨 (SQL 단계 확인)"
    - "캠퍼스 다른 사용자는 후보에서 제외됨 (SQL 단계 확인)"
    - "기숙사 다른 사용자는 후보에서 제외됨 (SQL 단계 확인)"
    - "soft-delete (User.deleted=true) 사용자는 후보에서 제외됨"
    - "요청자 체크리스트 미등록 → 409 CHECKLIST_NOT_REGISTERED (캐시 저장 안 함)"
    - "요청자 선호도 미등록 → 409 PREFERENCE_NOT_REGISTERED (캐시 저장 안 함)"
    - "AI batch API 타임아웃 → 502 AI_SERVICE_UNAVAILABLE (캐시 저장 안 함, 다음 요청 재시도 가능)"
    - "AI batch API 5xx → 502 AI_SERVICE_UNAVAILABLE"
    - "AI 응답 ranked=null → 502 AI_SERVICE_UNAVAILABLE"
    - "Redis 다운 (find/save 예외) → 캐시 무시하고 정상 흐름 진행, 200 OK 반환"
    - "JWT 변조 userId → 404 USER_NOT_FOUND"
    - "프로필 이미지가 null 인 후보 → response.profileImage = null 로 정상 반환"
  integration:
    - "AiMatchBatchClient(재사용): MockWebServer 로 /match-detail-batch (top_k=3) 응답 모킹 + read timeout 10s 적용 확인 — FEAT-012 테스트와 통합 가능"
    - "RedisAiRecommendedRoommatesCacheAdapter: Embedded Redis 또는 Testcontainers Redis 로 TTL 6h 저장/조회/만료 확인"
    - "RecommendedRoommatesDataLoader: 후보 1000건 일괄 조회 시 N+1 미발생 (총 4 쿼리: requester+checklist+preference / candidate users(+department fetch join) / candidate checklists / candidate preferences) 검증"
  serialization_regression:
    - "AiMatchBatchResponse 의 미사용 필드(matchedFeatures 등)가 응답에 포함되어도 @JsonIgnoreProperties(ignoreUnknown=true) 로 안전하게 무시됨 (FEAT-012 와 공유 어댑터)"
    - "AiRecommendedRoommateResponse 가 Redis 캐시 왕복 후에도 enum 값(Dormitory/Smoking/RoommatePreferenceFactor)이 정확히 복원됨"

# ============================================================
# 주의사항
# ============================================================
notes:
  - >
    [아키텍처] UseCase 는 외부 어댑터(AiMatchBatchClient)와 Redis 어댑터에 직접 의존하지 않고
    각각 MatchBatchAnalysisPort, AiRecommendedRoommatesCachePort 에만 의존.
    "NO Layer Skipping" 규칙 준수.
  - >
    [패키지 경계] 본 기능은 user 도메인이지만 MatchBatchAnalysisPort/MatchAnalysisProfile 등은
    post 도메인 패키지(domain.post.domain.port.match)에서 import. 의도된 재사용 (매칭 도메인 미분리).
    향후 매칭 도메인이 자체 도메인으로 승격되면 패키지 이전 검토 — v1 범위 밖.
  - >
    [패키지 분류] Redis 어댑터는 우리가 통제하는 시스템 → infrastructure/cache/airecommendedroommates.
    AiMatchBatchClient(재사용)는 통제 불가능한 제3자 AI 서버 연동 → external/ 유지.
  - >
    [트랜잭션 경계] DB 조회는 RecommendedRoommatesDataLoader 의 @Transactional(readOnly=true) 안에서만 수행.
    Redis 조회/저장, 외부 AI batch 호출은 모두 트랜잭션 밖.
    외부 API 지연(최대 10s) 동안 DB 커넥션 점유 회피.
  - >
    [PII 보호] FEAT-011/012 와 동일 정책 — AI batch 요청 body 로깅 금지 (메서드/URI/후보 개수/바이트 길이만),
    에러 응답 body 로깅 금지 (status 코드만). 어댑터 재사용으로 정책 자동 승계.
  - >
    [캐시 정확성 vs 비용] 6h TTL 동안 후보의 프로필 이미지/학과/체크리스트/선호도가 변경되어도 캐시 결과에
    stale 정보 노출 가능. 카드는 식별 목적이므로 수용 가능. 프론트는 카드 클릭 후 별도 프로필 조회 API
    로 최신 상태 확인. 명시적 트레이드오프 — 요구사항 확정.
  - >
    [후보 수 상한] v1 미도입. 동일 성별/캠퍼스/기숙사 + 등록 완료자 풀이 통상 작을 것으로 예상되어
    실서비스 모니터링 후 createdAt DESC top-N 컷오프 도입 검토 (FEAT-012 와 동일 정책).
  - >
    [응답 정렬] AI rank ASC = matchRate DESC 순서를 그대로 유지. 백엔드/프론트 재정렬 금지.
    동률 처리는 AI 모델 책임.
  - >
    [나이 표기] birthYear 만 반환. UI 의 '20세' 표기는 프론트가 currentYear - birthYear + 1 (한국식)
    또는 만 나이 계산을 화면별로 결정. 백엔드는 단순 raw 값 제공으로 응답 캐시의 시간 의존성 제거
    (캐시값이 매년 1월 1일에 자동 갱신될 필요 없음).
  - >
    [선호도 표기] roommatePreferences 는 RoommatePreferenceFactor enum 배열로 반환. UI 의 한국어 라벨
    및 칩 디자인은 프론트. 응답에서 '얼리버드/집순이/비흡연' 같은 derived 태그는 미생성 — 그 카드 표기는
    체크리스트 값(wake_up_time, dorm_stay_time, smoking)에서 프론트가 파생.
  - >
    [흡연 표기] smoking 은 LifestyleChecklist.smoking ENUM 그대로 반환 (NON_SMOKER | CIGARETTE | ELECTRONIC_CIGARETTE).
    UI 텍스트('비흡연' 등) 매핑은 프론트.
  - >
    [캐시 키 설계] 사용자 단위 키 → 다른 사용자에게 누설 위험 없음. 쿼리 파라미터 없음 → 키 충돌 없음.
  - >
    [하드 필터 보안] gender/campus/dormitory 는 클라이언트가 전달한 값을 사용하지 않고 항상 서버가
    요청자 User 엔티티에서 추출. JWT 만으로 식별되는 요청자의 본인 데이터를 사용하므로 변조 불가.
  - >
    [전제] 요청자가 체크리스트·선호도 등록을 완료했다면 온보딩(gender/campus/dormitory 설정)도
    선행 완료된 상태(User.completeOnboarding → completeChecklistRegistration 순서 보장).
    따라서 요청자 User 의 세 필드는 non-null 로 가정하고 NPE 방어 코드를 추가하지 않음 (FEAT-012 와 동일).
  - >
    [매칭자 제외 정책] v1 에서는 이미 활성 룸메이트 그룹에 속한 사용자도 후보에 포함 (요구사항 확정).
    필요 시 후속 스펙에서 RoommateGroupMember 활성 멤버십 필터 추가 검토.
  - >
    [재사용 컴포넌트] MatchAnalysisProfile, AiMatchUserPayload, MatchBatchAnalysisPort, AiMatchBatchClient,
    AiMatchApiProperties, RedisConfig 등은 FEAT-011/012 자산 재사용.
    FEAT-011/012 변경 시 본 기능도 함께 검증 필요 (특히 RawProfile snake_case 직렬화 규약, top_k 처리).
  - >
    [에러 코드 재사용] CHECKLIST_NOT_REGISTERED / PREFERENCE_NOT_REGISTERED / AI_SERVICE_UNAVAILABLE 는
    FEAT-011/012 코드 재사용. AI_RECOMMENDED_ROOMMATES_FOUND (200 응답 코드)만 신규 — check_error_codes.py
    충돌 확인.
