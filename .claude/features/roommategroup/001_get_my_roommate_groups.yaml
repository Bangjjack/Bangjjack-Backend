# Feature Specification: 자신이 속한 룸메이트 그룹 목록 조회
# Status: Done
# Last Updated: 2026-05-19

meta:
  id: FEAT-015
  title: 자신이 속한 룸메이트 그룹 목록 조회
  type: Feature
  author: 1winhyun

overview:
  summary: >
    인증된 사용자가 자신이 소속된 모든 룸메이트 그룹(0~2개)을 조회한다.
    한 사용자는 본인 모집글의 LEADER 1개 + 수락된 다른 그룹의 MEMBER 1개로
    최대 2개 그룹에 동시 소속될 수 있으므로 전체 목록(List)으로 반환한다.
    각 그룹별로 모집글 이름·몇인실·기숙사·총 정원·현재 인원·소속 멤버(역할 포함)를 포함한다.
  user_story: >
    As a 인증된 사용자, I want to 내가 속한 룸메이트 그룹들을 조회하고,
    so that 함께 지낼 멤버와 방 정보, 현재 충원 현황을 한눈에 확인할 수 있다.
  goals:
    - 요청자(JWT userId)가 소속된 모든 RoommateGroup 조회 (LEADER + MEMBER, 0~2개)
    - 그룹별 모집글 스냅샷 정보(이름, 몇인실, 기숙사) 반환
    - 그룹별 총 정원(recruitMemberCount + 1) 및 현재 인원(LEADER 포함 전체 멤버 수) 반환
    - 그룹별 소속 멤버 목록(userId, username, profileImage, role) 반환
    - 소속 그룹이 없으면 200 OK + 빈 배열 반환 (에러 아님)
    - N+1 쿼리 방지 (그룹 수와 무관하게 고정 쿼리 수)

# ============================================================
# API 명세
# ============================================================
technical_spec:
  api:
    - method: GET
      path: /api/v1/roommate-groups/me
      summary: 자신이 속한 룸메이트 그룹 목록 조회
      auth: MEMBER (Bearer Token, 필수)
      request:
        path_variable: []
        query_param: []
        dto: "(없음 — @CurrentMemberId로 userId 주입)"
        fields: []
      response:
        dto: MyRoommateGroupResponse (List)
        http_status: 200 OK
        wrapper: CommonResponse<List<MyRoommateGroupResponse>>
        response_code: RoommateGroupResponseCode.MY_ROOMMATE_GROUPS_FOUND
        empty_case: "소속 그룹 없음 → data = [] (빈 배열), 200 OK"
        fields:
          - name: groupId
            type: Long
            note: "RoommateGroup ID (식별자, 코드베이스 컨벤션)"
          - name: postId
            type: Long
            note: "연결된 모집글 ID (식별자, 클라이언트 네비게이션용)"
          - name: postTitle
            type: String
            note: "모집글 제목 (게시글 이름). post.title"
          - name: roomSize
            type: String (Enum RoomSize)
            note: "몇인실 — TWO_PERSON | THREE_PERSON | FOUR_PERSON"
          - name: dormitory
            type: String (Enum Dormitory)
            note: "몇 기숙사 — DORM_1 | DORM_2 | DORM_3 (모집글 작성 시점 스냅샷)"
          - name: totalCapacity
            type: Integer
            note: "총 정원 = post.recruitMemberCount + 1 (LEADER 포함)"
          - name: currentMemberCount
            type: Integer
            note: "현재 인원 = 그룹의 deleted=false 멤버 총수 (LEADER 1 + MEMBER N)"
          - name: members
            type: GroupMemberResponse (nested, List)
            fields:
              - name: userId
                type: Long
              - name: username
                type: String
              - name: profileImage
                type: String
                note: "null 가능"
              - name: role
                type: String (Enum GroupMemberRole)
                note: "LEADER | MEMBER"

  data_flow:
    - step: 1
      layer: Presentation (RoommateGroupController)
      action: "@CurrentMemberId로 JWT에서 userId 추출 후 RoommateGroupUseCase.getMyRoommateGroups(userId) 호출 (요청 body 없음)"
    - step: 2
      layer: UseCase (RoommateGroupUseCase)
      transaction: "readOnly = true"
      action: "RoommateGroupMemberGetService.getMembershipsByUserId(userId)로 요청자의 멤버십 행 조회 (0~2건, group + group.post fetch join)"
    - step: 3
      layer: UseCase (RoommateGroupUseCase)
      action: "멤버십이 비어 있으면 빈 List 반환 (조기 종료, 추가 쿼리 없음)"
    - step: 4
      layer: UseCase (RoommateGroupUseCase)
      action: "멤버십에서 groupId 집합 추출 → RoommateGroupMemberGetService.getAllByGroupIds(groupIds)로 해당 그룹들의 전체 멤버 조회 (user fetch join)"
    - step: 5
      layer: UseCase (RoommateGroupUseCase)
      action: "전체 멤버를 groupId 기준으로 in-memory 그룹핑 (Map<Long, List<RoommateGroupMember>>)"
    - step: 6
      layer: UseCase (RoommateGroupUseCase)
      action: "각 RoommateGroup에 대해 MyRoommateGroupResponse.from(group, groupMembers) 매핑 후 List 반환"
    - step: 7
      layer: Response
      action: "200 OK, CommonResponse<List<MyRoommateGroupResponse>> 반환 (소속 없으면 빈 배열)"

  database:
    entities:
      - name: RoommateGroupMember
        action: Read
        fields: "user_id = 요청자 (멤버십 조회), group_id IN (...) (전체 멤버 조회)"
        note: "deleted = false 필터. 쓰기 없음."
      - name: RoommateGroup
        action: Read
        fields: "멤버십 fetch join으로 함께 로딩"
      - name: RoommatePost
        action: Read
        fields: "title, roomSize, dormitory, recruitMemberCount — group.post fetch join으로 로딩"
      - name: User
        action: Read
        fields: "username, profileImage — member.user fetch join으로 로딩"

  query_strategy:
    note: "N+1 방지. 그룹 수(0~2)와 무관하게 최대 2회 쿼리."
    queries:
      - "Q1: SELECT m FROM RoommateGroupMember m JOIN FETCH m.group g JOIN FETCH g.post WHERE m.user.id = :userId AND m.deleted = false"
      - "Q2: SELECT m FROM RoommateGroupMember m JOIN FETCH m.user WHERE m.group.id IN :groupIds AND m.deleted = false"
    pessimistic_lock: "불필요 (읽기 전용 조회). 동시성 검증 대상 아님."

  response_dto_structure:
    MyRoommateGroupResponse:
      note: "record. static factory method from(RoommateGroup group, List<RoommateGroupMember> members) 사용"
      computed:
        - "totalCapacity = group.getPost().getRecruitMemberCount() + 1"
        - "currentMemberCount = members.size()"
      nested:
        - GroupMemberResponse:
            note: "record. static factory method from(RoommateGroupMember) 사용. member.getUser() 접근"
            list: true

  error_codes:
    domain_range: "409xx (RoommateGroup 도메인)"
    note: "본 기능은 신규 에러코드 없음. 소속 그룹 없음은 정상(빈 배열)으로 처리. @CurrentMemberId가 인증 보장."
    codes: []

  response_codes:
    note: "RoommateGroupResponseCode enum 신규 생성 (현재 도메인에 ResponseCode 없음)."
    codes:
      - name: MY_ROOMMATE_GROUPS_FOUND
        code: 200
        status: 200 OK
        message: "내가 속한 룸메이트 그룹 목록을 조회했습니다."

  validation_rules:
    - "인증된 사용자(MEMBER)만 호출 가능 (@CurrentMemberId)"
    - "deleted = true 멤버십/그룹/멤버는 결과에서 제외"
    - "소속 그룹이 0개여도 에러 아님 → 200 OK + 빈 배열"
    - "한 사용자는 최대 2개 그룹(LEADER 1 + MEMBER 1)까지 반환될 수 있음"
    - "totalCapacity = post.recruitMemberCount + 1 (LEADER 포함 총원)"
    - "currentMemberCount = 그룹의 deleted=false 멤버 총수 (LEADER 1 + MEMBER N)"
    - "members 배열에는 LEADER와 MEMBER가 모두 포함됨 (요청자 본인 포함)"

# ============================================================
# 구현 대상 파일 (Implementation Phase)
# ============================================================
implementation_targets:
  new_files:
    - "presentation/RoommateGroupController.java — @GetMapping(\"/me\"), @CurrentMemberId"
    - "presentation/response/RoommateGroupResponseCode.java — MY_ROOMMATE_GROUPS_FOUND"
    - "application/usecase/RoommateGroupUseCase.java — @Transactional(readOnly=true), getMyRoommateGroups(userId)"
    - "application/dto/response/MyRoommateGroupResponse.java — record + from(group, members)"
    - "application/dto/response/GroupMemberResponse.java — record + from(member)"
  modified_files:
    - "domain/service/RoommateGroupMemberGetService.java — getMembershipsByUserId / getAllByGroupIds 추가"
    - "domain/repository/RoommateGroupMemberRepository.java — fetch join 쿼리 2종 추가"
  layer_rules:
    - "Controller → UseCase 1:1 위임, 비즈니스 로직 없음"
    - "UseCase는 Repository 직접 접근 금지 → RoommateGroupMemberGetService 경유"
    - "Domain Service 간 호출 금지 (RoommateGroupMemberGetService 단독 사용)"
    - "DTO 변환은 Static Factory Method (from) 사용"

# ============================================================
# 테스트 전략
# ============================================================
testing_strategy:
  happy_path:
    - "MEMBER 역할로 1개 그룹 소속 → 200, 그룹 1건 반환, 멤버 목록·역할 정확"
    - "LEADER 역할로 1개 그룹 소속 → 200, 그룹 1건 반환, role=LEADER 포함"
    - "LEADER 1개 + MEMBER 1개 겸직 → 200, 그룹 2건 반환"
    - "totalCapacity = recruitMemberCount + 1 검증 (예: recruitMemberCount=3 → 4)"
    - "currentMemberCount = LEADER 1 + MEMBER N 합계 검증"
    - "members에 LEADER/MEMBER 모두 포함, 각 멤버 userId·username·profileImage·role 매핑 검증"
    - "응답에 postTitle, roomSize, dormitory가 모집글 스냅샷 값과 일치"
  edge_cases:
    - "소속 그룹 없음 → 200 OK + 빈 배열 (에러 아님)"
    - "profileImage가 null인 멤버 포함 → 해당 필드 null로 정상 직렬화"
    - "MEMBER 0명 (LEADER만 있는 그룹) → currentMemberCount=1, members 1건"
    - "정원 가득 찬 그룹 (MEMBER = recruitMemberCount) → currentMemberCount = totalCapacity"
    - "deleted=true 멤버십/멤버는 결과 및 카운트에서 제외"
  query_verification:
    - "그룹 2개 소속 시에도 쿼리 2회 이하 (N+1 미발생) 확인"

# ============================================================
# 주의사항 / 결정 사항
# ============================================================
notes:
  - "그룹 다중 소속 정책 확정: 전체 목록(List) 반환. 사용자 확인 완료 (2026-05-19)."
  - "총 정원 정의 확정: recruitMemberCount + 1 (LEADER 포함). 사용자 확인 완료."
  - "현재 인원: LEADER 포함 그룹 전체 멤버 수. members.size()로 산출 (별도 count 쿼리 불필요)."
  - "멤버 필드 확정: userId, username, profileImage, role. 사용자 확인 완료."
  - "빈 결과 정책 확정: 200 OK + 빈 배열. 별도 에러코드 없음. 사용자 확인 완료."
  - "roommategroup 도메인의 첫 presentation/application/usecase/dto 계층 생성 (기존 domain 계층만 존재)."
  - "기존 RoommateGroupMemberGetService(existsByUserIdAndRole, countByGroupIdAndRole)에 조회 메서드 추가. 기존 메서드/시그니처는 변경하지 않음."
  - "리스트 응답 래핑은 코드베이스 컨벤션(CommonResponse<List<T>>, 예: DepartmentController)을 따름."
  - "요청자 본인의 역할(myRole)은 members 배열 + 클라이언트의 userId로 도출 가능하므로 별도 필드로 추가하지 않음 (스펙 최소화)."
  - "본 스펙은 '내 그룹 목록 조회'만 다룬다. 그룹 단건 상세, 그룹 탈퇴, 그룹 해체는 별도 스펙으로 분리."
