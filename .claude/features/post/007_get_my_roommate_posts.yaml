# Feature Specification: 내가 쓴 룸메이트 모집글 목록 조회
# Status: Draft
# Last Updated: 2026-05-29

meta:
  id: FEAT-020
  title: 내가 쓴 룸메이트 모집글 목록 조회
  type: Feature
  author: 1winhyun

overview:
  summary: >
    인증된 사용자(요청자) 본인이 작성한 룸메이트 모집글 전체를 최신순으로 조회한다.
    삭제된 모집글(deleted=true)은 제외하며, OPEN/CLOSED 상태는 모두 포함한다.
    응답에는 모집글 식별·요약 정보와 함께 모집 총 인원(리더 포함), 현재 모집된 인원(리더 포함),
    마감 여부(isClosed)를 포함한다. 페이지네이션은 적용하지 않는다.
    (사용자별 작성 모집글 수가 적고, 마이페이지 진입 시 한 번에 보여주는 화면 요구사항)
  user_story: >
    As a 인증된 사용자, I want to 내가 작성한 모집글 목록을 한눈에 보고,
    so that 현재 모집 중인 글과 마감된 과거 글을 함께 확인하고 관리(수정/삭제)할 수 있다.
  goals:
    - 요청자 본인이 작성한 모집글만 조회 (작성자 = JWT userId)
    - 삭제(deleted=true) 모집글 제외, OPEN/CLOSED 모두 포함
    - 최신순(createdAt DESC) 정렬
    - 모집 총 인원(리더 포함) = recruitMemberCount + 1
    - 현재 모집된 인원(리더 포함) = 해당 모집글 그룹의 활성(deleted=false) 멤버 수
    - 마감 여부(isClosed) = status == CLOSED
    - 페이지네이션 없음(전체 List 반환)

# ============================================================
# API 명세
# ============================================================
technical_spec:
  api:
    - method: GET
      path: /api/v1/posts/me
      summary: 내가 쓴 룸메이트 모집글 전체 목록 조회 (최신순, 페이지네이션 없음)
      auth: MEMBER (Bearer Token, 필수)
      request:
        path_variable: "(없음)"
        query_params: "(없음)"
        dto: "(없음)"
        fields: []
      response:
        dto: MyRoommatePostResponse
        http_status: 200 OK
        wrapper: CommonResponse<List<MyRoommatePostResponse>>
        response_code: PostResponseCode.MY_POST_LIST_FOUND (신규)
        fields:
          - name: postId
            type: Long
            note: "모집글 ID"
          - name: title
            type: String
            note: "모집글 제목 (RoommatePost.title)"
          - name: description
            type: String
            note: "모집글 설명 (RoommatePost.description, 클라이언트에서 말줄임 처리)"
          - name: dormitory
            type: String (Enum)
            note: "작성 시점 스냅샷 (RoommatePost.dormitory)"
          - name: roomSize
            type: String (Enum)
            note: "TWO_PERSON | THREE_PERSON | FOUR_PERSON"
          - name: totalMemberCount
            type: Integer
            note: "모집 총 인원(리더 포함) = post.recruitMemberCount + 1"
          - name: currentMemberCount
            type: Integer
            note: "현재 모집된 인원(리더 포함) = 해당 post의 RoommateGroup 활성 멤버 수"
          - name: isClosed
            type: Boolean
            note: "마감 여부. post.status == CLOSED 이면 true, OPEN 이면 false"

  query_logic:
    - "WHERE user.id = :userId AND deleted = false"
    - "ORDER BY createdAt DESC"
    - "status 필터 없음 (OPEN + CLOSED 모두 포함)"

  data_flow:
    - step: 1
      layer: Presentation (RoommatePostController)
      action: "@CurrentMemberId로 JWT에서 userId 추출 후 RoommatePostUseCase.getMyPosts(userId) 호출"
    - step: 2
      layer: UseCase (RoommatePostUseCase)
      action: "RoommatePostGetService.getPostsByUserId(userId) 호출 → List<RoommatePost> 수신 (deleted=false, createdAt DESC)"
    - step: 3
      layer: UseCase (RoommatePostUseCase)
      action: "posts에서 postId 목록 추출 후 RoommateGroupMemberGetService.countActiveByPostIdIn(postIds) 호출 → Map<postId, Long> 수신"
    - step: 4
      layer: UseCase (RoommatePostUseCase)
      action: "각 post에 대해 MyRoommatePostResponse.from(post, currentMemberCount) 변환하여 List 조립 후 반환"
    - step: 5
      layer: Response
      action: "200 OK, CommonResponse<List<MyRoommatePostResponse>> 반환. 작성한 글이 없으면 빈 배열."

  new_components:
    response_dto:
      - name: MyRoommatePostResponse
        location: "post/application/dto/response/MyRoommatePostResponse.java"
        type: record
        factory: "static from(RoommatePost post, long currentMemberCount)"
        derived_fields:
          - "totalMemberCount = post.getRecruitMemberCount() + 1"
          - "currentMemberCount = (int) currentMemberCount (Map 값)"
          - "isClosed = post.getStatus() == PostStatus.CLOSED"
    response_code:
      - name: MY_POST_LIST_FOUND
        code: 200
        status: 200 OK
        message: "내가 쓴 룸메이트 모집글 목록 조회에 성공했습니다."
        location: "post/presentation/response/PostResponseCode.java"
    domain_service_method:
      - name: "RoommatePostGetService.getPostsByUserId(Long userId): List<RoommatePost>"
        note: "deleted=false, createdAt DESC 정렬, status 제한 없음. JOIN FETCH 불필요(응답에 user 필드 없음)."
    repository_method:
      - name: "RoommatePostRepository.findAllByUserIdAndDeletedFalseOrderByCreatedAtDesc(Long userId): List<RoommatePost>"
        note: "Spring Data 메서드 네이밍 규칙으로 자동 쿼리 생성"
    reused_components:
      - "RoommateGroupMemberGetService.countActiveByPostIdIn(Collection<Long>) - 기존 메서드 재사용"
      - "RoommatePostUseCase - 기존 유스케이스에 getMyPosts(userId) 메서드 추가"
      - "RoommatePostController - 기존 컨트롤러에 @GetMapping(\"/me\") 추가"

  error_codes:
    note: "본인 글 조회는 별도 에러 없음. 결과 없을 경우 빈 배열 반환. 인증 실패는 글로벌 401."

  validation_rules:
    - "인증된 사용자(MEMBER)만 조회 가능 (Bearer Token 필수)"
    - "본인이 작성한 모집글만 반환 (post.user.id == requesterId)"
    - "deleted=true 모집글은 결과에서 제외"
    - "OPEN, CLOSED 상태 모두 반환"
    - "최신순(createdAt DESC) 정렬 고정"

# ============================================================
# 테스트 전략
# ============================================================
testing_strategy:
  happy_path:
    - "본인이 작성한 OPEN/CLOSED 글이 섞여 있을 때 전부 반환되고 createdAt DESC로 정렬"
    - "본인이 작성한 글이 1건일 때 List 크기 1 반환"
    - "OPEN 글의 isClosed=false, CLOSED 글의 isClosed=true 매핑 확인"
    - "totalMemberCount = recruitMemberCount + 1 매핑 확인 (예: recruit=2 → total=3)"
    - "currentMemberCount = 해당 post 그룹의 활성 멤버 수와 일치 확인 (LEADER 단독 → 1, LEADER+MEMBER 1명 → 2)"
    - "여러 모집글의 currentMemberCount가 각각의 그룹 멤버 수에 정확히 매핑됨 확인"
  edge_cases:
    - "본인이 작성한 글이 없을 때 빈 배열 반환 (예외 발생 없음)"
    - "본인이 작성한 글이 모두 deleted=true 인 경우 빈 배열 반환"
    - "타인이 작성한 글은 결과에 포함되지 않음 (다른 userId 글이 같은 dormitory여도 제외)"
    - "삭제(deleted=true)된 그룹 멤버는 currentMemberCount에 포함되지 않음"
    - "그룹이 비어있는 이론적 상태(LEADER 멤버십도 deleted)에서 currentMemberCount=0 반환"
  query_verification:
    - "모집글 조회 1회 + 멤버 수 IN 집계 1회 = 총 2회 쿼리(N+1 미발생)"
    - "본인 글 0건일 때 멤버 수 집계 쿼리 생략 (postIds 비어있으면 빈 Map 반환)"

# ============================================================
# 주의사항
# ============================================================
notes:
  - "마감 여부는 boolean(isClosed)으로 노출. status enum을 그대로 노출하지 않는 이유: 클라이언트는 마감/모집중 두 상태만 구분하면 충분하며, 향후 상태 enum이 늘어나도 응답 안정성을 유지하기 위함."
  - "totalMemberCount는 post.recruitMemberCount + 1로 계산. RoomSize.getTotalMemberCount()(방의 최대 수용 인원)와는 다른 값임에 유의 — 작성자가 모집 시 지정한 '나를 포함한 모집 총 인원'."
  - "currentMemberCount는 RoommateGroupMember 활성 행 수로 계산. RoommateGroupMemberGetService.countActiveByPostIdIn 재사용으로 N+1 방지."
  - "페이지네이션 없음 — 한 사용자가 동시에 보유할 수 있는 OPEN 모집글은 1개이고(AlreadyOpenPostExistsException로 강제), CLOSED 글도 일반적으로 누적량이 적으므로 List로 일괄 반환."
  - "응답 DTO 위치는 post 도메인(post/application/dto/response/). RoommateGroup 정보는 currentMemberCount 숫자로만 노출하므로 roommategroup 도메인 DTO 의존 없음."
  - "정렬은 Repository 메서드 네이밍(...OrderByCreatedAtDesc)으로 고정. UseCase/Service에서 Sort 인자 전달하지 않음."
