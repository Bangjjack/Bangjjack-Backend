# Feature Specification: AI 추천 룸메이트 모집글 목록 조회
# Status: Draft
# Last Updated: 2026-05-28 (revised: recruitMemberCount → totalMemberCount 로 교체 — RoomSize 에서 그룹 총 정원 도출 (2/3/4))

meta:
  id: FEAT-012
  title: AI 추천 룸메이트 모집글 목록 조회
  type: Feature
  author: 1winhyun

overview:
  summary: >
    인증된 사용자가 본인 체크리스트/선호도 기준으로 외부 AI 분석 API(/match-detail-batch)를 호출하여
    매칭률이 높은 OPEN 상태 룸메이트 모집글을 매칭률 내림차순 최대 10건 반환한다.
    동일 사용자·동일 필터 조합에 대해 6시간 Redis 캐싱으로 외부 AI API 호출 비용을 절감한다.
    각 카드 응답에는 매칭률(%) + 모집글 메타(제목/설명/기숙사/방 유형/흡연 여부/현재 그룹 인원수/생성시간)가 포함된다.
  user_story: >
    As a 체크리스트·선호도 등록 완료 사용자, I want to 나와 매칭률이 높은 모집글을 정렬된 카드 형태로 보고,
    so that AI가 추천한 룸메이트 후보 모집글을 빠르게 검토하고 지원 여부를 판단할 수 있다.
  goals:
    - 요청자와 모집글 작성자들의 체크리스트/선호도를 1회 batch 호출로 비교
    - 매칭률 내림차순 최대 10건 반환 (AI top_k=10)
    - 동일 성별 / 동일 캠퍼스 / 동일 기숙사 후보 한정 (요청자 User 엔티티에서 자동 도출, 클라이언트가 제어 불가)
    - roomSize 하드 필터는 클라이언트 선택값으로 SQL에서 사전 적용 (옵셔널)
    - 본인 글, CLOSED 글, deleted=true 글 제외
    - 양측(요청자 + 후보) 모두 체크리스트·선호도 등록 완료 상태에서만 매칭 대상으로 포함
    - 동일 (userId, roomSize) 키로 6시간 Redis 캐싱 (gender/campus/dormitory 는 userId 에 종속이므로 키에서 제외)
    - 카드에 현재 그룹 인원수(분자) + 그룹 총 정원(분모, RoomSize 기반: 2/3/4)을 함께 제공해 화면의 "1/2" 표기 지원

# ============================================================
# 외부 의존성 (AI 분석 API — Batch 모드)
# ============================================================
external_dependencies:
  ai_match_batch_api:
    base_url: "http://ceprj.gachon.ac.kr:60007 (재사용 — application.yml ai.match-api.base-url)"
    endpoint: POST /match-detail-batch
    swagger: "http://ceprj.gachon.ac.kr:60007/docs"
    request_content_type: application/json
    request_body_shape:
      user: "RawProfile (요청자) — FEAT-011과 동일 구조"
      candidates: "List<RawProfile> — 모집글 작성자들. candidates[i] 가 응답의 candidateIndex=i 로 매핑됨."
      top_k: "Integer — 본 기능에서는 10 고정"
    response_shape:
      ranked: "List<RankedItem> — 매칭률 내림차순 정렬"
      ranked_item:
        rank: "1부터 시작하는 순위"
        candidateIndex: "요청 candidates 배열 원본 인덱스 (필수 매핑 키)"
        matchRate: "Integer 0~100 — logit 보정"
        counts: "{ matched, mismatched, total } — total은 항상 8"
        matchedFeatures: "List<{ key, label, description }>"
        mismatchedFeatures: "List<{ key, label, description, advice }>"
        conversationStarters: "List<{ key, starter, subtitle }>"
        topInfluentialFeatures: "List<String>"
        summaryComment: "{ brief, positive, caution }"
      note: >
        본 기능은 카드 목록 용도이므로 matchedFeatures/mismatchedFeatures/conversationStarters/
        topInfluentialFeatures/summaryComment 는 응답에서 모두 무시. matchRate + candidateIndex 만 사용.
    timeout:
      connect: 3s
      read: 10s
      note: >
        후보 수 N에 따라 처리 시간이 비례 증가. /match-detail 보다 read 타임아웃을 길게 설정.
        초과 시 502 AI_SERVICE_UNAVAILABLE.
    candidate_size_policy:
      v1: "하드 필터 통과 + 양측 등록 조건 만족 후보 전체 전송 (상한 없음)"
      future: "후보 수가 N>=100 수준으로 증가 시 createdAt DESC top-K(예: 100)로 사전 컷오프 도입 검토"

# ============================================================
# API 명세
# ============================================================
technical_spec:
  api:
    - method: GET
      path: /api/v1/posts/recommended
      summary: AI 매칭률 기반 룸메이트 모집글 추천 목록 조회 (최대 10건)
      auth: MEMBER (Bearer Token, 필수)
      request:
        query_params:
          - name: roomSize
            type: String (Enum)
            required: false
            values: "TWO_PERSON | THREE_PERSON | FOUR_PERSON"
            note: "미전달 시 전체 방 유형. 캐시 키 구성 요소."
        dto: "(없음)"
        fields: []
        note: >
          campus 쿼리 파라미터는 본 API에서 받지 않음 — 요청자 User.campus 로 자동 한정.
          gender / dormitory 도 클라이언트가 제어할 수 없으며 요청자 User 에서 도출.
      response:
        dto: AiRecommendedPostResponse (List)
        http_status: 200 OK
        wrapper: CommonResponse<List<AiRecommendedPostResponse>>
        response_code: PostResponseCode.AI_RECOMMENDED_POST_LIST_FOUND
        fields:
          - name: postId
            type: Long
            note: "원본 모집글 ID — 카드 클릭 시 상세 조회용"
          - name: title
            type: String
            note: "모집글 제목"
          - name: description
            type: String
            note: "모집글 본문 (클라이언트에서 말줄임 처리)"
          - name: dormitory
            type: String (Enum)
            note: "모집글 작성 시점 스냅샷 (FEAT-007 정책)"
          - name: roomSize
            type: String (Enum)
            note: "TWO_PERSON | THREE_PERSON | FOUR_PERSON"
          - name: smoking
            type: String (Enum)
            note: "작성자(LifestyleChecklist.smoking) 값. NON_SMOKER | CIGARETTE | ELECTRONIC_CIGARETTE. UI '비흡연/흡연' 표기는 프론트가 매핑."
          - name: currentMemberCount
            type: Integer
            note: "해당 모집글의 룸메이트 그룹에 현재 등록된 활성(deleted=false) 멤버 수 (LEADER + MEMBER 모두 포함). UI '1/2' 표기의 분자."
          - name: totalMemberCount
            type: Integer
            note: "RoomSize 에서 도출된 그룹 총 정원 (TWO_PERSON=2, THREE_PERSON=3, FOUR_PERSON=4). UI '1/2' 표기의 분모."
          - name: matchRate
            type: Integer
            note: "AI 응답의 ranked[i].matchRate 그대로 (0~100, logit 보정)"
          - name: createdAt
            type: LocalDateTime
            note: "모집글 작성 시각. 클라이언트에서 '3분 전' 등 상대 시간 변환."

  filtering_logic:
    hard_filter_sql:
      - "status = OPEN"
      - "deleted = false"
      - "post.user_id != requester.id  (본인 글 제외)"
      - "post.user.gender = requester.gender  (동일 성별, 요청자에서 도출)"
      - "post.user.campus = requester.campus  (동일 캠퍼스, 요청자에서 도출)"
      - "post.dormitory = requester.dormitory  (동일 기숙사, 모집글 스냅샷 기준)"
      - "roomSize 파라미터 → roomSize = ? (미전달 시 무필터)"
      - "정렬: SQL 단계는 createdAt DESC (후보 풀 안정성 목적). 최종 정렬은 AI matchRate."
      - "주의: gender/campus/dormitory 는 클라이언트가 변조할 수 없도록 항상 서버가 요청자 User 엔티티에서 추출. 쿼리 파라미터 미수용."
    eligibility_filter_in_app:
      - "후보 작성자가 LifestyleChecklist 미등록이면 후보에서 제외"
      - "후보 작성자가 RoommatePreference 미등록이면 후보에서 제외"
      - "후보 작성자의 LifestyleChecklistSleepHabit 은 deleted=false 만 포함"
    ai_request:
      - "user: 요청자 RawProfile"
      - "candidates: 후보 전체 (eligibility 통과분), 원본 인덱스 유지"
      - "top_k: 10"
    post_processing:
      - "AI 응답 ranked[].candidateIndex 로 원본 후보 모집글 매핑"
      - "ranked[i].matchRate + 카드 메타(title/description/dormitory/roomSize/smoking/currentMemberCount/totalMemberCount/createdAt) 결합"
      - "totalMemberCount = post.roomSize.getTotalMemberCount() (RoomSize enum 의 메서드, Tell-Don't-Ask)"
      - "matchRate 순(=rank ASC) 그대로 응답 (외부 재정렬 X)"

  data_flow:
    - step: 1
      layer: Presentation (RoommatePostController)
      action: "@CurrentMemberId로 JWT userId 추출, roomSize query param 수신 후 AiRecommendedPostUseCase.getRecommended(userId, roomSize) 호출"
    - step: 2
      layer: UseCase (AiRecommendedPostUseCase)
      action: >
        AiRecommendedPostCachePort.find(userId, roomSize) → Optional<List<AiRecommendedPostResponse>>.
        캐시 HIT 시 즉시 반환 (외부 AI 호출/DB 조회 모두 생략).
      transaction: 없음 (cache I/O는 트랜잭션 외부)
    - step: 3
      layer: Application Loader (RecommendedPostsDataLoader)
      action: >
        캐시 MISS 시 단일 @Transactional(readOnly = true) 경계 안에서:
          1) UserGetService.getById(userId) — 실패 시 USER_NOT_FOUND. 요청자 User 의 gender/campus/dormitory 가
             이후 SQL 필터에 그대로 사용됨 (체크리스트 등록 완료 → 온보딩 완료가 선행 보장되므로 모두 non-null).
          2) 요청자 LifestyleChecklist + SleepHabits 조회 — 미등록 시 CHECKLIST_NOT_REGISTERED
          3) 요청자 RoommatePreference 조회 — 미등록 시 PREFERENCE_NOT_REGISTERED
          4) RoommatePostGetService.getRecommendationCandidates(requester, roomSize)
             → List<RoommatePost> with fetch join (post.user). 내부 QueryDSL 이 gender/campus/dormitory
             하드 필터를 적용.
          5) 후보 user_id 집합으로 ChecklistGetService.getChecklistBundlesByUserIds(authorUserIds)
             → Map<Long, ChecklistBundle>
          6) 후보 user_id 집합으로 RoommatePreferenceGetService.getByUserIdIn(authorUserIds)
             → Map<Long, RoommatePreference>
          7) 후보 post_id 집합으로 RoommateGroupMemberGetService.countActiveByPostIdIn(postIds)
             → Map<Long postId, Long count>
          8) 위 Map 들을 기반으로 eligibility(작성자 체크리스트+선호도 존재) 통과 후보만 추려
             RecommendedPostsBundle(requesterProfile, List<CandidateEntry>) 반환
        loadBundle() 반환과 동시에 트랜잭션 종료 — 외부 AI 호출 전 DB 커넥션 반환.
      transaction: true (readOnly)
    - step: 4
      layer: UseCase (AiRecommendedPostUseCase)
      action: >
        eligibility 통과 후보가 0건이면 빈 리스트 반환 (캐시에 빈 리스트도 저장).
        그 외에는 MatchBatchCommand(requesterProfile, candidateProfiles, topK=10) 조립.
    - step: 5
      layer: Domain Port (MatchBatchAnalysisPort) → External Adapter (AiMatchBatchClient)
      action: >
        matchBatchAnalysisPort.analyze(command) 호출 — DB 트랜잭션 밖.
        어댑터가 내부에서 MatchAnalysisProfile → AiMatchUserPayload 변환,
        POST /match-detail-batch (top_k=10) 호출, AiMatchBatchResponse → MatchBatchResult 변환.
        connect 3s / read 10s. 응답 2xx 아니거나 타임아웃 시 AI_SERVICE_UNAVAILABLE.
    - step: 6
      layer: UseCase (AiRecommendedPostUseCase)
      action: >
        result.ranked() 순회 — candidateIndex 로 원본 CandidateEntry 매핑 →
        AiRecommendedPostResponse.from(post, smoking, currentMemberCount, matchRate) 변환.
        결과 순서는 AI rank 순(매칭률 내림차순) 유지.
    - step: 7
      layer: UseCase (AiRecommendedPostUseCase)
      action: "AiRecommendedPostCachePort.save(userId, roomSize, responses, ttl=6h) 저장 후 반환"
    - step: 8
      layer: Response
      action: "200 OK, CommonResponse<List<AiRecommendedPostResponse>> 반환"

  caching:
    enabled: true
    store: Redis
    ttl: "6h (PT6H)"
    key_pattern: "ai-recommended:user:{userId}:roomSize:{roomSize|ALL}"
    key_design_note: >
      gender/campus/dormitory 는 userId 에 종속(요청자 User 엔티티에서 도출)이므로 키에서 제외.
      사용자가 프로필을 수정해 dormitory/campus/gender 가 바뀌어도 TTL 만료까지는 이전 데이터의
      stale 캐시가 반환될 수 있음 — 수용 가능한 트레이드오프(요구사항 확정).
    value: "Jackson 직렬화된 List<AiRecommendedPostResponse>"
    invalidation:
      policy: "TTL 만료 외 무효화 없음 (요구사항 확정)"
      stale_window: >
        최대 6시간 stale 허용. 6시간 이내에 후보 작성자가 체크리스트/선호도/모집글을 변경해도
        요청자에게는 캐시된 결과 반환. 모집글 마감/삭제로 인한 stale 카드 노출 가능성 존재 —
        프론트에서 카드 클릭 후 상세 조회 단계에서 POST_NOT_FOUND 처리.
    empty_result_cache:
      rule: "eligibility 통과 후보 0건 시에도 빈 리스트를 동일 키로 6h 캐싱"
      reason: "후보가 없는 사용자의 반복 요청에 대해 DB 풀 스캔 방지"
    fail_open:
      rule: "캐시 조회/저장 실패(Redis 장애)는 로깅 후 무시하고 정상 흐름 진행"
      reason: "캐시는 비용 절감 수단이지 정확성에 영향 주지 않음"

  error_codes:
    domain_range: "407xx (Post 도메인) — 신규 코드는 check_error_codes.py 실행 후 확정"
    codes:
      - code: 40709
        name: CHECKLIST_NOT_REGISTERED
        status: 409 CONFLICT
        message: "AI 추천을 받으려면 생활습관 체크리스트 등록이 필요합니다."
        trigger: "요청자 본인의 LifestyleChecklist 미등록"
        note: "FEAT-011과 동일 코드 재사용. 본 기능은 요청자 본인 미등록만 검사 (후보 미등록은 eligibility 필터로 제외)."
      - code: 40710
        name: PREFERENCE_NOT_REGISTERED
        status: 409 CONFLICT
        message: "AI 추천을 받으려면 룸메이트 선호도 등록이 필요합니다."
        trigger: "요청자 본인의 RoommatePreference 미등록"
        note: "FEAT-011과 동일 코드 재사용."
      - code: 40711
        name: AI_SERVICE_UNAVAILABLE
        status: 502 BAD_GATEWAY
        message: "AI 매칭 분석 서비스에 일시적으로 접근할 수 없습니다. 잠시 후 다시 시도해주세요."
        trigger: "외부 AI batch API 타임아웃 / 5xx 응답 / 네트워크 오류 / 응답 body null"
        note: "FEAT-011과 동일 코드 재사용."
      - code: 40203
        name: USER_NOT_FOUND
        status: 404 NOT_FOUND
        message: "사용자를 찾을 수 없습니다."
        trigger: "JWT userId로 User 조회 실패 시"
        note: "User 도메인(402xx) 공용 코드"

  validation_rules:
    - "roomSize 값이 유효하지 않으면 400 BAD_REQUEST"
    - "요청자 본인 LifestyleChecklist 미등록 → 409 CHECKLIST_NOT_REGISTERED"
    - "요청자 본인 RoommatePreference 미등록 → 409 PREFERENCE_NOT_REGISTERED"
    - "후보 작성자 체크리스트/선호도 미등록은 에러 아님 → 단순히 후보에서 제외"
    - "본인이 작성한 모집글은 후보에서 제외 (SQL 단계)"
    - "요청자와 성별이 다른 작성자의 모집글은 후보에서 제외 (SQL 단계)"
    - "요청자와 캠퍼스가 다른 작성자의 모집글은 후보에서 제외 (SQL 단계)"
    - "요청자와 기숙사가 다른 모집글은 후보에서 제외 (SQL 단계, post.dormitory 스냅샷 기준)"
    - "status != OPEN 또는 deleted=true 모집글은 후보에서 제외 (SQL 단계)"
    - "요청자 User 의 gender/campus/dormitory 가 null 인 경우는 발생하지 않음 — 체크리스트 등록 완료 전제는 온보딩 완료를 함의 (불변)"
    - "eligibility 통과 후보 0건이면 빈 배열 200 OK 반환 (에러 아님, 캐시 저장됨)"
    - "AI API 호출 실패(타임아웃·5xx·null body)는 AI_SERVICE_UNAVAILABLE로 표준화하여 502 응답 (캐시 저장 안 함)"
    - "응답 결과는 AI rank ASC (matchRate DESC) 순서 유지 — 백엔드에서 재정렬 금지"
    - "응답은 최대 10건 (AI top_k=10). eligibility 통과 후보가 10건 미만이면 그만큼만 반환"

# ============================================================
# 설정 (application.yml)
# ============================================================
configuration:
  application_yml:
    ai:
      match-api:
        base-url: "http://ceprj.gachon.ac.kr:60007 (기존 재사용)"
        connect-timeout: 3000
        read-timeout-batch: 10000   # ms — batch 전용 (단건 5000ms와 분리)
        recommended-top-k: 10
        recommended-cache-ttl: 21600  # seconds (6h)
  binding_class:
    name: AiMatchApiProperties
    annotation: "@ConfigurationProperties(prefix = \"ai.match-api\")"
    fields_to_add:
      - readTimeoutBatch: int (ms)
      - recommendedTopK: int (default 10)
      - recommendedCacheTtl: long (seconds, default 21600)
  redis:
    requirement: "spring-boot-starter-data-redis 의존성 (기존 도입 여부 확인 필요)"
    serializer: "StringRedisSerializer (key) + GenericJackson2JsonRedisSerializer (value) — LocalDateTime 처리를 위해 JavaTimeModule 등록된 ObjectMapper 주입"

# ============================================================
# 구성 요소
# ============================================================
components:
  MatchBatchAnalysisPort:
    package: "domain.post.domain.port.match"
    type: "Domain Interface (Port)"
    method: "MatchBatchResult analyze(MatchBatchCommand command)"
    note: "FEAT-011의 MatchAnalysisPort와 분리. 단건/배치 호출 시그니처가 다르므로 별도 포트."

  MatchBatchCommand:
    package: "domain.post.domain.port.match"
    type: "Domain Value Object (record)"
    fields:
      - requester: MatchAnalysisProfile          # FEAT-011 재사용
      - candidates: List<MatchAnalysisProfile>   # 원본 인덱스 순서 보존
      - topK: int
    note: "candidates 의 인덱스가 AI 응답의 candidateIndex 와 1:1 매핑되어야 함."

  MatchBatchResult:
    package: "domain.post.domain.port.match"
    type: "Domain Value Object (record)"
    fields:
      - ranked: List<RankedMatch>
    note: "단건 응답의 부가 필드(matchedFeatures 등)는 본 기능 미사용 — 포트 출력에서 제외하여 어댑터 변환 비용 절감."

  RankedMatch:
    package: "domain.post.domain.port.match"
    type: "Domain Value Object (record)"
    fields:
      - rank: int
      - candidateIndex: int
      - matchRate: int
    note: "카드 응답에 필요한 최소 필드만 보존."

  AiMatchBatchClient:
    package: "domain.post.external.aimatch"
    type: "External Adapter (implements MatchBatchAnalysisPort)"
    impl: "Spring RestClient (블로킹) — 기존 AiMatchClient와 동일 RestClient 빈 공유 또는 batch 전용 빈 분리"
    rationale: >
      /match-detail-batch 는 후보 N개를 한 번에 처리하므로 read timeout 을 단건 호출(5s)보다 길게(10s) 설정.
      RestClient 인스턴스를 분리하거나 호출 시점에 .httpRequest(req -> req.setReadTimeout(...)) 로 오버라이드.
    responsibility: >
      - MatchAnalysisProfile → AiMatchUserPayload 변환 (FEAT-011의 변환 헬퍼 재사용)
      - POST /match-detail-batch (body: {user, candidates, top_k}) 호출
      - AiMatchBatchResponse → MatchBatchResult(rank, candidateIndex, matchRate 만) 변환
    error_handling:
      - "타임아웃 / RestClientException → AiServiceUnavailableException"
      - "응답 코드 != 2xx → AiServiceUnavailableException"
      - "응답 body null 또는 ranked=null → AiServiceUnavailableException"
    logging_policy:
      request_body:
        rule: "모든 환경에서 body 내용 로깅 금지 — method + URI + 후보 개수 + body 바이트 길이만 기록"
        reason: "FEAT-011과 동일 PII 보호 정책 (gender/sleep_habits/smoking 등 민감정보 포함)"
      error_response:
        rule: "응답 body 절대 로깅 금지 — status 코드만 기록"
        reason: "AI 서버가 4xx 응답 시 요청 데이터 echo back 가능성"
    note: >
      AiMatchBatchRequest/Response/RankedItem 은 본 어댑터 내부 구현 디테일(external.aimatch.dto).
      UseCase 및 다른 계층은 이들 DTO에 의존하지 않음.
      AiMatchUserPayload, AiMatchUserPayload.of() 헬퍼는 FEAT-011 구현체 재사용.

  AiMatchBatchRequest:
    package: "domain.post.external.aimatch.dto"
    type: "record"
    fields:
      - user: AiMatchUserPayload
      - candidates: List<AiMatchUserPayload>
      - top_k: int    # @JsonProperty("top_k")
    note: "Jackson SnakeCaseStrategy 또는 @JsonProperty 로 snake_case 직렬화."

  AiMatchBatchResponse:
    package: "domain.post.external.aimatch.dto"
    type: "record"
    fields:
      - ranked: List<AiRankedItem>
    annotation: "@JsonIgnoreProperties(ignoreUnknown = true) — 스키마 확장 대비"

  AiRankedItem:
    package: "domain.post.external.aimatch.dto"
    type: "record"
    fields:
      - rank: int
      - candidateIndex: int    # @JsonProperty("candidateIndex")
      - matchRate: int         # @JsonProperty("matchRate")
    annotation: "@JsonIgnoreProperties(ignoreUnknown = true) — matchedFeatures 등 미사용 필드 무시"

  AiRecommendedPostCachePort:
    package: "domain.post.domain.port.cache"
    type: "Domain Interface (Port)"
    methods:
      - "Optional<List<AiRecommendedPostResponse>> find(Long userId, Campus campus, RoomSize roomSize)"
      - "void save(Long userId, Campus campus, RoomSize roomSize, List<AiRecommendedPostResponse> value, Duration ttl)"
    note: >
      Application DTO 를 캐시값 타입으로 노출 — 응답 직렬화 비용을 캐시 단계에서 일회 지불.
      구현체는 infrastructure 레이어 (Redis는 우리가 통제하는 시스템 → infrastructure/).

  RedisAiRecommendedPostCacheAdapter:
    package: "infrastructure.cache.airecommended"
    type: "implements AiRecommendedPostCachePort"
    impl: "RedisTemplate<String, Object> 또는 StringRedisTemplate + ObjectMapper"
    key_builder: >
      "ai-recommended:user:" + userId
       + ":roomSize:" + (roomSize == null ? "ALL" : roomSize.name())
    value_serializer: "GenericJackson2JsonRedisSerializer (JavaTimeModule 등록 ObjectMapper)"
    fail_open:
      - "find() 실패 시 Optional.empty() 반환 + WARN 로깅"
      - "save() 실패 시 무시 + WARN 로깅"

  RecommendedPostsDataLoader:
    package: "domain.post.application.loader"
    type: "Application Helper (@Component)"
    method: "RecommendedPostsBundle loadBundle(Long userId, RoomSize roomSize)"
    transaction: "@Transactional(readOnly = true) — 메서드 레벨"
    dependencies:
      - UserGetService
      - ChecklistGetService
      - RoommatePreferenceGetService
      - RoommatePostGetService                # findRecommendationCandidates 위임
      - RoommateGroupMemberGetService         # countActiveByPostIdIn
    rationale: >
      FEAT-011과 동일하게 외부 AI 호출 동안 DB 커넥션 점유 회피.
      별도 빈으로 분리해야 Spring AOP @Transactional 적용됨.
      요청자 User 엔티티를 그대로 RoommatePostGetService 에 전달 →
      gender/campus/dormitory 하드 필터를 도메인 서비스/리포지토리 안에서 일괄 적용
      (rules: Signature → Pass WHOLE OBJECTS).

  RecommendedPostsBundle:
    package: "domain.post.application.loader"
    type: "record (application 내부 값 객체)"
    fields:
      - requesterProfile: MatchAnalysisProfile
      - candidates: List<CandidateEntry>
    note: "loadBundle() 반환 단위. 외부 노출 없음."

  CandidateEntry:
    package: "domain.post.application.loader"
    type: "record"
    fields:
      - post: RoommatePost
      - profile: MatchAnalysisProfile          # post.user + 작성자 체크리스트 + 선호도
      - currentMemberCount: int                # 해당 모집글 그룹의 활성 멤버 수
    note: "AI 요청 인덱스 = candidates 리스트 인덱스. 응답 매핑 키."

  AiRecommendedPostUseCase:
    package: "domain.post.application.usecase"
    dependencies:
      - AiRecommendedPostCachePort            # 캐시 우선 조회/저장
      - RecommendedPostsDataLoader            # DB 조회 (트랜잭션 경계)
      - MatchBatchAnalysisPort                # 외부 AI 호출 (트랜잭션 밖)
      - AiMatchApiProperties                  # topK, cacheTtl 주입
    transaction: "없음 (DB I/O는 DataLoader 내부, 캐시·AI는 트랜잭션 외부)"
    flow:
      - "cache.find → HIT 즉시 반환"
      - "loader.loadBundle → 요청자 검증 + 후보 수집"
      - "후보 0건 → 빈 리스트 캐시 저장 후 반환"
      - "matchBatchAnalysisPort.analyze → ranked 수신"
      - "ranked → AiRecommendedPostResponse 매핑 (candidateIndex 로 CandidateEntry 결합)"
      - "cache.save (TTL 6h) 후 반환"

