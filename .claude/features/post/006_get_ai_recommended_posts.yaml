# ============================================================
# 캐시 동작 시나리오
# ============================================================
cache_scenarios:
  hit_path:
    - "동일 (userId, roomSize) 로 6시간 내 재요청 → Redis HIT → AI 호출/DB 조회 모두 생략"
    - "캐시값에 LocalDateTime 포함되어도 GenericJackson2JsonRedisSerializer + JavaTimeModule 으로 정상 역직렬화"
  miss_path:
    - "최초 요청 / TTL 만료 / 다른 roomSize 조합 → MISS → 전체 흐름 실행 후 저장"
  fail_open:
    - "Redis 다운 상태에서 find() 예외 → WARN 로깅 후 MISS 처리 (정상 흐름 진행)"
    - "save() 예외 → WARN 로깅 후 응답 정상 반환 (사용자 영향 없음)"
  empty_result:
    - "eligibility 통과 후보 0건 → 빈 리스트도 6h 캐시 저장 (반복 요청 보호)"
  no_negative_cache_on_ai_failure:
    - "AI_SERVICE_UNAVAILABLE 발생 시 캐시 저장 금지 → 다음 요청에서 재시도 가능"

# ============================================================
# 테스트 전략
# ============================================================
testing_strategy:
  happy_path:
    - "캐시 MISS + 동일 성별/캠퍼스/기숙사 후보 5명(모두 등록 완료) → AI 호출 1회 → ranked 5건 매칭률 내림차순 반환, Redis 저장 확인"
    - "캐시 HIT → AI 호출 0회, DB 조회 0회, 캐시값 그대로 반환"
    - "roomSize=TWO_PERSON 필터 → 후보 SQL 필터링 후 AI 호출, 응답 캐시 키에 roomSize 반영"
    - "AI top_k=10 응답 → AiRecommendedPostResponse 최대 10건 (matchRate DESC) 반환"
    - "smoking 필드가 작성자 LifestyleChecklist.smoking ENUM 값으로 매핑됨"
    - "currentMemberCount 가 해당 post.group 의 활성 멤버 수(LEADER 포함) 와 일치"
    - "응답 순서가 AI rank ASC 그대로 유지되고 백엔드 재정렬 없음"
    - "요청자 User 가 RoommatePostGetService.getRecommendationCandidates 에 그대로 전달됨 (gender/campus/dormitory 클라이언트 변조 불가)"
  edge_cases:
    - "후보 0건 (동일 성별/캠퍼스/기숙사 후보가 없거나 필터 통과 모집글 없음) → 200 OK 빈 배열, 빈 리스트도 캐시 저장"
    - "후보 작성자 중 일부 체크리스트 미등록 → 해당 후보만 제외하고 나머지로 AI 호출"
    - "후보 작성자 중 일부 선호도 미등록 → 해당 후보만 제외"
    - "본인 글은 후보에서 제외됨 (SQL 단계 확인)"
    - "성별 다른 작성자의 글은 후보에서 제외됨 (SQL 단계 확인)"
    - "캠퍼스 다른 작성자의 글은 후보에서 제외됨 (SQL 단계 확인)"
    - "기숙사 다른 모집글은 후보에서 제외됨 (post.dormitory 스냅샷 기준, SQL 단계 확인)"
    - "CLOSED 글, deleted=true 글은 후보에서 제외됨"
    - "요청자 체크리스트 미등록 → 409 CHECKLIST_NOT_REGISTERED (캐시 저장 안 함)"
    - "요청자 선호도 미등록 → 409 PREFERENCE_NOT_REGISTERED (캐시 저장 안 함)"
    - "AI batch API 타임아웃 → 502 AI_SERVICE_UNAVAILABLE (캐시 저장 안 함, 다음 요청 재시도 가능)"
    - "AI batch API 5xx → 502 AI_SERVICE_UNAVAILABLE"
    - "AI 응답 ranked=null → 502 AI_SERVICE_UNAVAILABLE"
    - "Redis 다운 (find/save 예외) → 캐시 무시하고 정상 흐름 진행, 200 OK 반환"
    - "JWT 변조 userId → 404 USER_NOT_FOUND"
    - "roomSize 잘못된 enum 값 → 400 BAD_REQUEST"
  integration:
    - "AiMatchBatchClient: MockWebServer 로 /match-detail-batch 응답 모킹 + read timeout 10s 적용 확인"
    - "RedisAiRecommendedPostCacheAdapter: Embedded Redis 또는 Testcontainers Redis 로 TTL 6h 저장/조회/만료 확인"
    - "RecommendedPostsDataLoader: 후보 1000건 일괄 조회 시 N+1 미발생 (총 9 쿼리) 검증"
  serialization_regression:
    - "AiMatchBatchResponse.matchedFeatures 등 미사용 필드가 응답에 포함되어도 @JsonIgnoreProperties(ignoreUnknown=true) 로 안전하게 무시됨 (FEAT-011 회귀 사례 방지)"
    - "AiRecommendedPostResponse.createdAt 이 Redis 캐시 왕복 후에도 LocalDateTime 으로 정확히 복원됨"

# ============================================================
# 주의사항
# ============================================================
notes:
  - >
    [아키텍처] UseCase는 외부 어댑터(AiMatchBatchClient)와 Redis 어댑터에 직접 의존하지 않고
    각각 MatchBatchAnalysisPort, AiRecommendedPostCachePort 에만 의존.
    "NO Layer Skipping" 규칙 준수.
  - >
    [패키지 분류] AiMatchBatchClient 는 통제 불가능한 제3자 AI 서버 연동 → external/.
    Redis 어댑터는 우리가 통제하는 시스템 → infrastructure/cache/.
  - >
    [트랜잭션 경계] DB 조회는 RecommendedPostsDataLoader 의 @Transactional(readOnly=true) 안에서만 수행.
    Redis 조회/저장, 외부 AI batch 호출은 모두 트랜잭션 밖.
    외부 API 지연(최대 10s) 동안 DB 커넥션 점유 회피.
  - >
    [PII 보호] FEAT-011과 동일 정책 — AI batch 요청 body 로깅 금지 (메서드/URI/후보 개수/바이트 길이만),
    에러 응답 body 로깅 금지 (status 코드만). 환경 토글로 가변화하지 않음.
  - >
    [캐시 정확성 vs 비용] 6h TTL 동안 모집글이 마감/삭제되어도 캐시 결과에 stale 카드 포함될 수 있음.
    프론트는 카드 클릭 후 GET /api/v1/posts/{postId} 단계에서 POST_NOT_FOUND 처리.
    이는 비용 절감을 위한 명시적 트레이드오프 — 요구사항 확정.
  - >
    [후보 수 상한] v1 미도입. 후보 수 증가 시 AI batch 호출 비용/응답 시간 비례 상승 →
    실서비스 모니터링 후 createdAt DESC top-N 컷오프 도입 검토.
  - >
    [응답 정렬] AI rank ASC = matchRate DESC 순서를 그대로 유지. 백엔드/프론트 재정렬 금지.
    동률 처리는 AI 모델 책임.
  - >
    [currentMemberCount vs totalMemberCount] 응답은 두 필드를 분리 제공.
    currentMemberCount = 현재 활성 그룹 멤버 수(LEADER+MEMBER, deleted=false).
    totalMemberCount = RoomSize 기반 그룹 총 정원 (TWO=2 / THREE=3 / FOUR=4) — RoomSize.getTotalMemberCount() 도출.
    UI "1/2" 표기는 currentMemberCount / totalMemberCount 형태로 사용.
    모집글의 recruitMemberCount(작성자가 지정한 모집 인원수)는 본 API 응답에 노출하지 않음 —
    "총 정원" 정보가 화면 요구사항이고, RoomSize 가 그 단일 진실 원천이므로 derived 값 한 곳으로 정규화.
  - >
    [흡연 표기] smoking 은 LifestyleChecklist.smoking ENUM 그대로 반환 (NON_SMOKER | CIGARETTE | ELECTRONIC_CIGARETTE).
    UI 텍스트("비흡연" 등) 매핑은 프론트.
  - >
    [캐시 키 설계] 사용자 단위 키 → 다른 사용자에게 누설 위험 없음. roomSize 미전달은 "ALL" 토큰으로 정규화하여
    null 직렬화 불일치 방지. gender/campus/dormitory 는 userId 종속이므로 키에서 제외.
  - >
    [하드 필터 보안] gender/campus/dormitory 는 클라이언트가 전달한 값을 사용하지 않고 항상 서버가 요청자 User
    엔티티에서 추출. JWT 만으로 식별되는 요청자의 본인 데이터를 사용하므로 변조 불가.
    AI 추천 노출 범위(같은 성별·캠퍼스·기숙사) 정책이 모든 요청에서 일관 적용됨.
  - >
    [전제] 요청자가 체크리스트·선호도 등록을 완료했다면 온보딩(gender/campus/dormitory 설정)도
    선행 완료된 상태(User.completeOnboarding → completeChecklistRegistration 순서 보장).
    따라서 요청자 User 의 세 필드는 non-null 로 가정하고 NPE 방어 코드를 추가하지 않음.
  - >
    [재사용 컴포넌트] MatchAnalysisProfile, AiMatchUserPayload, AiMatchApiProperties 의 일부는 FEAT-011 자산 재사용.
    FEAT-011 변경 시 본 기능도 함께 검증 필요 (특히 RawProfile snake_case 직렬화 규약).
  - >
    [에러 코드 재사용] CHECKLIST_NOT_REGISTERED / PREFERENCE_NOT_REGISTERED / AI_SERVICE_UNAVAILABLE 은 FEAT-011 코드 재사용.
    AI_RECOMMENDED_POST_LIST_FOUND (200 응답 코드) 만 신규 — check_error_codes.py 충돌 확인.
  - >
    [Redis 의존성] 프로젝트에 spring-boot-starter-data-redis 미도입 상태일 수 있음. 도입 여부와 클러스터/단일 노드 구성,
    프로파일별 호스트 분리 정책을 별도 확인 후 application.yml 반영.
