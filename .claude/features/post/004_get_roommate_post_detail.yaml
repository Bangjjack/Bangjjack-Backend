# Feature Specification: 룸메이트 모집글 단건 조회
# Status: Draft
# Last Updated: 2026-05-24 (Domain Service의 Application DTO 반환 제거, ChecklistBundle 도입으로 레이어 의존 정상화)

meta:
  id: FEAT-010
  title: 룸메이트 모집글 단건 조회
  type: Feature
  author: xEzIxX

overview:
  summary: >
    인증된 사용자가 postId로 특정 룸메이트 모집글의 상세 정보를 조회한다.
    삭제된 모집글(deleted=true)은 조회할 수 없다.
    응답에는 모집글 정보(제목, 설명, 방 유형, 모집 인원, 상태, 학기, 기숙사),
    작성자 기본 정보(id, username, profileImage), 공동 생활습관 6개 항목,
    요청자가 해당 모집글의 작성자인지 여부(isOwner),
    그리고 해당 모집글에 연결된 룸메이트 그룹의 활성 멤버 목록(LEADER + 모든 MEMBER)이 포함된다.
    각 멤버는 userId, username, profileImage, role(LEADER|MEMBER)과 함께
    본인이 등록한 생활습관 체크리스트(9개 항목, sleepHabits 포함)를 제공한다.
    체크리스트를 등록하지 않은 멤버는 lifestyleChecklist=null로 반환한다.
    체크리스트의 각 항목은 { value, matched } 래퍼 구조로 반환되며,
    matched는 요청자(viewer) 본인의 체크리스트와 동일한지 여부(true/false)를 나타낸다.
    요청자가 본인 체크리스트를 등록하지 않은 경우 모든 항목의 matched=null로 반환한다.
  user_story: >
    As a 인증된 사용자, I want to 특정 룸메이트 모집글의 상세 내용을 조회하고,
    so that 지원 여부를 판단하거나 내 글인 경우 수정/삭제 버튼을 표시할 수 있고,
    현재까지 모집된 그룹 구성원(LEADER 포함)이 누구인지,
    각자의 생활습관(체크리스트)이 어떤지, 그리고 각 항목이 나와 일치하는지를 한눈에 확인할 수 있다.
  goals:
    - postId로 단건 모집글 상세 조회
    - 삭제된 모집글 조회 차단
    - 작성자 기본 정보 포함 응답
    - 공동 생활습관 6개 항목 포함 응답
    - 요청자 본인 작성 여부(isOwner) 반환
    - 연결된 룸메이트 그룹의 활성 멤버(LEADER + 모든 MEMBER) 목록 반환
    - 각 활성 멤버의 생활습관 체크리스트 9개 항목(sleepHabits 포함) 반환
    - 각 체크리스트 항목별 요청자(viewer) 본인 체크리스트와의 일치 여부(matched) 반환

# ============================================================
# API 명세
# ============================================================
technical_spec:
  api:
    - method: GET
      path: /api/v1/posts/{postId}
      summary: 룸메이트 모집글 단건 조회
      auth: MEMBER (Bearer Token, 필수)
      request:
        path_variable:
          - name: postId
            type: Long
            required: true
            note: "조회할 모집글 ID"
        dto: "(없음)"
        fields: []
      response:
        dto: RoommatePostDetailResponse
        http_status: 200 OK
        wrapper: CommonResponse<RoommatePostDetailResponse>
        response_code: PostResponseCode.POST_DETAIL_FOUND
        fields:
          - name: postId
            type: Long
          - name: title
            type: String
          - name: description
            type: String
          - name: roomSize
            type: String (Enum)
          - name: recruitMemberCount
            type: Integer
          - name: status
            type: String (Enum)
            note: "OPEN | CLOSED"
          - name: semester
            type: String (Enum)
            note: "작성 시점 스냅샷"
          - name: dormitory
            type: String (Enum)
            note: "작성 시점 스냅샷"
          - name: isOwner
            type: Boolean
            note: "요청자(JWT userId)와 모집글 작성자(post.user.id)가 동일하면 true"
          - name: createdAt
            type: LocalDateTime
          - name: author
            type: AuthorResponse (nested)
            fields:
              - name: authorId
                type: Long
              - name: username
                type: String
              - name: profileImage
                type: String
                note: "null 가능"
          - name: sharedLifestyle
            type: SharedLifestyleResponse (nested)
            fields:
              - name: roomTrashBinSharing
                type: Boolean
              - name: recycling
                type: String (Enum)
              - name: phoneCall
                type: String (Enum)
              - name: itemSharing
                type: String (Enum)
              - name: earphoneUsage
                type: Boolean
              - name: lightsOutTime
                type: String (Enum)
          - name: members
            type: List<RoommateMemberDetailResponse> (nested)
            note: "해당 모집글에 연결된 룸메이트 그룹의 활성(deleted=false) 멤버 전체. LEADER + 모든 MEMBER 포함. 빈 리스트가 될 수 있으나 정상 운영 흐름에서는 최소 LEADER 1건 포함됨(모집글 작성 시 LEADER 멤버십이 함께 INSERT됨). post 도메인 전용 DTO로 GroupMemberResponse 필드 + lifestyleChecklist 확장."
            fields:
              - name: userId
                type: Long
              - name: username
                type: String
              - name: profileImage
                type: String
                note: "null 가능"
              - name: role
                type: String (Enum)
                note: "LEADER | MEMBER"
              - name: lifestyleChecklist
                type: LifestyleChecklistResponse (nested)
                note: "해당 멤버 본인이 등록한 체크리스트. 미등록 멤버는 null. 각 항목은 ChecklistField<T> = { value, matched } 래퍼 구조."
                fields:
                  - name: bedtime
                    type: "ChecklistField<Bedtime>"
                    note: "value: BEFORE_22 | BETWEEN_22_24 | BETWEEN_24_2 | AFTER_2 | IRREGULAR. matched: viewer와 동일하면 true, 다르면 false, viewer 미등록 시 null."
                  - name: wakeUpTime
                    type: "ChecklistField<WakeUpTime>"
                    note: "value: BEFORE_6 | BETWEEN_6_8 | BETWEEN_8_10 | AFTER_10 | IRREGULAR. matched 규칙 동일."
                  - name: sleepHabits
                    type: "ChecklistField<List<SleepHabit>>"
                    note: "value: NONE | TOSS_AND_TURN | SNORING | TEETH_GRINDING | FREQUENT_WAKING 복수 가능. matched: viewer의 sleepHabits 집합과 완전 일치(set equality) 시 true."
                  - name: cleaningCycle
                    type: "ChecklistField<CleaningCycle>"
                    note: "value: ALMOST_DAILY | ONCE_OR_TWICE_A_WEEK | SOMETIMES | RARELY. matched 규칙 동일."
                  - name: dormStayTime
                    type: "ChecklistField<DormStayTime>"
                    note: "value: MOSTLY_OUTSIDE | HALF_AND_HALF | MOSTLY_INSIDE. matched 규칙 동일."
                  - name: callHabit
                    type: "ChecklistField<CallHabit>"
                    note: "value: INSIDE_OK | OUTSIDE_ONLY | WHISPER. matched 규칙 동일."
                  - name: indoorTemperature
                    type: "ChecklistField<IndoorTemperature>"
                    note: "value: SENSITIVE_TO_HEAT | SENSITIVE_TO_COLD | BOTH_SENSITIVE | INSENSITIVE. matched 규칙 동일."
                  - name: noiseSensitivity
                    type: "ChecklistField<NoiseSensitivity>"
                    note: "value: VERY_INSENSITIVE | SLIGHTLY_INSENSITIVE | NORMAL | SLIGHTLY_SENSITIVE | VERY_SENSITIVE. matched 규칙 동일."
                  - name: smoking
                    type: "ChecklistField<Smoking>"
                    note: "value: NON_SMOKER | CIGARETTE | ELECTRONIC_CIGARETTE. matched 규칙 동일."

  data_flow:
    - step: 1
      layer: Presentation (RoommatePostController)
      action: "@CurrentMemberId로 JWT에서 userId 추출, @PathVariable postId 수신 후 RoommatePostUseCase.getPostDetail(userId, postId) 호출"
    - step: 2
      layer: UseCase (RoommatePostUseCase)
      action: "RoommatePostGetService.getSharedLifestyleWithPostAndUserByPostId(postId)로 PostSharedLifestyle을 post + user fetch join으로 조회. 없거나 모집글이 deleted=true이면 POST_NOT_FOUND"
    - step: 3
      layer: UseCase (RoommatePostUseCase)
      action: "sharedLifestyle.getPost()로 RoommatePost 획득"
    - step: 4
      layer: UseCase (RoommatePostUseCase)
      action: "isOwner = post.getUser().getId().equals(userId) 계산"
    - step: 5
      layer: UseCase (RoommatePostUseCase)
      action: "RoommateGroupMemberGetService.getActiveMembersWithUserByPostId(postId) 호출 → 해당 모집글에 연결된 룸메이트 그룹의 활성 멤버 전체(LEADER + MEMBER)를 user fetch join으로 조회"
    - step: 6
      layer: UseCase (RoommatePostUseCase)
      action: "memberUserIds ∪ {viewerUserId}로 ChecklistGetService.getChecklistBundlesByUserIds(userIds) 호출 → Map<Long userId, ChecklistBundle> 반환. 내부에서 체크리스트 IN(1) + sleepHabits IN(1) 쿼리로 로드 후 사용자별로 묶어서 반환(순수 데이터 조회)."
    - step: 7
      layer: UseCase (RoommatePostUseCase)
      action: "viewerBundle = bundlesByUserId.get(viewerUserId) 추출 후, 멤버별 LifestyleChecklistResponse.from(memberBundle, viewerBundle)로 변환하여 Map<Long, LifestyleChecklistResponse> 조립. 멤버 bundle이 없으면 응답 맵에 포함하지 않음(미등록 멤버 표현)."
    - step: 8
      layer: UseCase (RoommatePostUseCase)
      action: "RoommatePostDetailResponse.from(post, sharedLifestyle, isOwner, isBookmarked, members, checklistByUserId, roommatePreference) 생성 후 반환 (members는 RoommateMemberDetailResponse.from(member, checklistByUserId.get(member.user.id))으로 매핑, 체크리스트 없으면 lifestyleChecklist=null)"
    - step: 9
      layer: Response
      action: "200 OK, CommonResponse<RoommatePostDetailResponse> 반환"

  response_dto_structure:
    RoommatePostDetailResponse:
      note: "static factory method from(RoommatePost, PostSharedLifestyle, boolean isOwner, List<RoommateGroupMember> members, Map<Long, LifestyleChecklist> checklistByUserId) 사용"
      nested:
        - AuthorResponse:
            note: "static factory method from(User) 사용"
            source: "post.getUser()"
        - SharedLifestyleResponse:
            note: "static factory method from(PostSharedLifestyle) 사용"
        - RoommateMemberDetailResponse (List):
            note: "post 도메인 신규 DTO. static factory method from(RoommateGroupMember, LifestyleChecklistResponse nullable) 사용. 필드: userId, username, profileImage, role, lifestyleChecklist(nullable). 기존 roommategroup.GroupMemberResponse 재사용 대신 신규 도입(체크리스트 결합으로 인한 도메인 간 DTO 오염 회피)"
            source: "RoommateGroupMemberGetService.getActiveMembersWithUserByPostId(postId) + UseCase에서 조립한 Map<Long, LifestyleChecklistResponse>"
        - LifestyleChecklistResponse:
            note: "checklist 도메인 신규 DTO. 각 9개 필드는 ChecklistField<T> = { value, matched } 래퍼. static factory method from(ChecklistBundle bundle, ChecklistBundle viewerBundle nullable) 사용. viewerBundle=null 이면 모든 matched=null, 아니면 viewer 값과 equals 비교(sleepHabits는 Set equality)."
        - ChecklistField:
            note: "checklist 도메인 신규 generic record { T value, Boolean matched }. matched는 nullable(viewer 미등록 시 null). of(T value, Boolean matched) 헬퍼 제공."
        - ChecklistBundle:
            note: "checklist 도메인 신규 record { LifestyleChecklist checklist, List<LifestyleChecklistSleepHabit> sleepHabits }. Domain Service가 Application DTO를 반환하지 않도록 분리한 도메인 값 객체(레이어 의존 역전 회피)."

  error_codes:
    domain_range: "407xx (Post 도메인)"
    codes:
      - code: 40704
        name: POST_NOT_FOUND
        status: 404 NOT_FOUND
        message: "모집글을 찾을 수 없습니다."
        trigger: "postId에 해당하는 모집글이 없거나 deleted=true인 경우"
        note: "기존 코드 재사용"
      - code: 40203
        name: USER_NOT_FOUND
        status: 404 NOT_FOUND
        message: "사용자를 찾을 수 없습니다."
        trigger: "JWT userId로 User 조회 실패 시"
        note: "User 도메인(402xx) 공용 코드 사용"

  validation_rules:
    - "deleted=true인 모집글은 조회 불가. POST_NOT_FOUND 반환."
    - "OPEN / CLOSED 상태 모두 조회 가능."
    - "인증된 사용자(MEMBER)만 조회 가능."
    - "members 목록은 활성(deleted=false) 멤버십만 포함. 탈퇴(Soft Delete)한 멤버는 제외."
    - "체크리스트는 모든 인증 사용자에게 노출 가능(매칭 의사결정 정보로 공개)."
    - "체크리스트를 등록하지 않은 멤버는 lifestyleChecklist=null로 반환(예외 발생 X). LEADER도 동일 정책."
    - "체크리스트의 sleepHabits 는 활성(deleted=false) 항목만 포함."
    - "viewer 본인이 체크리스트 미등록인 경우 모든 멤버의 모든 항목 matched=null."
    - "viewer 본인이 체크리스트 등록 상태이면 각 항목별 viewer.value.equals(member.value)로 matched 계산. sleepHabits는 Set 동일 비교."
    - "viewer 본인의 체크리스트와 비교할 때, viewer가 멤버 목록에 포함되어 있다면 자기 자신의 모든 항목은 matched=true."

# ============================================================
# 구현 대상 파일 (Implementation Phase)
# ============================================================
implementation_targets:
  new_files:
    - "post/application/dto/response/RoommateMemberDetailResponse.java — userId/username/profileImage/role/lifestyleChecklist(nullable) 필드. static factory from(RoommateGroupMember, LifestyleChecklistResponse nullable)"
    - "checklist/application/dto/response/LifestyleChecklistResponse.java — 9개 ChecklistField<T> 항목. static factory from(ChecklistBundle bundle, ChecklistBundle viewerBundle nullable). viewerBundle null이면 모든 matched=null, 그 외에는 viewer 값과 equals 비교(sleepHabits는 Set equality)."
    - "checklist/application/dto/response/ChecklistField.java — generic record { T value, Boolean matched }. of(value, matched) 헬퍼 제공"
    - "checklist/domain/service/ChecklistBundle.java — domain record { LifestyleChecklist checklist, List<LifestyleChecklistSleepHabit> sleepHabits }. 일괄 조회 결과를 사용자별로 묶기 위한 도메인 값 객체."
  modified_files:
    - "post/application/dto/response/RoommatePostDetailResponse.java — members 타입을 List<RoommateMemberDetailResponse>로 변경, from(post, sharedLifestyle, isOwner, isBookmarked, members, checklistByUserId, roommatePreference) 시그니처로 확장"
    - "post/application/usecase/RoommatePostUseCase.java — getPostDetail에서 멤버 조회 후 ChecklistGetService.getChecklistBundlesByUserIds(memberUserIds ∪ {viewerUserId}) 호출 → Map<userId, ChecklistBundle> 수신. private buildChecklistResponses 헬퍼에서 viewerBundle 분리 후 LifestyleChecklistResponse.from(memberBundle, viewerBundle)으로 변환하여 Map<userId, LifestyleChecklistResponse> 조립."
    - "checklist/domain/service/ChecklistGetService.java — getChecklistBundlesByUserIds(Collection<Long> userIds): Map<Long, ChecklistBundle> 메서드 추가. 체크리스트 IN(userIds) 조회 → sleepHabits IN 조회 후 사용자별 ChecklistBundle로 묶어 반환. 변환·matched 계산은 application 레이어 책임."
    - "checklist/domain/repository/ChecklistRepository.java — findAllByUserIdInAndDeletedFalse(Collection<Long> userIds) 추가"
    - "checklist/domain/repository/LifestyleChecklistSleepHabitRepository.java — findByChecklistIdInAndDeletedFalse(Collection<Long> checklistIds) 추가 (없으면 신규)"
  reused_files:
    - "roommategroup/application/dto/response/GroupMemberResponse.java — 본 API에서는 사용하지 않음. my-roommate-groups 등 기존 사용처 유지(타 도메인 영향 없음)."
  layer_rules:
    - "UseCase는 Repository 직접 접근 금지 → ChecklistGetService / RoommateGroupMemberGetService 경유"
    - "도메인 간 UseCase 오케스트레이션 허용. 응답 DTO는 post 도메인 소속이되, 체크리스트 DTO는 소유 도메인(checklist)에서 정의."
    - "Domain Service는 Application DTO를 반환하지 않는다(레이어 의존 역전 금지). 일괄 조회 결과는 도메인 record(ChecklistBundle)로 묶어 반환하고, DTO 변환·matched 계산은 UseCase가 LifestyleChecklistResponse.from(...)을 호출하여 수행한다."

# ============================================================
# 테스트 전략
# ============================================================
testing_strategy:
  happy_path:
    - "유효한 postId로 GET 요청 시 200 OK, RoommatePostDetailResponse 반환 확인"
    - "응답에 post, author, sharedLifestyle, members 4개 영역 데이터가 모두 포함되는지 확인"
    - "OPEN / CLOSED 상태 모두 정상 조회 가능 확인"
    - "작성자 본인이 조회하면 isOwner=true 반환"
    - "타인이 조회하면 isOwner=false 반환"
    - "members에 LEADER + 모든 MEMBER가 userId/username/profileImage/role/lifestyleChecklist 로 매핑되어 포함됨 확인"
    - "LEADER 단독 그룹(MEMBER 0명)도 members에 LEADER 1건 포함됨 확인"
    - "체크리스트 등록한 멤버의 lifestyleChecklist에 9개 ChecklistField 항목 + sleepHabits value 리스트가 채워져 반환됨 확인"
    - "sleepHabits 복수 등록(e.g. TOSS_AND_TURN + SNORING)이 value 리스트로 정확히 매핑되어 응답되는지 확인"
    - "viewer가 체크리스트 등록 상태에서 동일한 값을 가진 멤버의 항목은 matched=true"
    - "viewer가 체크리스트 등록 상태에서 다른 값을 가진 멤버의 항목은 matched=false"
    - "viewer.sleepHabits 와 member.sleepHabits 가 순서 무관 동일 집합이면 matched=true, 다른 집합이면 false"
  edge_cases:
    - "존재하지 않는 postId → 404 POST_NOT_FOUND"
    - "이미 삭제된 postId → 404 POST_NOT_FOUND"
    - "탈퇴(Soft Delete)한 멤버는 members 목록에서 제외됨 확인"
    - "체크리스트 미등록 멤버 → lifestyleChecklist=null 로 반환되고 예외 발생하지 않음"
    - "LEADER가 체크리스트 미등록(이론적 케이스)인 경우에도 lifestyleChecklist=null 처리"
    - "삭제(deleted=true)된 sleepHabit 항목은 lifestyleChecklist.sleepHabits.value에 포함되지 않음"
    - "viewer 본인이 체크리스트 미등록인 경우 모든 멤버의 모든 ChecklistField.matched=null"
  query_verification:
    - "모집글 조회 1회 + 그룹 멤버 조회 1회 + 체크리스트 IN 조회 1회(memberUserIds ∪ {viewerUserId}) + sleepHabits IN 조회 1회 = 총 4회로 처리 확인(N+1 미발생)"
    - "JOIN FETCH m.user 로 멤버 조회 시 user 추가 쿼리 발생하지 않음 확인"

# ============================================================
# 주의사항
# ============================================================
notes:
  - "isOwner는 서버에서 userId 비교로 계산. 클라이언트가 수정/삭제 버튼 표시 여부 판단에 활용."
  - "응답 DTO는 Static Factory Method 패턴 사용: RoommatePostDetailResponse.from(post, sharedLifestyle, isOwner, members, checklistByUserId)"
  - "Controller는 @CurrentMemberId로 userId를 받아 UseCase에 전달. 인증 통과 보장 + isOwner 계산 목적."
  - "PostSharedLifestyle 조회는 기존 RoommatePostGetService.getSharedLifestyleWithPostAndUserByPostId(postId)를 재사용 (post + user fetch join)."
  - "그룹 멤버 조회는 RoommateGroupMemberRepository.findActiveMembersWithUserByPostId(postId)로 m.group.post.id 조인 + m.user fetch join. 그룹을 별도 조회하지 않아 쿼리 1회로 처리."
  - "응답 멤버 매핑은 기존 roommategroup.GroupMemberResponse 대신 post 도메인 전용 RoommateMemberDetailResponse 신규 도입. 이유: 체크리스트 필드는 본 API에만 필요하므로 타 API(예: my-roommate-groups) 응답을 오염시키지 않기 위함."
  - "체크리스트 일괄 조회는 ChecklistGetService.getChecklistBundlesByUserIds(memberUserIds ∪ {viewerUserId})로 수행. 내부에서 ChecklistRepository.findAllByUserIdInAndDeletedFalse → 결과 checklistIds로 LifestyleChecklistSleepHabitRepository.findByChecklistIdInAndDeletedFalse 호출 후 Map<Long userId, ChecklistBundle>로 묶어 반환(레이어 의존 역전 회피)."
  - "matched 계산은 UseCase 레이어에서 수행. viewerBundle = bundlesByUserId.get(viewerUserId)을 추출 후, 멤버별로 LifestyleChecklistResponse.from(memberBundle, viewerBundle)을 호출하여 Map<Long userId, LifestyleChecklistResponse>를 조립한다."
  - "각 ChecklistField.matched 계산 규칙: viewerBundle=null(viewer 체크리스트 미등록) → 모든 항목 matched=null. 등록 상태 → Objects.equals(viewer.value, member.value)로 비교, sleepHabits 한정 Set 동일 비교."
  - "체크리스트 미등록 멤버는 lifestyleChecklist=null. 프론트엔드는 null일 때 '미등록' UI 표시 정책 협의 필요."
  - "체크리스트 노출 권한: 모든 인증 사용자(외부인 포함). 매칭 의사결정 정보로 공개되는 것이 의도된 정책. 향후 권한 축소(그룹 멤버 한정 등) 요구가 생기면 별도 정책 결정."
  - "탈퇴/해체된 그룹의 모집글은 RoommatePost.deleted=true이므로 본 조회에서 POST_NOT_FOUND로 사전 차단된다."
