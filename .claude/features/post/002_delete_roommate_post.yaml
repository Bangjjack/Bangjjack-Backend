# Feature Specification: 룸메이트 모집글 삭제
# Status: Draft
# Last Updated: 2026-05-29

meta:
  id: FEAT-008
  title: 룸메이트 모집글 삭제
  type: Feature
  author: xEzIxX

overview:
  summary: >
    모집글 작성자 본인만 자신이 작성한 룸메이트 모집글을 삭제할 수 있다.
    삭제는 Hard Delete가 아닌 Soft Delete(deleted = true, deletedAt 설정)로 처리한다.
    OPEN 및 CLOSED 상태 모두 삭제 가능하며, 이미 삭제된 모집글은 조회 자체가 불가하다.
    삭제된 모집글은 목록/상세 조회에서 노출되지 않으며, 해당 글의 OPEN 상태가 해제되므로
    작성자는 이후 새 모집글을 작성할 수 있다.

    작성자(= LEADER)가 모집글을 삭제하면 LEADER 탈퇴(그룹 해체)와 동일한 cascade
    범위로 처리된다 — 연결된 PostSharedLifestyle, RoommateGroup, 해당 그룹의 모든
    활성 RoommateGroupMember(LEADER 본인 + MEMBER들)를 함께 Soft Delete한다.
    합류 근거였던 RoommateApplication(PENDING/ACCEPTED/REJECTED)은 이력 보존을
    위해 변경하지 않는다.
  user_story: >
    As a 모집글 작성자, I want to 내가 작성한 룸메이트 모집글을 삭제하고,
    so that 더 이상 필요 없는 모집글을 정리하고 필요 시 새 모집글을 작성할 수 있다.
  goals:
    - 작성자 본인만 삭제 가능 (타인 삭제 차단)
    - Soft Delete 처리 (deleted, deletedAt 필드 갱신)
    - OPEN / CLOSED 상태 모두 삭제 가능
    - 존재하지 않는(또는 이미 삭제된) 모집글 삭제 차단
    - 모집글 삭제 시 연결된 RoommateGroup + 모든 활성 RoommateGroupMember도 함께 Soft Delete (LEADER 탈퇴와 동일 cascade)
    - 그룹에 본인 외 멤버가 존재하면 RoommateGroupDisbandedEvent를 발행해 알림

# ============================================================
# API 명세
# ============================================================
technical_spec:
  api:
    - method: DELETE
      path: /api/v1/posts/{postId}
      summary: 룸메이트 모집글 삭제
      auth: MEMBER (Bearer Token, 필수)
      request:
        path_variable:
          - name: postId
            type: Long
            required: true
            note: "삭제할 모집글 ID"
        dto: "(없음)"
        fields: []
      response:
        dto: Void
        http_status: 200 OK
        wrapper: CommonResponse<Void>
        response_code: PostResponseCode.POST_DELETED
        fields: []

  data_flow:
    - step: 1
      layer: Presentation (RoommatePostController)
      action: "@CurrentMemberId로 JWT에서 userId 추출, @PathVariable로 postId 수신 후 RoommatePostUseCase.deletePost(userId, postId) 호출"
    - step: 2
      layer: UseCase (RoommatePostUseCase)
      transaction: true
      action: "RoommatePostGetService.getById(postId)로 RoommatePost 조회 (없거나 이미 삭제된 경우 POST_NOT_FOUND)"
    - step: 3
      layer: UseCase (RoommatePostUseCase)
      action: "post.getUser().getId()와 userId 일치 여부 검증 → 불일치 시 POST_DELETE_FORBIDDEN"
    - step: 4
      layer: UseCase (RoommatePostUseCase)
      action: "RoommateGroupGetService.getByPostId(postId)로 연결된 RoommateGroup 조회 (활성 모집글에는 항상 활성 그룹이 존재)"
    - step: 5
      layer: UseCase (RoommatePostUseCase)
      action: "RoommateGroupMemberGetService.getActiveMembersWithUserByPostId(postId)로 그룹의 모든 활성 멤버십(LEADER 본인 + MEMBER들) 조회 (user fetch join). 알림 대상 memberIds(요청자 제외) 사전 계산"
    - step: 6
      layer: Domain (RoommateGroupMember Entity / BaseEntity) + Service
      action: "RoommateGroupMemberDeleteService.deleteAll(members)로 모든 활성 멤버십 일괄 softDelete (deleted=true, deletedAt=now()). 더티 체킹으로 flush"
    - step: 7
      layer: Domain (RoommatePost, PostSharedLifestyle Entity / BaseEntity) + Service
      action: "RoommatePostGetService.getSharedLifestyleByPost(post)로 PostSharedLifestyle 조회 → RoommatePostDeleteService.deletePost(post, sharedLifestyle)로 둘 모두 softDelete"
    - step: 8
      layer: Domain (RoommateGroup Entity / BaseEntity) + Service
      action: "RoommateGroupDeleteService.delete(group)로 그룹 softDelete (deleted=true, deletedAt=now())"
    - step: 9
      layer: Application (Event)
      action: "memberIdsToNotify가 비어 있지 않으면 ApplicationEventPublisher.publishEvent(new RoommateGroupDisbandedEvent(userId, memberIdsToNotify, postTitle)) 호출 (LEADER 단독 그룹이면 미발행)"
    - step: 10
      layer: Response
      action: "반환값 없음 (void). 200 OK 응답."

  database:
    entities:
      - name: RoommatePost
        action: Update (Soft Delete)
        fields: "deleted = true, deletedAt = now()"
        note: "BaseEntity.softDelete()"
      - name: PostSharedLifestyle
        action: Update (Soft Delete)
        fields: "deleted = true, deletedAt = now()"
        note: "RoommatePost와 함께 명시적으로 softDelete()"
      - name: RoommateGroup
        action: Update (Soft Delete)
        fields: "deleted = true, deletedAt = now()"
        note: "post ↔ group은 UQ_group_post_id로 1:1. 작성자(=LEADER) 본인의 그룹 해체와 동일."
      - name: RoommateGroupMember
        action: Update (Soft Delete)
        fields: "deleted = true, deletedAt = now()"
        note: "해당 group_id의 모든 활성 멤버십(LEADER 본인 + MEMBER들)을 일괄 Soft Delete. UQ_group_member_group_user_active(group_id, user_id, deleted_at) 제약은 deleted_at=NULL 활성 행만 유일."
      - name: RoommateApplication
        action: None
        fields: "변경 없음"
        note: "이력 보존을 위해 PENDING/ACCEPTED/REJECTED 모두 불변 (ApplicationStatus에 CANCELED 없음)."

  error_codes:
    domain_range: "407xx (Post 도메인)"
    codes:
      - code: 40704
        name: POST_NOT_FOUND
        status: 404 NOT_FOUND
        message: "모집글을 찾을 수 없습니다."
        trigger: "postId에 해당하는 모집글이 존재하지 않거나 이미 삭제(deleted=true)된 경우"
      - code: 40705
        name: POST_DELETE_FORBIDDEN
        status: 403 FORBIDDEN
        message: "모집글을 삭제할 권한이 없습니다."
        trigger: "모집글의 작성자(user_id)와 요청자(JWT userId)가 다른 경우"
      - code: 40203
        name: USER_NOT_FOUND
        status: 404 NOT_FOUND
        message: "사용자를 찾을 수 없습니다."
        trigger: "JWT userId로 User 조회 실패 시"
        note: "User 도메인(402xx) 공용 코드 사용"

  validation_rules:
    - "삭제는 작성자 본인만 가능. postId의 user_id와 JWT userId가 일치해야 함."
    - "deleted = true인 모집글은 POST_NOT_FOUND로 응답 (이미 삭제 처리된 글)"
    - "OPEN / CLOSED 상태 모두 삭제 가능. 상태 제한 없음."
    - "Hard Delete 금지. 반드시 BaseEntity.softDelete()를 통해 Soft Delete 처리."
    - "모집글 삭제 시 연결된 RoommateGroup, 모든 활성 RoommateGroupMember도 함께 Soft Delete (cascade 일관성)."
    - "그룹에 본인 외 활성 멤버가 1명 이상 있으면 RoommateGroupDisbandedEvent 발행. LEADER 단독 그룹이면 발행 안 함."
    - "RoommateApplication(모든 status)은 변경하지 않음 (이력 보존)."

# ============================================================
# 테스트 전략
# ============================================================
testing_strategy:
  happy_path:
    - "작성자 본인이 OPEN 상태 모집글 삭제 → 200 OK, post + lifestyle + group + 활성 멤버십 모두 deleted=true / deletedAt 설정 확인"
    - "작성자 본인이 CLOSED 상태 모집글 삭제 → 200 OK, 위와 동일하게 cascade 처리 확인"
    - "삭제 후 해당 postId로 조회 시 POST_NOT_FOUND 반환 확인"
    - "삭제 후 GET /api/v1/roommate-groups/me 응답에 해당 그룹이 포함되지 않음을 확인 (회귀 대상 버그)"
    - "삭제 후 작성자가 새 모집글 작성 시 OPEN 상태 중복 없으므로 정상 작성 가능 확인"
    - "그룹에 본인 외 멤버가 있을 때 삭제 → RoommateGroupDisbandedEvent가 (leaderId, [멤버들], postTitle)로 1회 발행됨"
    - "LEADER 단독 그룹(MEMBER 0명) 삭제 → 이벤트 미발행"
    - "삭제 후 RoommateApplication 레코드는 status/필드 변경 없음 확인 (이력 보존)"
  edge_cases:
    - "존재하지 않는 postId → 404 POST_NOT_FOUND"
    - "이미 삭제된 postId → 404 POST_NOT_FOUND"
    - "타인의 모집글 삭제 시도 → 403 POST_DELETE_FORBIDDEN (cascade 미수행)"
    - "존재하지 않는 userId (JWT 변조) → 404 USER_NOT_FOUND"

# ============================================================
# 주의사항
# ============================================================
notes:
  - "Hard Delete 절대 금지. BaseEntity.softDelete()로 Soft Delete 처리."
  - "삭제 시 PostSharedLifestyle도 RoommatePost와 함께 명시적으로 softDelete() 처리됨. 조회 시 deleted 필터로 제외."
  - "삭제된 OPEN 모집글은 더 이상 OPEN으로 카운트되지 않으므로, 작성자는 이후 새 모집글 작성 가능."
  - "에러 코드 추가 시 check_error_codes.py 실행 필수 (essential-rules.yaml 규칙)."
  - "버그 수정 (2026-05-29): 기존 deletePost는 post + lifestyle만 softDelete하여 RoommateGroup/RoommateGroupMember가 고아 row로 잔존, '내 그룹 조회' 응답에 삭제된 모집글이 노출되는 문제 발생. roommategroup/002 leave (LEADER 탈퇴 = disbandGroup)와 동일한 cascade로 일관성 회복."
  - "작성자(=LEADER) 직접 모집글 삭제와 roommategroup/002 LEADER 탈퇴는 비즈니스 의미가 동일하며 동일한 cascade 범위(post + lifestyle + group + 모든 활성 멤버십)와 동일한 이벤트(RoommateGroupDisbandedEvent)를 공유한다. 진입 엔드포인트만 다름."
