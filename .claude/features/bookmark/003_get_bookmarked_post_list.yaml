# Feature Specification: 내 북마크 모집글 목록 조회
# Status: Draft
# Last Updated: 2026-05-17

meta:
  id: FEAT-014
  title: 내 북마크 모집글 목록 조회
  type: Feature
  author: xEzIxX

overview:
  summary: >
    인증된 사용자가 자신이 북마크한 룸메이트 모집글 목록을 조회한다.
    본인 북마크만 조회 가능(완전 비공개). 삭제된 게시글은 제외, 마감(CLOSED) 게시글은 포함.
    최근 북마크 등록순(bookmark.createdAt DESC) 정렬, Slice 페이지네이션 사용.
  user_story: >
    As a 인증된 사용자, I want to 내가 북마크한 모집글만 모아보고,
    so that 관심 있는 게시글을 한눈에 관리할 수 있다.
  goals:
    - 본인 북마크 모집글 목록 조회 (비공개)
    - 삭제된 게시글 제외, 마감 게시글 포함
    - 최근 북마크순 정렬
    - Slice 기반 페이지네이션

# ============================================================
# API 명세
# ============================================================
technical_spec:
  api:
    - method: GET
      path: /api/v1/posts/bookmarks
      summary: 내 북마크 모집글 목록 조회
      auth: MEMBER (Bearer Token, 필수)
      request:
        query_params:
          - name: page
            type: Integer
            required: false
            default: 0
          - name: size
            type: Integer
            required: false
            default: 20
      response:
        dto: BookmarkedPostResponse
        http_status: 200 OK
        wrapper: CommonResponse<SliceResponse<BookmarkedPostResponse>>
        response_code: BookmarkResponseCode.BOOKMARKED_POST_LIST_FOUND
        fields:
          - name: postId
            type: Long
          - name: title
            type: String
          - name: description
            type: String
            note: "클라이언트에서 말줄임 처리"
          - name: dormitory
            type: String (Enum)
          - name: roomSize
            type: String (Enum)
          - name: recruitMemberCount
            type: Integer
          - name: status
            type: String (Enum)
            note: "OPEN | CLOSED — 마감 게시글도 목록에 유지"
          - name: bookmarkedAt
            type: LocalDateTime
            note: "북마크 등록 시각 (PostBookmark.createdAt)"

  data_flow:
    - step: 1
      layer: Presentation (BookmarkController)
      action: "userId(JWT), Pageable 수신 → BookmarkUseCase.getBookmarkedPosts(userId, pageable) 호출"
    - step: 2
      layer: UseCase (BookmarkUseCase)
      action: "BookmarkGetService.getBookmarkedPosts(userId, pageable) 호출"
    - step: 3
      layer: Domain Service (BookmarkGetService)
      action: >
        BookmarkRepository 조회: post_bookmarks.deleted=false AND JOIN roommate_posts WHERE deleted=false.
        정렬: post_bookmarks.created_at DESC.
    - step: 4
      layer: UseCase (BookmarkUseCase)
      action: "Slice<PostBookmark> → Slice<BookmarkedPostResponse> 변환 후 반환"

  new_components:
    response_dto:
      - name: BookmarkedPostResponse
        location: application/dto/response/
        fields: "postId, title, description, dormitory, roomSize, recruitMemberCount, status, bookmarkedAt"
        note: "static factory method from(PostBookmark) 사용. PostBookmark → RoommatePost JOIN으로 조회."
    service:
      - name: BookmarkGetService
        location: domain/bookmark/service/
        methods:
          - "getBookmarkedPosts(userId, pageable): Slice<PostBookmark>"
    repository:
      - name: BookmarkRepository
        type: "Spring Data JPA + QueryDSL (BookmarkRepositoryImpl)"
        key_queries:
          - "findBookmarkedPosts(userId, pageable): Slice<PostBookmark> JOIN roommate_posts WHERE deleted=false, bookmark.created_at DESC"
    response_code:
      - name: BOOKMARKED_POST_LIST_FOUND
        code: 200
        message: "북마크한 게시글 목록 조회에 성공했습니다."

  error_codes:
    note: "목록 조회는 별도 에러 없음. 북마크 없을 경우 빈 배열 반환."

  pagination:
    type: Slice (Spring Data)
    sort: "post_bookmarks.created_at DESC (최근 북마크순)"
    note: "count 쿼리 없이 hasNext만 반환. SliceResponse<T>는 content(List), hasNext(boolean) 포함."

  validation_rules:
    - "인증된 사용자(MEMBER)만 조회 가능"
    - "본인 북마크만 반환 (JWT userId 기반, 타 사용자 접근 불가)"
    - "post_bookmarks.deleted=false 인 북마크만 포함"
    - "roommate_posts.deleted=false 인 게시글만 포함 (삭제된 게시글 자동 제외)"
    - "roommate_posts.status=CLOSED 게시글은 포함 (마감 상태도 조회 가능)"

# ============================================================
# 테스트 전략
# ============================================================
testing_strategy:
  happy_path:
    - "북마크 있을 때 목록 반환, 최근 북마크순 정렬 확인"
    - "CLOSED 게시글도 목록에 포함 확인"
    - "hasNext=false 시 마지막 페이지 확인"
    - "다른 사용자의 북마크는 포함되지 않음 확인"
  edge_cases:
    - "북마크가 없을 경우 → 빈 배열 + hasNext=false"
    - "북마크한 게시글이 이후 삭제된 경우 → 목록에서 자동 제외"
    - "해제(deleted=true)된 북마크는 목록에 미포함"

# ============================================================
# 주의사항
# ============================================================
notes:
  - "BookmarkRepositoryImpl QueryDSL JOIN 시 roommate_posts.deleted=false 조건 필수."
  - "북마크 완전 비공개 — 모집글 상세/목록 응답에 isBookmarked, 북마크 수 노출 없음."
  - "PostBookmark 엔티티 정의: .claude/references/data-model/post/post-bookmark.yaml 참조."
