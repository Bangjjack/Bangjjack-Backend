# Feature Specification: 룸메이트 모집글 북마크 등록
# Status: Draft
# Last Updated: 2026-05-17

meta:
  id: FEAT-012
  title: 룸메이트 모집글 북마크 등록
  type: Feature
  author: xEzIxX

overview:
  summary: >
    인증된 사용자가 룸메이트 모집글을 북마크로 저장한다.
    삭제된 게시글은 북마크 불가. 이미 북마크한 게시글 재등록 시 409 반환.
  user_story: >
    As a 인증된 사용자, I want to 관심 있는 모집글을 북마크하고,
    so that 나중에 다시 찾아볼 수 있다.
  goals:
    - 모집글 북마크 등록
    - 삭제된 게시글 북마크 차단
    - 중복 북마크 차단

# ============================================================
# API 명세
# ============================================================
technical_spec:
  api:
    - method: POST
      path: /api/v1/posts/{postId}/bookmarks
      summary: 룸메이트 모집글 북마크 등록
      auth: MEMBER (Bearer Token, 필수)
      request:
        path_variable:
          - name: postId
            type: Long
            required: true
        dto: "(없음 — Body 없음)"
      response:
        dto: Void
        http_status: 201 CREATED
        wrapper: CommonResponse<Void>
        response_code: BookmarkResponseCode.BOOKMARK_CREATED
        fields: []

  data_flow:
    - step: 1
      layer: Presentation (BookmarkController)
      action: "postId(PathVariable), userId(JWT) 추출 → BookmarkUseCase.createBookmark(userId, postId) 호출"
    - step: 2
      layer: UseCase (BookmarkUseCase)
      action: "RoommatePostGetService로 postId 기준 RoommatePost 조회 (deleted=false), 없으면 POST_NOT_FOUND"
    - step: 3
      layer: UseCase (BookmarkUseCase)
      action: "BookmarkGetService.existsActiveBookmark(userId, postId) 확인 → 존재하면 ALREADY_BOOKMARKED"
    - step: 4
      layer: Domain (PostBookmark Entity)
      action: "PostBookmark.create(userId, postId) 생성"
    - step: 5
      layer: Infrastructure (BookmarkRepository)
      action: "PostBookmark 저장"
    - step: 6
      layer: Response
      action: "반환값 없음 (void). 201 CREATED 응답."

  error_codes:
    codes:
      - code: 40704
        name: POST_NOT_FOUND
        status: 404 NOT_FOUND
        message: "게시글을 찾을 수 없습니다."
        trigger: "postId에 해당하는 게시글이 없거나 deleted=true인 경우"
        note: "Post 도메인 공용 코드 재사용"
      - code: 40801
        name: ALREADY_BOOKMARKED
        status: 409 CONFLICT
        message: "이미 북마크한 게시글입니다."
        trigger: "동일 (userId, postId) 활성 북마크가 이미 존재할 때"
        note: "Bookmark 도메인 신규 코드 — check_error_codes.py 실행 필수"

  validation_rules:
    - "인증된 사용자(MEMBER)만 북마크 가능"
    - "deleted=true인 게시글 북마크 불가 → 404 POST_NOT_FOUND"
    - "동일 게시글 중복 북마크 불가 → 409 ALREADY_BOOKMARKED"
    - "OPEN / CLOSED 상태 무관하게 북마크 가능 (마감 게시글도 북마크 허용)"

# ============================================================
# 테스트 전략
# ============================================================
testing_strategy:
  happy_path:
    - "유효한 postId로 POST 호출 시 201 CREATED, post_bookmarks 레코드 생성 확인"
    - "CLOSED 게시글도 북마크 가능 확인"
  edge_cases:
    - "존재하지 않는 postId → 404 POST_NOT_FOUND"
    - "deleted=true 게시글 → 404 POST_NOT_FOUND"
    - "이미 북마크한 게시글 재등록 → 409 ALREADY_BOOKMARKED"
    - "존재하지 않는 userId (JWT 변조) → 404 USER_NOT_FOUND (40203)"

# ============================================================
# 주의사항
# ============================================================
notes:
  - "Bookmark 도메인 error_code 범위: 408xx — check_error_codes.py로 중복 확인 필수"
  - "북마크는 완전 비공개. 모집글 상세/목록 응답에 isBookmarked 또는 북마크 수 노출 없음."
  - "소프트 딜리트 사용. 해제 후 재등록 시 신규 레코드 생성."
