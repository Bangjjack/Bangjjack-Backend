# Feature Specification: 룸메이트 모집글 북마크 해제
# Status: Draft
# Last Updated: 2026-05-17

meta:
  id: FEAT-013
  title: 룸메이트 모집글 북마크 해제
  type: Feature
  author: xEzIxX

overview:
  summary: >
    인증된 사용자가 자신이 등록한 룸메이트 모집글 북마크를 해제한다.
    북마크가 존재하지 않으면 404 반환. 소프트 딜리트로 처리한다.
  user_story: >
    As a 인증된 사용자, I want to 북마크한 모집글을 해제하고,
    so that 더 이상 관심 없는 게시글을 목록에서 제거할 수 있다.
  goals:
    - 모집글 북마크 해제 (소프트 딜리트)
    - 본인 북마크만 해제 가능
    - 존재하지 않는 북마크 해제 시 404 반환

# ============================================================
# API 명세
# ============================================================
technical_spec:
  api:
    - method: DELETE
      path: /api/v1/posts/{postId}/bookmarks
      summary: 룸메이트 모집글 북마크 해제
      auth: MEMBER (Bearer Token, 필수)
      request:
        path_variable:
          - name: postId
            type: Long
            required: true
        dto: "(없음 — Body 없음)"
      response:
        dto: Void
        http_status: 204 NO_CONTENT
        wrapper: CommonResponse<Void>
        response_code: BookmarkResponseCode.BOOKMARK_DELETED
        fields: []

  data_flow:
    - step: 1
      layer: Presentation (BookmarkController)
      action: "postId(PathVariable), userId(JWT) 추출 → BookmarkUseCase.deleteBookmark(userId, postId) 호출"
    - step: 2
      layer: UseCase (BookmarkUseCase)
      action: "BookmarkGetService.findActiveBookmark(userId, postId) 조회 → 없으면 BOOKMARK_NOT_FOUND"
    - step: 3
      layer: Domain (PostBookmark Entity)
      action: "bookmark.softDelete() 호출"
    - step: 4
      layer: Response
      action: "반환값 없음 (void). 204 NO_CONTENT 응답."

  new_components:
    service:
      - name: BookmarkGetService
        location: domain/bookmark/service/
        methods:
          - "findActiveBookmark(userId, postId): Optional<PostBookmark>"
    repository:
      - name: BookmarkRepository
        methods:
          - "findByUserIdAndPostIdAndDeletedFalse(userId, postId): Optional<PostBookmark>"
    response_code:
      - name: BOOKMARK_DELETED
        code: 204
        message: "북마크가 해제되었습니다."

  error_codes:
    codes:
      - code: 40802
        name: BOOKMARK_NOT_FOUND
        status: 404 NOT_FOUND
        message: "북마크를 찾을 수 없습니다."
        trigger: "해당 (userId, postId) 활성 북마크가 존재하지 않을 때"
        note: "Bookmark 도메인 신규 코드 — check_error_codes.py 실행 필수"

  validation_rules:
    - "인증된 사용자(MEMBER)만 해제 가능"
    - "본인이 등록한 북마크만 해제 가능 (userId 기반 조회로 자동 보장)"
    - "활성 북마크(deleted=false)가 없으면 → 404 BOOKMARK_NOT_FOUND"

# ============================================================
# 테스트 전략
# ============================================================
testing_strategy:
  happy_path:
    - "본인이 북마크한 게시글에 DELETE 호출 시 204 NO_CONTENT, PostBookmark.deletedAt 설정 확인"
    - "게시글이 CLOSED 또는 삭제 상태여도 본인 북마크는 해제 가능"
  edge_cases:
    - "북마크하지 않은 게시글에 DELETE → 404 BOOKMARK_NOT_FOUND"
    - "이미 해제된(deleted=true) 북마크에 DELETE → 404 BOOKMARK_NOT_FOUND"
    - "다른 사용자의 북마크 해제 시도 → 404 BOOKMARK_NOT_FOUND (userId 불일치로 조회 실패)"
    - "존재하지 않는 userId (JWT 변조) → 404 USER_NOT_FOUND (40203)"

# ============================================================
# 주의사항
# ============================================================
notes:
  - "게시글 삭제 여부(PostRepository) 별도 조회 없음. 북마크 존재 여부만 확인."
  - "다른 사용자의 북마크 접근 시 403이 아닌 404 반환 (존재 자체를 노출하지 않음)."
  - "소프트 딜리트 사용 — 재등록 시 신규 PostBookmark 레코드 생성."
