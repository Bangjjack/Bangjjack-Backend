# Feature Specification: 룸메이트 신청 취소
# Status: Done
# Last Updated: 2026-05-28

meta:
  id: FEAT-015
  title: 룸메이트 신청 취소
  type: Feature
  author: 1winhyun

overview:
  summary: >
    신청자(applicant)가 본인이 보낸 PENDING 상태 룸메이트 신청을 취소한다.
    상태는 PENDING → CANCELED 로 전이되며, CANCELED 는 ACCEPTED/REJECTED 와 동일하게 종착 상태이다.
    취소 시 작성자(authorId)와의 1:1 채팅방에 신청자 명의 안내 채팅이 자동 전송되어
    채팅방 안에서 "신청 → 취소" 흐름이 시간순으로 자연스럽게 노출된다.
    REJECTED 와 동일하게 취소 이후 동일 모집글에 대한 재신청은 허용된다 (PENDING 동시 존재만 차단 대상).
  user_story: >
    As a 룸메이트 신청을 보낸 사용자, I want to 작성자가 처리하기 전에 내 PENDING 신청을 직접 취소하고,
    so that 마음이 바뀌었거나 잘못 보낸 경우 즉시 의사를 철회하고 다른 모집글에 신청할 수 있다.
  goals:
    - PENDING → CANCELED 전이 (종착 상태)
    - 신청자(applicant) 본인만 취소 가능 (작성자 호출 시 권한 오류)
    - 취소 시 신청자 명의 안내 채팅 자동 전송 + WebSocket broadcast
    - 취소 후 동일 (postId, applicantId) 재신청 허용 (REJECTED 와 동일 정책)
    - 모집글 status / 그룹 멤버십 변경 없음 (수락된 적 없는 신청이므로 side effect 최소)

# ============================================================
# API 명세
# ============================================================
technical_spec:
  api:
    - method: PATCH
      path: /api/v1/applications/{applicationId}/cancel
      summary: 룸메이트 신청 취소 (신청자 본인만 호출 가능)
      auth: MEMBER (Bearer Token, 필수 — 신청자 본인만 허용)
      request:
        path_variable:
          - name: applicationId
            type: Long
            required: true
            note: "취소 대상 신청 ID"
        dto: "(없음)"
        body: "(없음 — 요청 본문 없이 취소 전송)"
        fields: []
      response:
        dto: CancelRoommateApplicationResponse
        http_status: 200 OK
        wrapper: CommonResponse<CancelRoommateApplicationResponse>
        response_code: ApplicationResponseCode.APPLICATION_CANCELED
        fields:
          - name: applicationId
            type: Long
          - name: postId
            type: Long
            note: "취소된 신청이 향했던 모집글 ID"
          - name: applicantId
            type: Long
          - name: status
            type: String (Enum)
            note: "CANCELED (취소 후 고정)"
          - name: chatRoomId
            type: Long
            note: "안내 채팅이 전송된 1:1 채팅방 ID"
          - name: canceledAt
            type: LocalDateTime
            note: "취소 시각 (application.updatedAt)"

  data_flow:
    - step: 1
      layer: Presentation (RoommateApplicationCancelController)
      action: "@CurrentMemberId 로 JWT 에서 userId 추출, @PathVariable applicationId 수신 후 RoommateApplicationUseCase.cancelApplication(userId, applicationId) 호출 (요청 본문 없음)"
    - step: 2
      layer: UseCase (RoommateApplicationUseCase)
      transaction: true
      action: "RoommateApplicationGetService.getWithPostAndUserById(applicationId) 로 신청 + 모집글 + 작성자 + 신청자 fetch join 조회 (없거나 deleted=true 이면 APPLICATION_NOT_FOUND)"
    - step: 3
      layer: UseCase (RoommateApplicationUseCase)
      action: "application.getApplicant().getId() == userId 검증 → 신청자가 아니면 APPLICATION_CANCEL_FORBIDDEN. 작성자(authorId)는 본 API 로 호출 불가."
    - step: 4
      layer: UseCase (RoommateApplicationUseCase)
      action: "application.getStatus() == PENDING 검증 → ACCEPTED/REJECTED/CANCELED 등 종착 상태는 변경 불가 → INVALID_APPLICATION_STATUS (002 와 동일 코드 재사용)"
    - step: 5
      layer: Domain (RoommateApplication Entity)
      action: "application.cancel() 호출 → status = CANCELED (더티 체킹으로 갱신)"
    - step: 6
      layer: UseCase (RoommateApplicationUseCase)
      action: "ChatRoomCreateService.createDirectKey(applicantId, authorId) → ChatRoomGetService.findByDirectRoomKey(...). 001 에서 생성 보장되었으므로 없으면 시스템 무결성 오류 ChatRoomNotFoundException (chat 406xx)."
    - step: 7
      layer: Domain Service (ChatSaveService)
      action: "ChatSaveService.save(applicantId, chatRoom, APPLICATION_CANCELED_MESSAGE, MessageType.APPLICATION_CANCELED, applicationId) 호출. senderId 는 신청자(applicant) ID."
    - step: 8
      layer: UseCase (RoommateApplicationUseCase)
      action: "chatRoom.updateCategory(ChatRoomCategory.GENERAL) 적용 (002 와 동일 패턴) + ApplicationEventPublisher 로 ChatMessageSentEvent(roomId, ChatMessageBroadcast.from(chat, roomId)) 발행 → WebSocketBroadcaster 자동 송신."
    - step: 9
      layer: Response
      action: "CancelRoommateApplicationResponse.from(application, chatRoom.getId()) 생성 후 200 OK, CommonResponse<…> 반환."

  response_dto_structure:
    CancelRoommateApplicationResponse:
      note: "static factory method from(RoommateApplication, Long chatRoomId) 사용 (essential-rules.yaml 의 Response DTO 정적 팩토리 규약 준수)."
      source_fields:
        - "applicationId ← application.getId()"
        - "postId ← application.getPost().getId()"
        - "applicantId ← application.getApplicant().getId()"
        - "status ← application.getStatus() (CANCELED 고정)"
        - "chatRoomId ← UseCase 가 확보한 ChatRoom 인스턴스의 id 를 파라미터로 전달"
        - "canceledAt ← application.getUpdatedAt() (BaseEntity 의 updatedAt, JPA Auditing)"

  database:
    entities:
      - name: RoommateApplication
        action: Update
        fields: "status (PENDING → CANCELED), updatedAt"
        note: "JPA 더티 체킹으로 갱신. 추가 컬럼 변경 없음. soft delete (deleted=true) 는 수행하지 않음 — CANCELED 는 도메인 상태이지 삭제가 아니다."
      - name: Chat
        action: Create
        fields: "user_id=applicantId (신청자 명의), room_id=chatRoom.id, content=APPLICATION_CANCELED_MESSAGE, message_type=APPLICATION_CANCELED, target_id=applicationId"
        note: "ChatSaveService.save() 호출 후 ChatMessageSentEvent 발행."

  enum_changes:
    note: "본 스펙에서 추가되는 enum 값. references/data-model/application/roommate-application.yaml 및 chat 도메인 enum 카탈로그에 동기화 필요."
    application_status:
      add:
        - value: CANCELED
          display: "취소됨"
          rule: "신청자가 본인 PENDING 신청을 철회한 상태. ACCEPTED/REJECTED 와 동일한 종착 상태."
    message_type:
      add:
        - value: APPLICATION_CANCELED
          rule: "신청 취소 안내 채팅. senderId 는 신청자(applicant). 001 의 APPLICATION_SENT 와 짝을 이룬다."

  message_constants:
    note: "RoommateApplicationUseCase 내부 상수로 관리. 001/002 안내 문구와 동일 패턴 유지."
    constants:
      - "APPLICATION_CANCELED_MESSAGE = \"룸메이트 신청을 취소했습니다.\""

  error_codes:
    domain_range: "408xx (Application 도메인). 신규 코드 1건 + 재사용 1건."
    note: "신규 코드 추가 시 check_error_codes.py 실행 필수 (essential-rules.yaml)."
    codes:
      - code: 40806
        name: APPLICATION_NOT_FOUND
        status: 404 NOT_FOUND
        message: "신청을 찾을 수 없습니다."
        trigger: "applicationId 미존재 또는 deleted=true"
        note: "002 에서 정의된 코드 재사용."
      - code: 40808
        name: INVALID_APPLICATION_STATUS
        status: 409 CONFLICT
        message: "이미 처리된 신청은 다시 처리할 수 없습니다."
        trigger: "application.status != PENDING (이미 ACCEPTED / REJECTED / CANCELED 인 경우)"
        note: "002 에서 정의된 코드 재사용. 취소도 '처리'의 일종이므로 동일 코드 적용."
      - code: 40813
        name: APPLICATION_CANCEL_FORBIDDEN
        status: 403 FORBIDDEN
        message: "본인이 보낸 신청만 취소할 수 있습니다."
        trigger: "요청자가 application.applicant.id 와 다름 (작성자가 호출한 경우 포함)"
        note: "신규 코드. APPLICATION_PROCESS_FORBIDDEN(40807) 과 코드 분리 — 권한 주체(applicant vs author)가 다르고 메시지도 다르다."

  response_codes:
    add:
      - name: APPLICATION_CANCELED
        http_status: 200 OK
        message: "룸메이트 신청이 취소되었습니다."
        note: "ApplicationResponseCode enum 에 신규 추가. 001 의 APPLICATION_CREATED / 002 의 APPLICATION_PROCESSED 와 짝을 이룬다."

  validation_rules:
    - "인증된 MEMBER 만 호출 가능"
    - "신청은 존재해야 하며 deleted=false 이어야 함 (없으면 APPLICATION_NOT_FOUND)"
    - "요청자가 신청자(applicant)여야 함 (application.applicant.id == userId). 작성자(author)는 호출 불가 — 작성자의 거절은 002 의 REJECTED 경로 사용."
    - "application.status == PENDING 이어야 함. ACCEPTED / REJECTED / CANCELED 종착 상태는 변경 불가 (상태 고정 정책)."
    - "취소(CANCELED) 처리 후에도 모집글 status / 그룹 멤버십 / 채팅방 자체는 변경하지 않음. 채팅방은 유지되며 안내 채팅 1건만 추가."
    - "취소 후 동일 (postId, applicantId) 에 대한 재신청 허용 — application/001 의 ALREADY_APPLIED_PENDING 검증은 status=PENDING 기준이므로 CANCELED 이력은 차단 대상이 아님 (코드 변경 없음)."
    - "취소 직후 신청자 명의로 안내 채팅 1건 자동 전송. ChatMessageSentEvent 발행으로 실시간 broadcast 수행."

  dependencies:
    domain_services:
      - RoommateApplicationGetService.getWithPostAndUserById(applicationId) — 002 와 동일 메서드 재사용 (post + post.user + applicant fetch join)
      - ChatRoomCreateService.createDirectKey(userIdA, userIdB)
      - ChatRoomGetService.findByDirectRoomKey(directRoomKey)
      - ChatSaveService.save(senderId, chatRoom, content, messageType, targetId)
    domain_entity_methods:
      - RoommateApplication.cancel() — 신규 도메인 메서드 (status = CANCELED). accept() / reject() 와 동일 패턴.
    spring_infrastructure:
      - ApplicationEventPublisher.publishEvent(ChatMessageSentEvent) — WebSocketBroadcaster 가 listen
    constraint_check:
      - "UseCase 는 Repository 직접 호출 금지. 반드시 Domain Service 경유 (essential-rules.yaml)."
      - "Domain Service ↔ Domain Service 직접 호출 금지. 필요 시 UseCase 에서 조합."
      - "UseCase ↔ UseCase 직접 호출 금지. ChatMessageUseCase.sendMessage() 호출 금지 — ChatSaveService + ApplicationEventPublisher 분해 호출 (001/002 와 동일)."
      - "엔티티 상태 변경은 도메인 메서드(cancel())로만. setter 사용 금지 (essential-rules.yaml: NO @Setter)."

# ============================================================
# 테스트 전략
# ============================================================
testing_strategy:
  happy_path:
    - "신청자가 본인의 PENDING 신청을 취소 → 200, application.status=CANCELED 갱신 확인"
    - "취소 응답의 applicationId / postId / applicantId / status=CANCELED / chatRoomId / canceledAt 모두 정상 반환 확인"
    - "취소 처리 시 \"룸메이트 신청을 취소했습니다.\" 채팅이 신청자(applicantId) senderId 로 저장 확인 (messageType=APPLICATION_CANCELED, targetId=applicationId)"
    - "취소 처리 시 ChatMessageSentEvent 1회 발행, broadcast.senderId=applicantId, content=고정 문구로 검증"
    - "취소 후 모집글 status / RoommateGroupMember / 채팅방 자체는 변경되지 않음 확인"
    - "취소 후 동일 (postId, applicantId) 로 application/001 createApplication 호출 → 201 정상 생성 (재신청 허용 확인)"

  edge_cases:
    - "존재하지 않는 applicationId → 404 APPLICATION_NOT_FOUND"
    - "이미 deleted=true 인 신청 → 404 APPLICATION_NOT_FOUND"
    - "작성자(author)가 호출 → 403 APPLICATION_CANCEL_FORBIDDEN (PROCESS_FORBIDDEN 과 코드 구분 검증)"
    - "신청자/작성자 모두 아닌 제3자가 호출 → 403 APPLICATION_CANCEL_FORBIDDEN"
    - "이미 ACCEPTED 상태 신청을 취소 시도 → 409 INVALID_APPLICATION_STATUS, application.status=ACCEPTED 유지"
    - "이미 REJECTED 상태 신청을 취소 시도 → 409 INVALID_APPLICATION_STATUS, application.status=REJECTED 유지"
    - "이미 CANCELED 상태 신청을 다시 취소 시도 → 409 INVALID_APPLICATION_STATUS, application.status=CANCELED 유지 (idempotent 거부)"
    - "동시 요청으로 동일 신청에 두 cancel 요청 동시 도달 → 1건만 성공 (트랜잭션 + status 사전 조회로 직렬화. 비즈니스적으로 한 번만 성공시키려면 추후 @Version 검토 가능)"
    - "신청자-작성자 1:1 채팅방이 어떤 이유로 사라진 상태(시스템 무결성 오류) → 500 계열로 ChatRoomNotFoundException. 일반 흐름에선 도달 불가."

  unit_test_targets:
    - "RoommateApplication.cancel(): status=CANCELED 로 갱신되는지 검증"
    - "RoommateApplicationUseCase.cancelApplication: 각 검증 단계별 분기 (Mock Service)"
    - "신청자가 아닐 때 APPLICATION_CANCEL_FORBIDDEN 분기 검증 (작성자 호출 케이스 포함)"
    - "PENDING 외 상태(ACCEPTED / REJECTED / CANCELED)에서 INVALID_APPLICATION_STATUS 분기 검증 (각 상태별 파라미터화 테스트)"
    - "취소 성공 시 ChatSaveService.save(applicantId, chatRoom, 고정문구, APPLICATION_CANCELED, applicationId) 호출 검증"
    - "취소 성공 시 ChatMessageSentEvent 발행 + ArgumentCaptor 로 broadcast.senderId / content / messageType 필드 검증"
    - "취소 → 재신청 시나리오: cancelApplication 후 createApplication 호출이 ALREADY_APPLIED_PENDING 에 막히지 않는지 통합 흐름 검증"

# ============================================================
# 주의사항
# ============================================================
notes:
  - "본 스펙은 '신청 취소(CANCEL)' 만 다룬다. 신청자 권한 한정. 작성자에 의한 거절은 application/002 의 REJECTED 경로 사용."
  - "CANCELED 는 ACCEPTED / REJECTED 와 동일한 종착 상태이며, 다시 PENDING 으로 되돌릴 수 없다. 재신청은 새로운 RoommateApplication 행을 생성한다."
  - "취소 후 재신청 허용 정책은 REJECTED 와 동일하게 application/001 의 ALREADY_APPLIED_PENDING 검증(status=PENDING 기준)을 그대로 따르므로 신규 검증/코드 추가 없음."
  - "권한 분리: 002 의 APPLICATION_PROCESS_FORBIDDEN(40807, 작성자 아닌 자의 수락/거절 차단) 과 본 스펙의 APPLICATION_CANCEL_FORBIDDEN(40813, 신청자 아닌 자의 취소 차단)은 의미·메시지·주체가 다르므로 별도 코드로 관리한다. 두 코드 모두 403 FORBIDDEN."
  - "INVALID_APPLICATION_STATUS(40808) 는 002 와 공유. 이미 ACCEPTED/REJECTED 된 신청을 취소 시도하거나, 이미 CANCELED 된 신청을 다시 취소 시도하는 경우 모두 동일 코드로 거부."
  - "ApplicationStatus 에 CANCELED 가 추가되므로 references/data-model/application/roommate-application.yaml 의 enum 섹션 및 상태 머신 invariants 항목 동기화 필요. business_logic 에 cancel() 추가."
  - "MessageType.APPLICATION_CANCELED 가 추가되므로 chat 도메인 enum 및 (있다면) 관련 broadcast / FE 계약 문서 동기화 필요. 기존 APPLICATION_SENT / APPLICATION_ACCEPTED / APPLICATION_REJECTED 와 동일 패턴."
  - "ApplicationResponseCode 에 APPLICATION_CANCELED 신규 추가. 신규 ResponseCode 추가 시 별도 중복 검사 도구는 없으나 ApplicationErrorCode 의 check_error_codes.py 와 혼동 금지."
  - "안내 채팅 senderId 는 신청자(applicantId). 001 의 APPLICATION_SENT 와 짝을 이뤄 채팅방에서 '신청자가 보냄 → 신청자가 취소' 흐름이 시간순으로 노출된다. 002 의 ACCEPTED/REJECTED(senderId=authorId)와 발신자가 다른 점에 주의."
  - "신청 생성 시 채팅방이 보장(application/001)되었으므로 본 단계에선 채팅방이 존재한다고 전제. 미존재 시 시스템 무결성 오류 — ChatRoomNotFoundException 재사용 (chat 도메인 406xx)."
  - "ChatRoomCategory 는 002 와 동일하게 GENERAL 로 되돌린다. (001 에서 APPLICATION 으로 변경했던 카테고리를 신청 종결과 함께 일반 카테고리로 복원)"
  - "동시성: 동일 신청에 대한 cancel 동시 요청 / cancel+process 동시 요청 대비. @Transactional 격리 수준(default REPEATABLE_READ on MySQL InnoDB)으로 dirty checking 갱신은 안전하나, 한 번만 성공시키려면 application 엔티티에 @Version 추가(낙관적 락) 검토 가능. 본 스펙은 우선 사전 조회 + 트랜잭션 처리로 시작 (002 와 동일 정책)."
  - "취소 알림(푸시/이메일)은 본 스펙 범위 밖. 별도 알림 스펙에서 다룬다."
  - "Hard Delete 정책 위반 여부: 본 스펙은 status 전이만 사용하고 BaseEntity.deleted 는 건드리지 않으므로 'NO Hard Delete' 규칙(essential-rules.yaml)과 무관. CANCELED 는 도메인 상태이지 삭제가 아니다."
