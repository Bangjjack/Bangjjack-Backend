# 주의사항
# ============================================================
notes:
  - "본 스펙은 '신청 보내기(POST)'만 다룬다. 수락/거절/취소/조회는 별도 스펙(002~)으로 분리하여 작성한다."
  - "API 진입점이 user 기반으로 바뀌었지만 도메인 루트는 여전히 RoommatePost이다. 그룹 생성/멤버십/정원/채팅방 derive 로직은 모두 post 중심으로 유지되며, UseCase 진입 한 줄에서 user → OPEN post 매핑만 일어난다 (domain_model_rationale 참조)."
  - "1유저-1OPEN 모집글 제약(post/001의 createPost 사전 검증)이 본 매핑의 결정성(0 또는 1건)을 보증한다. 이 제약이 깨지면 NO_OPEN_POST_FOR_USER가 아닌 ambiguity가 발생하므로, post/001을 변경할 때는 본 스펙도 함께 검토 필요."
  - "Application 도메인(408xx) 에러 코드는 신규 도메인 범위이다. essential-rules.yaml의 'NO Duplicate Error Codes' 규칙에 따라 추가 시 check_error_codes.py 실행 필수."
  - "RoommateApplication 엔티티는 신규 도메인이므로 references/data-model/application/roommate-application.yaml 문서 추가 권장."
  - "ChatRoom 자동 생성은 chat 도메인의 ChatRoomCreateService.createDirectRoom() 재사용. 신규 로직 중복 구현 금지(Layered DDD: Domain Service 간 직접 호출 금지 규칙에 따라 UseCase에서 조합)."
  - "RoommateApplication ↔ ChatRoom FK는 의도적으로 두지 않는다. 채팅방은 신청의 side effect이며 (applicant, author) 유저 쌍에서 derivable."
  - "신청 채팅 전송은 ChatMessageUseCase.sendMessage()를 직접 호출하지 않고 ChatSaveService.save() + ApplicationEventPublisher.publishEvent(ChatMessageSentEvent) 조합으로 처리."
  - "[2026-05-27 반영] postId 기반 → userId 기반 단일 엔드포인트로 교체. UI 플로우(모집글 → 채팅하기 → 신청)에서 채팅방이 postId를 들고 있지 않은 점을 반영. POST_NOT_OPEN(40803) 제거, NO_OPEN_POST_FOR_USER(40812) 추가."
  - "[2026-05-19 반영] 신청자 중복 소속 사전 검증 추가. application/002 수락 시점에서도 동일 검증을 수행하지만, 신청 시점 차단이 사용자 UX 측면에서 명확하므로 조기 실패시킴."
  - "고정 문구 \"룸메이트 신청을 보냈습니다.\"는 RoommateApplicationUseCase.APPLICATION_CHAT_MESSAGE 상수로 관리. 추후 i18n/메시지 카탈로그가 도입되면 이관."
  - "수락 시 모집글 자동 마감 정책은 적용하지 않는다 (작성자 수동 마감)."
  - "REJECTED 이후 재신청은 허용한다. PENDING 동시 존재만 차단 대상."
  - "동시성: 동일 (targetUserId, applicantId) PENDING 중복 차단의 강건성은 대상 OPEN post 행에 대한 PESSIMISTIC_WRITE 락으로 직렬화하여 확보한다."
  - "신청 후 알림(푸시/이메일)은 본 스펙 범위 밖. 별도 알림 스펙에서 다룬다."
