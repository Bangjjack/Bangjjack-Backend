# Feature Specification: 룸메이트 신청 요청 보내기
# Status: Draft
# Last Updated: 2026-05-27

meta:
  id: FEAT-013
  title: 룸메이트 신청 요청 보내기
  type: Feature
  author: 1winhyun

overview:
  summary: >
    인증된 사용자가 채팅방의 상대 사용자에게 룸메이트 신청을 보낸다.
    UI 플로우는 모집글 → 채팅하기 → 신청 보내기 순서로 진행되므로
    API 표면은 채팅 상대(userId)를 받고, 서버 내부에서 1유저-1OPEN 모집글 제약을 활용해
    해당 사용자의 현재 OPEN 모집글로 결정적으로 매핑한다.
    신청은 PENDING 상태로 생성되며, 작성자가 수락/거절할 때까지 유지된다.
    신청 시점에 신청자와 모집글 작성자 간 1:1 채팅방이 존재하지 않으면 함께 생성하여
    별도 절차 없이 즉시 대화를 시작할 수 있도록 한다.
    수락 시에도 모집글 상태는 자동 변경되지 않으며, 작성자가 수동으로 마감한다.
  user_story: >
    As a 온보딩/체크리스트/선호도 등록 완료 사용자, I want to 채팅 상대(모집글 작성자)에게 룸메이트 신청을 보내고,
    so that 작성자에게 의사를 전달하고 즉시 1:1 채팅으로 대화를 이어갈 수 있다.
    신청 시 별도 메시지/본문은 입력하지 않으며, 후속 대화는 자동 생성되는 1:1 채팅방에서 진행한다.
  goals:
    - 대상 사용자(targetUserId)의 현재 OPEN 모집글에 PENDING 상태 신청 생성
    - 1유저-1OPEN 모집글 제약(post/001)에 기반하여 user → post 결정적 매핑
    - 신청자와 모집글 작성자 간 1:1 채팅방 자동 연결 (없으면 생성)
    - 신청 시 신청자 명의로 "룸메이트 신청을 보냈습니다." 고정 문구 채팅 자동 전송 + WebSocket broadcast
    - 사전 등록 정보(온보딩/체크리스트/선호도) 미완료자 신청 차단
    - 본인에게 신청 시도 차단 (targetUserId == requesterId)
    - 본인의 OPEN 모집글이 존재하는 사용자(작성자 역할)의 신청 차단
    - 동일 모집글에 대한 PENDING 중복 신청 차단 (거절 후 재신청은 허용)
    - 신청자가 이미 다른 RoommateGroup의 MEMBER 역할이면 신청 차단 (조기 실패, application/002 수락 시점에서도 재검증)

# ============================================================
# API 명세
# ============================================================
technical_spec:
  api:
    - method: POST
      path: /api/v1/users/{userId}/applications
      summary: 룸메이트 신청 요청 보내기 (대상 사용자의 OPEN 모집글 대상, 없으면 1:1 채팅방 동반 생성)
      auth: MEMBER (Bearer Token, 필수)
      request:
        path_variable:
          - name: userId
            type: Long
            required: true
            note: "신청 대상 사용자(모집글 작성자)의 User ID. 서버 내부에서 해당 사용자의 OPEN 모집글로 매핑된다."
        dto: "(없음)"
        body: "(없음 — 요청 본문 없이 신청 전송)"
        fields: []
      response:
        dto: CreateRoommateApplicationResponse
        http_status: 201 CREATED
        wrapper: CommonResponse<CreateRoommateApplicationResponse>
        response_code: ApplicationResponseCode.APPLICATION_CREATED
        fields:
          - name: applicationId
            type: Long
            note: "생성된 신청 ID"
          - name: postId
            type: Long
            note: "서버 내부에서 매핑된 대상 OPEN 모집글 ID (FE 후속 화면 전환 등에 사용)"
          - name: applicantId
            type: Long
          - name: status
            type: String (Enum)
            note: "PENDING (생성 시 고정)"
          - name: chatRoomId
            type: Long
            note: "신청자-작성자 1:1 채팅방 ID (기존 재사용 또는 신규 생성)"
          - name: isNewChatRoom
            type: Boolean
            note: "이번 신청으로 채팅방을 새로 생성했는지 여부"
          - name: createdAt
            type: LocalDateTime

  data_flow:
    - step: 1
      layer: Presentation (RoommateApplicationController)
      action: "@CurrentMemberId로 JWT에서 memberId 추출, @PathVariable Long userId 수신(=targetUserId) 후 RoommateApplicationUseCase.createApplication(memberId, userId) 호출 (요청 본문 없음)"
    - step: 2
      layer: UseCase (RoommateApplicationUseCase)
      transaction: true
      action: "targetUserId == requesterId 사전 차단 → 본인에게 신청 시도이면 CANNOT_APPLY_TO_OWN_POST. 별도 lookup 없이 조기 실패."
    - step: 3
      layer: UseCase (RoommateApplicationUseCase)
      action: "UserGetService.getById(memberId)로 신청자 User 조회 (없으면 USER_NOT_FOUND)"
    - step: 4
      layer: UseCase (RoommateApplicationUseCase)
      action: "신청자의 isOnboarded / isChecklistRegistered / isRoommatePreferenceRegistered 모두 true 검증 → 미충족 시 APPLICATION_PRECONDITION_NOT_MET"
    - step: 5
      layer: UseCase (RoommateApplicationUseCase)
      action: "RoommatePostGetService.findOpenWithUserByUserIdForUpdate(targetUserId) 호출. 결과 비어있으면 NO_OPEN_POST_FOR_USER. PESSIMISTIC_WRITE 락으로 동시 신청 직렬화. 1유저-1OPEN 모집글 제약(post/001)이 결정성을 보장."
    - step: 6
      layer: UseCase (RoommateApplicationUseCase)
      action: "RoommatePostGetService.existsOpenPostByUser(applicant) 검증 → 신청자가 OPEN 모집글의 작성자이면 OWN_OPEN_POST_EXISTS_FOR_APPLICANT"
    - step: 7
      layer: UseCase (RoommateApplicationUseCase)
      action: "RoommateApplicationGetService.existsPendingByPostIdAndApplicantId(postId, memberId) 검증 → 존재 시 ALREADY_APPLIED_PENDING"
    - step: 8
      layer: UseCase (RoommateApplicationUseCase)
      action: "RoommateGroupMemberGetService.existsByUserIdAndRole(memberId, MEMBER) 검증 → 신청자가 이미 다른 그룹의 MEMBER 역할이면 APPLICANT_ALREADY_IN_GROUP. LEADER 역할 보유는 step 6에서 이미 차단됨."
    - step: 9
      layer: UseCase (RoommateApplicationUseCase)
      action: "ChatRoomGetService로 (memberId, targetUserId) 기준 directRoomKey 조회 → 존재 시 기존 chatRoom 사용 (isNewChatRoom=false), 없으면 ChatRoomCreateService.createDirectRoom(memberId, targetUserId) 호출 (isNewChatRoom=true)"
    - step: 10
      layer: Domain (RoommateApplication Entity)
      action: "RoommateApplication.create(post, applicant) 정적 팩토리 메서드 호출 → status=PENDING 으로 초기화. ChatRoom은 엔티티에 보관하지 않음 (필요 시 (applicantId, authorId)로 derive)"
    - step: 11
      layer: Infrastructure (RoommateApplicationRepository)
      action: "save(application)로 신청 영속화"
    - step: 12
      layer: Domain Service (ChatSaveService)
      action: "ChatSaveService.save(applicantId, chatRoom, \"룸메이트 신청을 보냈습니다.\", APPLICATION_SENT) 호출 → Chat 엔티티 영속화. senderId는 신청자(applicant) ID."
    - step: 13
      layer: UseCase (RoommateApplicationUseCase)
      action: "chatRoom.updateCategory(APPLICATION) 적용 + ApplicationEventPublisher로 ChatMessageSentEvent 발행 → WebSocketBroadcaster 자동 송신."
    - step: 14
      layer: Response
      action: "CreateRoommateApplicationResponse.from(application, chatRoom.getId(), isNewChatRoom) 생성 후 201 CREATED, CommonResponse<…> 반환."

  response_dto_structure:
    CreateRoommateApplicationResponse:
      note: "static factory method from(RoommateApplication, Long chatRoomId, boolean isNewChatRoom) 사용"
      source_fields:
        - "applicationId ← application.getId()"
        - "postId ← application.getPost().getId() (userId 기반 매핑으로 도출된 OPEN post)"
        - "applicantId ← application.getApplicant().getId()"
        - "status ← application.getStatus()"
        - "chatRoomId ← UseCase가 확보한 ChatRoom 인스턴스의 id를 파라미터로 전달 (application에는 chatRoom 참조 없음)"
        - "isNewChatRoom ← 파라미터로 전달"
        - "createdAt ← application.getCreatedAt()"

  database:
    entities:
      - name: RoommateApplication
        action: Create
        fields: "post_id, applicant_id (user_id FK), status=PENDING"
        note: |
          신규 도메인 엔티티. 별도 references/data-model/application/roommate-application.yaml 작성 권장.
          post_id는 userId 기반 API에서도 그대로 보존됨 — 신청 도메인의 정체성은 모집글에 묶이며,
          userId는 API 진입점의 식별자일 뿐 도메인 루트가 아니다.
          ChatRoom과의 FK는 의도적으로 보유하지 않음 — 채팅방은 (applicantId, authorId) 유저 쌍의 함수이며
          ChatRoom.directRoomKey로 idempotent하게 derive 가능.
      - name: ChatRoom
        action: "Read or Create"
        fields: "direct_room_key 기준 조회. 없으면 createDirect()"
        note: "기존 chat 도메인 서비스 재사용. Application 생성의 side effect로 보장만 함 (FK 저장 없음)."
      - name: ChatRoomParticipant
        action: "Read or Create"
        fields: "신규 채팅방 생성 시 2건(신청자, 작성자) saveAll"
        note: "chat 도메인 위임"
      - name: Chat
        action: Create
        fields: "user_id=applicantId, room_id=chatRoom.id, content=\"룸메이트 신청을 보냈습니다.\", message_type=APPLICATION_SENT"
        note: "신청자 명의로 고정 문구 채팅 1건 자동 생성. ChatSaveService.save() 호출 후 ChatMessageSentEvent 발행."

  domain_model_rationale:
    title: "왜 userId를 받지만 도메인은 post 중심을 유지하는가"
    points:
      - "RoommateGroup은 모집글 작성 시점에 1:1로 함께 생성되고 작성자가 LEADER로 자동 입주된다 (post/001 참조). 즉 신청 수락은 '새 그룹 생성'이 아니라 '기존 그룹에 MEMBER 추가'이며, 그룹의 정체성은 post에 묶여있다."
      - "RoommatePostUseCase.createPost에서 1유저-1OPEN 모집글 제약을 보장한다. 따라서 (userId, status=OPEN) 조회는 결정적으로 0건 또는 1건이며, userId는 사실상 '현재 모집 중인 글'의 별명(alias)으로 기능한다."
      - "이 제약 위에서 API 표면은 사용자가 인지하는 식별자(사람)로 노출하되, 도메인 내부의 모든 invariant(정원, 그룹 멤버십, 채팅방 derive)는 post 중심을 유지한다. 결과적으로 API 표면의 변경은 UseCase 진입부 한 줄(user → OPEN post 매핑)에 국한된다."

  error_codes:
    domain_range: "408xx (Application 도메인)"
    note: "신규 코드 추가 시 check_error_codes.py 실행 필수 (essential-rules.yaml)."
    codes:
      - code: 40801
        name: APPLICATION_PRECONDITION_NOT_MET
        status: 400 BAD_REQUEST
        message: "신청 전 온보딩, 체크리스트, 선호도 등록을 완료해주세요."
        trigger: "신청자의 isOnboarded / isChecklistRegistered / isRoommatePreferenceRegistered 중 하나라도 false인 경우"
      - code: 40802
        name: CANNOT_APPLY_TO_OWN_POST
        status: 400 BAD_REQUEST
        message: "본인이 작성한 모집글에는 신청할 수 없습니다."
        trigger: "targetUserId == requesterId. 1유저-1OPEN 제약 하에서 자기 자신을 대상으로 한 신청은 곧 자기 모집글 신청이므로 동일 코드 사용."
      - code: 40804
        name: ALREADY_APPLIED_PENDING
        status: 409 CONFLICT
        message: "이미 처리되지 않은 신청이 존재합니다."
        trigger: "동일 (postId, applicantId)에 status=PENDING인 신청이 존재할 때"
      - code: 40805
        name: OWN_OPEN_POST_EXISTS_FOR_APPLICANT
        status: 409 CONFLICT
        message: "본인의 모집글이 모집 중인 동안에는 다른 모집글에 신청할 수 없습니다."
        trigger: "신청자가 OPEN 상태 모집글의 작성자인 경우"
      - code: 40811
        name: APPLICANT_ALREADY_IN_GROUP
        status: 409 CONFLICT
        message: "신청자가 이미 다른 룸메이트 그룹에 소속되어 있습니다."
        trigger: "신청자가 다른 RoommateGroup의 MEMBER 역할로 이미 등록된 경우. application/002와 동일 코드 재사용."
        note: "application/002에서 정의된 코드. 본 스펙은 사전 차단(조기 실패)용으로 동일 코드 재사용."
      - code: 40812
        name: NO_OPEN_POST_FOR_USER
        status: 404 NOT_FOUND
        message: "해당 사용자는 현재 모집 중인 룸메이트 모집글이 없습니다."
        trigger: "targetUserId 사용자가 status=OPEN, deleted=false 인 모집글을 보유하지 않은 경우. 모집글이 마감/삭제된 직후 채팅방에서 신청을 시도하는 시나리오에서 발생."
        note: "이전 POST_NOT_OPEN(40803)을 대체. API 진입점이 user 기반이므로 메시지가 'user 관점'으로 자연스럽게 바뀜."
      - code: 40203
        name: USER_NOT_FOUND
        status: 404 NOT_FOUND
        message: "사용자를 찾을 수 없습니다."
        trigger: "JWT memberId로 신청자 User 조회 실패 시"
        note: "User 도메인(402xx) 공용 코드 재사용. targetUserId 자체의 존재 검증은 별도로 하지 않으며, OPEN 모집글 조회 결과(NO_OPEN_POST_FOR_USER)로 묶어 처리한다."

  removed_codes:
    - code: 40803
      name: POST_NOT_OPEN
      reason: "userId 기반 진입점 도입으로 도달 불가능해짐. CLOSED/DELETED 모집글은 OPEN 조회 단계에서 NO_OPEN_POST_FOR_USER로 흡수된다."
      removed_at: "2026-05-27"

  validation_rules:
    - "인증된 MEMBER만 신청 가능"
    - "targetUserId != requesterId 이어야 함 (자기 자신 대상 신청 차단)"
    - "신청자는 isOnboarded, isChecklistRegistered, isRoommatePreferenceRegistered 모두 true여야 함"
    - "대상 사용자에게 status=OPEN, deleted=false 인 모집글이 1건 존재해야 함 (없으면 NO_OPEN_POST_FOR_USER). 1유저-1OPEN 제약(post/001)에 의해 결과는 0 또는 1건."
    - "신청자가 본인 명의의 OPEN 모집글 작성자이면 신청 불가 (LEADER 역할 + 본인 OPEN 모집글 보유 시 차단)"
    - "신청자가 이미 다른 RoommateGroup의 MEMBER 역할이면 신청 불가 (1인 MEMBER 1개 정책). LEADER 역할 보유와는 별개로 카운트."
    - "동일 (postId, applicantId)에 PENDING 신청이 이미 존재하면 신청 불가. REJECTED 처리된 이전 신청은 재신청 허용."
    - "수락(다음 스펙)되더라도 모집글 status는 자동 변경되지 않음. 작성자가 수동 마감."
    - "신청 생성 시 신청자-작성자 간 1:1 채팅방이 없으면 ChatRoom 도메인 서비스를 통해 함께 생성, 있으면 기존 방 재사용 (응답에 chatRoomId만 포함, RoommateApplication에는 FK 저장 안 함)"
    - "신청 생성 시 신청자(applicant) 명의로 고정 문구 \"룸메이트 신청을 보냈습니다.\" 채팅 1건 자동 전송. ChatMessageSentEvent 발행으로 WebSocket 실시간 broadcast 수행."
    - "요청 본문 없음. 신청 시 사용자가 입력하는 메시지/본문 없음 (대화는 자동 생성되는 채팅방에서 진행)."

  dependencies:
    domain_services:
      - UserGetService.getById(memberId)
      - RoommatePostGetService.findOpenWithUserByUserIdForUpdate(targetUserId) — 신규 메서드 (PESSIMISTIC_WRITE)
      - RoommatePostGetService.existsOpenPostByUser(applicant)
      - ChatRoomGetService.findByDirectRoomKey(directRoomKey)
      - ChatRoomCreateService.createDirectKey(userIdA, userIdB)
      - ChatRoomCreateService.createDirectRoom(applicantId, authorId, directRoomKey)
      - ChatSaveService.save(senderId, chatRoom, content, messageType)
      - RoommateApplicationGetService.existsPendingByPostIdAndApplicantId(postId, applicantId)
      - RoommateGroupMemberGetService.existsByUserIdAndRole(userId, MEMBER)
      - RoommateApplicationCreateService.createApplication(application)
    spring_infrastructure:
      - ApplicationEventPublisher.publishEvent(ChatMessageSentEvent) — WebSocketBroadcaster가 listen
      - ApplicationEventPublisher.publishEvent(ChatRoomCreatedEvent) — 채팅방 신규 생성 시
    constraint_check:
      - "UseCase는 Repository 직접 호출 금지. 반드시 Domain Service 경유 (essential-rules.yaml)."
      - "Domain Service ↔ Domain Service 직접 호출 금지. 필요 시 UseCase에서 조합."
      - "UseCase ↔ UseCase 직접 호출 금지. ChatMessageUseCase.sendMessage()를 호출하지 않고 ChatSaveService + ApplicationEventPublisher로 분해 호출."

# ============================================================
# 테스트 전략
# ============================================================
testing_strategy:
  happy_path:
    - "유효한 신청자가 대상 사용자(OPEN 모집글 보유자)에게 신청 → 201, RoommateApplication(status=PENDING) 저장, applicationId 반환, postId 응답에 포함"
    - "신청자-작성자 간 채팅방이 없는 상태에서 신청 → ChatRoom 신규 생성, ChatRoomParticipant 2명 저장, isNewChatRoom=true 반환"
    - "신청자-작성자 간 채팅방이 이미 존재할 때 신청 → 기존 chatRoomId 반환, isNewChatRoom=false, 신규 채팅방/참여자 INSERT 없음 확인"
    - "이전 신청이 REJECTED 처리되어 있는 동일 모집글에 재신청 → 201, 새로운 RoommateApplication(PENDING) 생성"
    - "신청 성공 시 신청자(applicant) senderId, 고정 문구 \"룸메이트 신청을 보냈습니다.\" 내용의 Chat 1건 저장 확인"
    - "신청 성공 시 ChatMessageSentEvent가 1회 발행되며 broadcast.senderId=applicantId, content=고정 문구로 검증"

  edge_cases:
    - "targetUserId == requesterId (자기 자신 대상) → 400 CANNOT_APPLY_TO_OWN_POST. User 조회 이전 단계에서 조기 차단."
    - "신청자 isOnboarded=false → 400 APPLICATION_PRECONDITION_NOT_MET"
    - "신청자 isChecklistRegistered=false → 400 APPLICATION_PRECONDITION_NOT_MET"
    - "신청자 isRoommatePreferenceRegistered=false → 400 APPLICATION_PRECONDITION_NOT_MET"
    - "대상 사용자에게 OPEN 모집글 없음 (CLOSED/삭제/미작성) → 404 NO_OPEN_POST_FOR_USER"
    - "신청자 본인의 OPEN 모집글이 존재할 때 다른 사용자에게 신청 → 409 OWN_OPEN_POST_EXISTS_FOR_APPLICANT"
    - "신청자가 이미 다른 RoommateGroup의 MEMBER 역할일 때 신청 → 409 APPLICANT_ALREADY_IN_GROUP"
    - "동일 (postId, applicantId)에 PENDING 신청이 이미 존재 → 409 ALREADY_APPLIED_PENDING"
    - "존재하지 않는 userId (JWT 변조) → 404 USER_NOT_FOUND"
    - "동시 요청으로 동일 (targetUserId, applicantId) 신청 2건이 거의 동시에 들어와도 1건만 PENDING으로 남아야 함 (대상 OPEN post 행에 대한 PESSIMISTIC_WRITE 락으로 직렬화)"

  unit_test_targets:
    - "RoommateApplication.create: status=PENDING으로 초기화되는지 검증"
    - "RoommateApplicationUseCase.createApplication: 각 검증 단계별 분기 (Mock Service)"
    - "targetUserId == requesterId 조기 차단 분기 검증 (User 조회 호출되지 않음)"
    - "대상 사용자에게 OPEN 모집글 없음 분기 검증 (findOpenWithUserByUserIdForUpdate가 Optional.empty 반환)"
    - "기존 채팅방 존재 시 신규 생성하지 않고 재사용하는 분기 검증"
    - "신청자 본인 OPEN 모집글 존재 시 차단 분기 검증"
    - "PENDING 중복 신청 차단 분기 검증"
    - "신청 성공 시 ChatSaveService.save(applicantId, chatRoom, 고정문구) 호출 검증"
    - "신청 성공 시 ChatMessageSentEvent 발행 + ArgumentCaptor로 broadcast 필드 검증"

